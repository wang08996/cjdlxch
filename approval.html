<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>审批 - 郴江电力管理系统</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#e9ecf1; }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }

  .phone {
    width:375px; height:812px; background:#f4f6f9; border-radius:36px; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.18); position:relative; display:flex; flex-direction:column;
  }
  .statusbar {
    height:44px; background:#fff; display:flex; align-items:center; justify-content:space-between;
    padding:0 22px; font-size:14px; font-weight:600; color:#000; flex-shrink:0;
  }
  .statusbar .right { display:flex; align-items:center; gap:6px; font-size:12px; }

  /* 顶部导航 */
  .navbar {
    height:44px; background:#fff; display:flex; align-items:center; justify-content:center;
    position:relative; border-bottom:1px solid #f0f0f0; flex-shrink:0;
  }
  .navbar .back {
    position:absolute; left:12px; width:32px; height:32px; display:flex; align-items:center;
    justify-content:center; cursor:pointer; color:#333;
  }
  .navbar .title { font-size:17px; font-weight:600; color:#222; }

  /* Tab 切换 */
  .tabs {
    background:#fff; display:flex; padding:0 12px; height:42px; align-items:center;
    border-bottom:1px solid #f0f0f0; flex-shrink:0;
  }
  .tab {
    flex:1; text-align:center; font-size:14px; color:#666; cursor:pointer; position:relative;
    line-height:42px;
  }
  .tab.active { color:#2B7CDB; font-weight:600; }
  .tab.active::after {
    content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:24px; height:3px; background:#2B7CDB; border-radius:2px;
  }
  .tab .count {
    display:inline-block; background:#E74C3C; color:#fff; font-size:10px;
    border-radius:8px; padding:0 5px; height:14px; line-height:14px; margin-left:2px;
  }

  /* 搜索框 */
  .search-bar { padding:10px 12px; background:#f4f6f9; flex-shrink:0; }
  .search-box {
    background:#fff; border-radius:18px; height:34px; display:flex; align-items:center;
    padding:0 14px; color:#999; font-size:13px;
  }
  .search-box svg { width:14px; height:14px; margin-right:6px; }

  /* 内容 */
  .content { flex:1; overflow-y:auto; padding:8px 12px 70px; }

  /* 审批卡片 */
  .approval-card {
    background:#fff; border-radius:8px; padding:14px; margin-bottom:10px;
    position:relative;
  }
  .card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .card-type { font-size:14px; font-weight:600; color:#222; }
  .card-status {
    font-size:11px; color:#999; background:#f2f2f2; padding:2px 8px; border-radius:3px;
  }
  .card-priority { font-size:12px; color:#E74C3C; font-weight:600; }
  .row { font-size:13px; color:#555; line-height:1.8; }
  .row .label { color:#888; }
  .row .value { color:#333; }
  .desc {
    font-size:13px; color:#333; line-height:1.6; margin-top:6px;
    background:#f9fafc; padding:8px 10px; border-radius:4px;
  }
  .handle-btn {
    display:block; margin:12px auto 0; padding:8px 36px; border:1px solid #ddd;
    background:#fff; border-radius:4px; font-size:14px; color:#333; cursor:pointer;
  }
  .handle-btn:active { background:#f5f5f5; }

  /* 底部Tab栏 */
  .tabbar {
    position:absolute; left:0; right:0; bottom:0; height:62px; background:#fff;
    border-top:1px solid #eee; display:flex; padding-bottom:6px;
  }
  .tab-item {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:11px; color:#888; cursor:pointer; position:relative; text-decoration:none;
  }
  .tab-item.active { color:#2B7CDB; }
  .tab-item svg { width:22px; height:22px; margin-bottom:3px; }
  .tab-badge {
    position:absolute; top:4px; right:calc(50% - 18px); background:#E74C3C; color:#fff;
    font-size:10px; min-width:16px; height:16px; line-height:16px; border-radius:8px;
    text-align:center; padding:0 4px;
  }

  .toast {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    background:rgba(0,0,0,.75); color:#fff; padding:10px 18px; border-radius:6px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:99;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <span>9:41 AM</span>
      <div class="right">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="#000"><rect x="0" y="7" width="3" height="4"/><rect x="4" y="5" width="3" height="6"/><rect x="8" y="2.5" width="3" height="8.5"/><rect x="12" y="0" width="3" height="11"/></svg>
        <span>100%</span>
        <svg width="22" height="11" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" fill="none" stroke="#000"/><rect x="2" y="2" width="17" height="8" rx="1" fill="#000"/></svg>
      </div>
    </div>

    <div class="navbar">
      <div class="back" onclick="location.href='workbench.html'">
        <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="#333" stroke-width="2"><polyline points="10,2 2,10 10,18"/></svg>
      </div>
      <div class="title">审批</div>
    </div>

    <div class="tabs">
      <div class="tab active">待办 <span class="count">12</span></div>
      <div class="tab">已办</div>
      <div class="tab">我的</div>
      <div class="tab">抄送</div>
    </div>

    <div class="search-bar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        搜索待办任务
      </div>
    </div>

    <div class="content">
      <!-- 卡片1：普通 -->
      <div class="approval-card">
        <div class="card-head">
          <div class="card-type">日常付款审批 <span style="color:#bbb;font-weight:normal;">›</span></div>
          <div style="display:flex; gap:10px; align-items:center;">
            <span class="card-status">审批中</span>
            <span class="card-priority">普通</span>
          </div>
        </div>
        <div class="row"><span class="label">发起人:</span> <span class="value">张三/郴州公司/新能源管理中心</span> <span style="float:right;color:#999;font-size:12px;">11-2 08:20</span></div>
        <div class="row"><span class="label">审批人:</span> <span class="value">李四</span></div>
        <div class="desc">说 明：中国石化湖南郴州石油分公司汝城区域充电桩高压配电工程</div>
        <button class="handle-btn" onclick="toast('进入办理页')">办 理</button>
      </div>

      <!-- 卡片2：加急 -->
      <div class="approval-card">
        <div class="card-head">
          <div class="card-type">日常付款审批 <span style="color:#bbb;font-weight:normal;">›</span></div>
          <div style="display:flex; gap:10px; align-items:center;">
            <span class="card-status">审批中</span>
            <span class="card-priority">加急</span>
          </div>
        </div>
        <div class="row"><span class="label">发起人:</span> <span class="value">张三/郴州公司/新能源管理中心</span> <span style="float:right;color:#999;font-size:12px;">11-2 08:20</span></div>
        <div class="row"><span class="label">审批人:</span> <span class="value">李四</span></div>
        <div class="desc">说 明：苏仙区飞天山镇宝安瑶族村村民委员会屋顶光伏发电项目</div>
        <button class="handle-btn" onclick="toast('进入办理页')">办 理</button>
      </div>
    </div>

    <div class="tabbar">
      <a class="tab-item" href="workbench.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9z"/></svg>
        工作台
      </a>
      <a class="tab-item active" href="approval.html">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="9" y1="8" x2="15" y2="8" stroke="#fff" stroke-width="1.5"/><line x1="9" y1="12" x2="15" y2="12" stroke="#fff" stroke-width="1.5"/></svg>
        审批
        <span class="tab-badge">12</span>
      </a>
      <a class="tab-item" href="site.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 3.5l1.5 1.5L20 3"/></svg>
        现场管理
      </a>
      <a class="tab-item" href="profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
        我的
      </a>
    </div>

    <div class="toast" id="toast"></div>
  </div>

<script>
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
      t.classList.add('active');
    });
  });
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1000);
  }
</script>
</body>
</html>
