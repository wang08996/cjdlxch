<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作台 - 郴江电力管理系统</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#e9ecf1; }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }

  .phone {
    width:375px; height:812px; background:#f4f6f9; border-radius:36px; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.18); position:relative; display:flex; flex-direction:column;
  }

  /* 状态栏 */
  .statusbar {
    height:44px; background:#fff; display:flex; align-items:center; justify-content:space-between;
    padding:0 22px; font-size:14px; font-weight:600; color:#000; flex-shrink:0;
  }
  .statusbar .right { display:flex; align-items:center; gap:6px; font-size:12px; }

  /* 内容滚动区 */
  .content { flex:1; overflow-y:auto; padding-bottom:70px; }

  /* 用户信息卡 */
  .user-card {
    background:#fff; margin:12px; border-radius:8px; padding:14px;
    display:flex; align-items:center; gap:12px;
  }
  .user-logo {
    width:48px; height:48px; border-radius:8px; flex-shrink:0;
    background:linear-gradient(135deg,#1a3a8c,#2B7CDB);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; font-weight:bold;
  }
  .user-info .org { font-size:14px; color:#222; font-weight:600; }
  .user-info .welcome { font-size:12px; color:#888; margin-top:4px; }

  /* 通知公告 */
  .notice-card { background:#fff; margin:0 12px 12px; border-radius:8px; padding:14px; }
  .notice-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .notice-head .title { font-size:15px; font-weight:600; color:#222; }
  .notice-head .more { font-size:12px; color:#999; cursor:pointer; }
  .notice-item { display:flex; align-items:flex-start; padding:6px 0; font-size:13px; line-height:1.5; }
  .tag {
    flex-shrink:0; font-size:11px; padding:1px 6px; border-radius:3px; margin-right:8px; margin-top:2px;
  }
  .tag-tongzhi { background:#E8F1FB; color:#2B7CDB; }
  .tag-gonggao { background:#FDECEA; color:#E74C3C; }
  .notice-text { flex:1; color:#333; }
  .badge-new { color:#E74C3C; font-size:11px; margin-left:4px; }
  .notice-date { color:#999; font-size:11px; margin-left:6px; flex-shrink:0; }

  /* 日常应用 */
  .section-title { font-size:15px; font-weight:600; color:#222; margin:6px 16px 10px; }
  .app-grid {
    background:#fff; margin:0 12px; border-radius:8px; padding:16px 0;
    display:grid; grid-template-columns:repeat(4,1fr); row-gap:18px;
  }
  .app-item { display:flex; flex-direction:column; align-items:center; cursor:pointer; }
  .app-icon {
    width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    margin-bottom:6px;
  }
  .app-icon svg { width:22px; height:22px; }
  .app-label { font-size:12px; color:#333; }
  .bg-blue { background:#E8F1FB; }
  .bg-purple { background:#F0E8FB; }
  .bg-cyan { background:#E5F4F6; }
  .bg-orange { background:#FDEEE3; }

  /* 底部Tab栏 */
  .tabbar {
    position:absolute; left:0; right:0; bottom:0; height:62px; background:#fff;
    border-top:1px solid #eee; display:flex; padding-bottom:6px;
  }
  .tab-item {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:11px; color:#888; cursor:pointer; position:relative; text-decoration:none;
  }
  .tab-item.active { color:#2B7CDB; }
  .tab-item svg { width:22px; height:22px; margin-bottom:3px; }
  .tab-badge {
    position:absolute; top:4px; right:calc(50% - 18px); background:#E74C3C; color:#fff;
    font-size:10px; min-width:16px; height:16px; line-height:16px; border-radius:8px;
    text-align:center; padding:0 4px;
  }

  .toast {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    background:rgba(0,0,0,.75); color:#fff; padding:10px 18px; border-radius:6px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:99;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <span>9:41 AM</span>
      <div class="right">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="#000"><rect x="0" y="7" width="3" height="4"/><rect x="4" y="5" width="3" height="6"/><rect x="8" y="2.5" width="3" height="8.5"/><rect x="12" y="0" width="3" height="11"/></svg>
        <span>100%</span>
        <svg width="22" height="11" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" fill="none" stroke="#000"/><rect x="2" y="2" width="17" height="8" rx="1" fill="#000"/></svg>
      </div>
    </div>

    <div class="content">
      <!-- 用户信息 -->
      <div class="user-card">
        <div class="user-logo">C</div>
        <div class="user-info">
          <div class="org">综合管理中心 / 产品经理 / 王春海</div>
          <div class="welcome">欢迎您使用 郴江电力内部管理系统</div>
        </div>
      </div>

      <!-- 通知公告 -->
      <div class="notice-card">
        <div class="notice-head">
          <div class="title">通知公告</div>
          <div class="more" onclick="toast('更多通知')">更多 &gt;</div>
        </div>
        <div class="notice-item">
          <span class="tag tag-tongzhi">通知</span>
          <span class="notice-text">关于源代码知识产权权属的工作函<span class="badge-new">new</span></span>
          <span class="notice-date">11-2</span>
        </div>
        <div class="notice-item">
          <span class="tag tag-gonggao">公告</span>
          <span class="notice-text">关于集团公司1.0线上管理系统正式上线暨开展系统操作培训的通知</span>
          <span class="notice-date">09-29</span>
        </div>
      </div>

      <!-- 日常 -->
      <div class="section-title">日 常</div>
      <div class="app-grid">
        <div class="app-item" onclick="toast('用车申请')">
          <div class="app-icon bg-blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="#2B7CDB" stroke-width="2"><rect x="3" y="5" width="18" height="12" rx="2"/><circle cx="7.5" cy="19" r="1.5"/><circle cx="16.5" cy="19" r="1.5"/></svg>
          </div>
          <div class="app-label">用车申请</div>
        </div>
        <div class="app-item" onclick="toast('协同')">
          <div class="app-icon bg-purple">
            <svg viewBox="0 0 24 24" fill="none" stroke="#7B61C9" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="10" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>
          </div>
          <div class="app-label">协同</div>
        </div>
      </div>

      <!-- 考勤 -->
      <div class="section-title">考 勤</div>
      <div class="app-grid" style="grid-template-columns:repeat(4,1fr);">
        <div class="app-item" onclick="toast('请假申请')">
          <div class="app-icon bg-blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="#2B7CDB" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2"/><line x1="4" y1="10" x2="20" y2="10"/></svg>
          </div>
          <div class="app-label">请假申请</div>
        </div>
        <div class="app-item" onclick="toast('出差申请')">
          <div class="app-icon bg-purple">
            <svg viewBox="0 0 24 24" fill="none" stroke="#7B61C9" stroke-width="2"><path d="M3 12L21 4l-6 16-3-7-9-1z"/></svg>
          </div>
          <div class="app-label">出差申请</div>
        </div>
      </div>
    </div>

    <!-- 底部Tab -->
    <div class="tabbar">
      <a class="tab-item active" href="workbench.html">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-4v-6H10v6H6v-9H3l9-8z"/></svg>
        工作台
      </a>
      <a class="tab-item" href="approval.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
        审批
        <span class="tab-badge">12</span>
      </a>
      <a class="tab-item" href="site.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 3.5l1.5 1.5L20 3"/></svg>
        现场管理
      </a>
      <a class="tab-item" href="profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
        我的
      </a>
    </div>

    <div class="toast" id="toast"></div>
  </div>

<script>
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1000);
  }
</script>
</body>
</html>
