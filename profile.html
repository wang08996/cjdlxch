<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人中心 - 郴江电力管理系统</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#e9ecf1; }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }

  .phone {
    width:375px; height:812px; background:#f4f6f9; border-radius:36px; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.18); position:relative; display:flex; flex-direction:column;
  }
  .statusbar {
    height:44px; background:#fff; display:flex; align-items:center; justify-content:space-between;
    padding:0 22px; font-size:14px; font-weight:600; color:#000; flex-shrink:0;
  }
  .statusbar .right { display:flex; align-items:center; gap:6px; font-size:12px; }

  .navbar {
    height:44px; background:#fff; display:flex; align-items:center; justify-content:center;
    position:relative; border-bottom:1px solid #f0f0f0; flex-shrink:0;
  }
  .navbar .back {
    position:absolute; left:12px; width:32px; height:32px; display:flex; align-items:center;
    justify-content:center; cursor:pointer;
  }
  .navbar .title { font-size:17px; font-weight:600; color:#222; }

  .content { flex:1; overflow-y:auto; padding-bottom:70px; }

  /* 用户信息卡 */
  .profile-card {
    background:#fff; margin:12px; border-radius:8px; padding:20px 16px;
    display:flex; align-items:center;
  }
  .avatar {
    width:64px; height:64px; border-radius:50%; background:#B9DDF5; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .avatar svg { width:48px; height:48px; }
  .profile-info { margin-left:16px; flex:1; }
  .profile-name { font-size:18px; font-weight:600; color:#222; margin-bottom:10px; }
  .profile-line { font-size:13px; color:#666; line-height:1.9; }
  .profile-line b { color:#333; font-weight:500; }

  /* 菜单列表 */
  .menu-list { background:#fff; margin:0 12px; border-radius:8px; overflow:hidden; }
  .menu-item {
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; font-size:14px; color:#333; cursor:pointer;
    border-bottom:1px solid #f2f2f2;
  }
  .menu-item:last-child { border-bottom:none; }
  .menu-item .arrow { color:#ccc; font-size:16px; }

  /* 退出登录 */
  .logout-wrap { margin:12px; }
  .logout-btn {
    width:100%; background:#fff; border:none; border-radius:8px; padding:14px;
    font-size:14px; color:#333; text-align:left; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
  }
  .logout-btn:active { background:#f5f5f5; }

  /* 底部Tab栏 */
  .tabbar {
    position:absolute; left:0; right:0; bottom:0; height:62px; background:#fff;
    border-top:1px solid #eee; display:flex; padding-bottom:6px;
  }
  .tab-item {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:11px; color:#888; cursor:pointer; position:relative; text-decoration:none;
  }
  .tab-item.active { color:#2B7CDB; }
  .tab-item svg { width:22px; height:22px; margin-bottom:3px; }
  .tab-badge {
    position:absolute; top:4px; right:calc(50% - 18px); background:#E74C3C; color:#fff;
    font-size:10px; min-width:16px; height:16px; line-height:16px; border-radius:8px;
    text-align:center; padding:0 4px;
  }

  .toast {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    background:rgba(0,0,0,.75); color:#fff; padding:10px 18px; border-radius:6px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:99;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <span>9:41 AM</span>
      <div class="right">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="#000"><rect x="0" y="7" width="3" height="4"/><rect x="4" y="5" width="3" height="6"/><rect x="8" y="2.5" width="3" height="8.5"/><rect x="12" y="0" width="3" height="11"/></svg>
        <span>100%</span>
        <svg width="22" height="11" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" fill="none" stroke="#000"/><rect x="2" y="2" width="17" height="8" rx="1" fill="#000"/></svg>
      </div>
    </div>

    <div class="navbar">
      <div class="back" onclick="history.back()">
        <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="#333" stroke-width="2"><polyline points="10,2 2,10 10,18"/></svg>
      </div>
      <div class="title">个人中心</div>
    </div>

    <div class="content">
      <div class="profile-card">
        <div class="avatar">
          <svg viewBox="0 0 64 64">
            <circle cx="32" cy="24" r="12" fill="#F5C99B"/>
            <path d="M10 60c0-12 10-20 22-20s22 8 22 20z" fill="#7BAE7F"/>
          </svg>
        </div>
        <div class="profile-info">
          <div class="profile-name">用户：XXX</div>
          <div class="profile-line"><b>手机：</b>13719560856</div>
          <div class="profile-line"><b>姓名：</b>张三&nbsp;&nbsp;&nbsp;&nbsp;<b>岗位：</b>台区经理</div>
        </div>
      </div>

      <div class="menu-list">
        <div class="menu-item" onclick="toast('密码变更')">
          <span>密码变更</span>
          <span class="arrow">›</span>
        </div>
      </div>

      <div class="logout-wrap">
        <button class="logout-btn" onclick="doLogout()">
          <span>退出登录</span>
          <span class="arrow">›</span>
        </button>
      </div>
    </div>

    <div class="tabbar">
      <a class="tab-item" href="workbench.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9z"/></svg>
        工作台
      </a>
      <a class="tab-item" href="approval.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
        审批
        <span class="tab-badge">12</span>
      </a>
      <a class="tab-item" href="site.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 3.5l1.5 1.5L20 3"/></svg>
        现场管理
      </a>
      <a class="tab-item active" href="profile.html">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7z" fill="#fff"/></svg>
        我的
      </a>
    </div>

    <div class="toast" id="toast"></div>
  </div>

<script>
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1000);
  }
  function doLogout(){
    if(confirm('确认退出登录？')){ location.href='login.html'; }
  }
</script>
</body>
</html>
