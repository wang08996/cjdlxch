<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月计划 - 郴江电力</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#e9ecf1; }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  .phone { width:390px; height:820px; background:#f4f6f9; border-radius:36px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.18); position:relative; display:flex; flex-direction:column; }
  .statusbar { height:44px; background:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-size:14px; font-weight:600; flex-shrink:0; }
  .statusbar .right { display:flex; align-items:center; gap:6px; font-size:12px; }
  .navbar { height:48px; background:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 12px; border-bottom:1px solid #f0f0f0; flex-shrink:0; }
  .navbar .back { font-size:15px; color:#2b7cff; padding:8px 4px; cursor:pointer; }
  .navbar .title { font-size:17px; font-weight:600; color:#222; }
  .navbar .right { min-width:60px; text-align:right; font-size:14px; color:#2b7cff; cursor:pointer; }

  .view { flex:1; display:flex; flex-direction:column; min-height:0; }
  .view.hide { display:none; }
  .body { flex:1; overflow-y:auto; background:#f4f6f9; }

  /* 搜索与筛选 */
  .search-wrap { background:#fff; padding:10px 12px 12px; border-bottom:1px solid #f0f0f0; }
  .search { width:100%; height:36px; border:1px solid #e5e7eb; border-radius:18px; padding:0 14px; font-size:13px; background:#f7f9fc; outline:none; color:#222; font-family:inherit; }
  .search::placeholder { color:#a7b0bd; }
  .chips { display:flex; gap:8px; margin-top:10px; overflow-x:auto; padding-bottom:2px; }
  .chips::-webkit-scrollbar { display:none; }
  .fchip { flex:none; font-size:12px; color:#66707c; background:#f2f4f8; border-radius:12px; padding:5px 12px; cursor:pointer; border:1px solid transparent; }
  .fchip.on { background:#eef4ff; color:#2b7cff; border-color:#c8ddff; font-weight:600; }

  .list-head { font-size:11px; color:#98a2b3; padding:10px 14px 6px; }

  /* 计划卡 */
  .p-card { background:#fff; margin:0 12px 10px; border-radius:12px; padding:13px 14px; cursor:pointer; }
  .p-name { font-size:15px; font-weight:600; color:#222; line-height:1.45; }
  .p-tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center; }
  .p-aud { font-size:11px; color:#a7b0bd; }
  .p-aud b { color:#66707c; font-weight:500; }
  .badge { font-size:10px; padding:2px 7px; border-radius:8px; font-weight:600; }
  .b-month { background:#eef4ff; color:#1d4ed8; }
  .st-draft { background:#f1f3f7; color:#8a94a6; }
  .st-wait { background:#fef3c7; color:#b45309; }
  .st-pass { background:#dcfce7; color:#16a34a; }
  .st-rej { background:#fee2e2; color:#dc2626; }
  .p-sub { font-size:12px; color:#98a2b3; margin-top:8px; }
  .p-sub b { color:#66707c; font-weight:500; }
  .p-ops { display:flex; justify-content:flex-end; gap:8px; margin-top:9px; }
  .p-edit { font-size:12px; color:#2b7cff; border:1px solid #d3e0ff; background:#f6faff; border-radius:14px; padding:5px 16px; cursor:pointer; }
  .p-edit:active { background:#eef4ff; }
  .p-del { font-size:12px; color:#dc2626; border:1px solid #fca5a5; background:#fff; border-radius:14px; padding:5px 16px; cursor:pointer; }

  .add-row { margin:8px 12px 24px; padding:13px; text-align:center; font-size:14px; color:#2b7cff; border:1px dashed #c8ddff; border-radius:10px; cursor:pointer; background:#fff; }
  .empty { margin:44px 12px; text-align:center; font-size:13px; color:#a7b0bd; line-height:1.9; }

  /* 弹层 */
  .mask { position:absolute; inset:0; background:rgba(0,0,0,.45); z-index:50; display:none; align-items:flex-end; }
  .mask.open { display:flex; }
  .sheet { background:#fff; width:100%; max-height:86%; border-radius:16px 16px 0 0; display:flex; flex-direction:column; }
  .sheet-head { padding:14px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #f0f0f0; }
  .sheet-title { font-size:16px; font-weight:600; color:#222; }
  .sheet-close { color:#888; font-size:14px; cursor:pointer; }
  .sheet-body { flex:1; overflow-y:auto; padding:12px 16px 16px; }
  .sheet-foot { flex-shrink:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid #f0f0f0; display:flex; gap:10px; }
  .btn-primary { flex:1; height:46px; border:none; border-radius:10px; background:#2b7cff; color:#fff; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-secondary { flex:1; height:46px; border:1px solid #2b7cff; border-radius:10px; background:#fff; color:#2b7cff; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }

  /* 月份选择 */
  .m-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .m-cell { border:1px solid #e5e7eb; border-radius:10px; padding:12px 0; text-align:center; font-size:14px; color:#222; cursor:pointer; background:#fff; }
  .m-cell.on { border-color:#2b7cff; background:#eef4ff; color:#2b7cff; font-weight:600; }
  .m-cell.dis { background:#f5f6f8; color:#b6bfcc; cursor:not-allowed; border-color:#eceef2; }
  .m-cell .m-sub { display:block; font-size:10px; color:#a7b0bd; margin-top:3px; }
  .m-cell.dis .m-sub { color:#c3cad6; }
  .m-tip { font-size:12px; color:#98a2b3; line-height:1.7; margin-top:14px; }

  /* 表单 */
  .f-sec { font-size:12px; font-weight:600; color:#98a2b3; margin:16px 0 2px; letter-spacing:.5px; }
  .f-card { background:#fff; border-radius:12px; padding:2px 14px; margin:0 12px; }
  .f-row { display:flex; align-items:flex-start; gap:10px; padding:12px 0; border-bottom:1px solid #f4f5f7; }
  .f-row:last-child { border-bottom:none; }
  .f-row > label { flex:none; width:80px; font-size:13px; color:#66707c; padding-top:7px; }
  .req { color:#dc2626; margin-left:2px; }
  .f-in { flex:1; min-width:0; border:0; outline:none; font-size:14px; color:#222; padding:6px 0; background:transparent; font-family:inherit; }
  .f-in::placeholder { color:#b6bfcc; }
  .f-ta { flex:1; min-width:0; border:0; outline:none; font-size:14px; color:#222; padding:6px 0; background:transparent; font-family:inherit; resize:none; line-height:1.6; height:60px; }
  .f-ro { flex:1; min-width:0; font-size:14px; color:#8a94a6; padding:6px 0; line-height:1.5; }
  .f-ro.dark { color:#222; }
  .f-pick { flex:1; min-width:0; font-size:14px; color:#222; padding:6px 0; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .f-pick::after { content:"›"; margin-left:auto; color:#b6bfcc; font-size:15px; }
  .f-pick.ph { color:#b6bfcc; }
  .f-pick .clr { color:#b6bfcc; font-size:13px; padding:0 4px; }
  .type-chips { display:flex; gap:8px; flex:1; }
  .tchip { flex:1; text-align:center; font-size:13px; padding:9px 0; border:1px solid #e5e7eb; border-radius:8px; color:#66707c; cursor:pointer; }
  .tchip.on { border-color:#2b7cff; background:#eef4ff; color:#2b7cff; font-weight:600; }
  .date-row { display:flex; align-items:center; gap:8px; flex:1; }
  .date-pick { flex:1; min-width:0; font-size:13px; color:#222; padding:6px 0; cursor:pointer; text-align:left; }
  .date-pick.ph { color:#b6bfcc; }
  .date-split { color:#c3cad6; font-size:12px; flex:none; }

  /* 明细卡 */
  .item-card { background:#fff; border-radius:12px; margin:10px 12px 0; padding:2px 14px 10px; }
  .item-head { display:flex; align-items:center; justify-content:space-between; padding:11px 0 4px; }
  .item-no { font-size:12px; font-weight:600; color:#2b7cff; }
  .item-del { font-size:12px; color:#dc2626; cursor:pointer; padding:2px 4px; }
  .item-add { margin:10px 12px 0; padding:12px; text-align:center; font-size:13px; color:#2b7cff; border:1px dashed #c8ddff; border-radius:10px; cursor:pointer; background:#fff; }

  /* 表单底部 */
  .form-foot { flex-shrink:0; display:flex; gap:10px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:#fff; border-top:1px solid #f0f0f0; }

  /* 详情 */
  .v-row { display:flex; gap:10px; padding:11px 0; border-bottom:1px solid #f4f5f7; }
  .v-row .k { flex:none; width:80px; font-size:13px; color:#98a2b3; }
  .v-row .v { flex:1; min-width:0; font-size:14px; color:#222; line-height:1.55; word-break:break-all; }
  .v-item { border:1px solid #f0f2f5; border-radius:10px; padding:11px 12px; margin-bottom:10px; background:#fbfcfe; }
  .v-item-h { display:flex; align-items:flex-start; gap:8px; }
  .v-item-no { flex:none; width:18px; height:18px; line-height:18px; text-align:center; border-radius:50%; background:#eef4ff; color:#2b7cff; font-size:11px; font-weight:600; margin-top:1px; }
  .v-item-t { flex:1; font-size:14px; color:#222; font-weight:600; line-height:1.5; }
  .pd { font-size:10px; padding:2px 7px; border-radius:8px; font-weight:600; flex:none; }
  .pd-high { background:#fee2e2; color:#dc2626; }
  .pd-mid { background:#fef3c7; color:#b45309; }
  .pd-low { background:#f1f3f7; color:#8a94a6; }
  .v-item-l { font-size:12px; color:#8a94a6; margin-top:7px; line-height:1.7; }
  .v-item-l b { color:#66707c; font-weight:500; }
  .rej-bar { background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; font-size:12px; border-radius:10px; padding:9px 11px; line-height:1.6; margin:12px 0 0; }
  .tl { border-left:2px solid #eef1f5; margin:6px 0 0 6px; padding-left:14px; }
  .tl-i { position:relative; padding:6px 0 12px; }
  .tl-i::before { content:""; position:absolute; left:-20px; top:10px; width:8px; height:8px; border-radius:50%; background:#c9d2de; }
  .tl-i.on::before { background:#2b7cff; }
  .tl-t { font-size:13px; color:#222; font-weight:500; }
  .tl-s { font-size:11px; color:#a7b0bd; margin-top:3px; }

  /* 确认弹层 */
  .cfm-sheet { max-height:none; }
  .cfm-body { padding:18px 16px 8px; }
  .cfm-title { font-size:15px; font-weight:600; color:#222; }
  .cfm-desc { font-size:13px; color:#66707c; margin-top:8px; line-height:1.6; }
  .cfm-ta { width:100%; height:70px; border:1px solid #e5e7eb; border-radius:8px; margin-top:12px; padding:10px; font-size:13px; color:#222; outline:none; resize:none; font-family:inherit; background:#fbfcfe; }
  .toast { position:absolute; left:50%; bottom:110px; transform:translateX(-50%); background:rgba(0,0,0,.78); color:#fff; font-size:13px; padding:9px 16px; border-radius:18px; opacity:0; pointer-events:none; transition:opacity .18s; z-index:80; max-width:300px; text-align:center; line-height:1.5; }
  .toast.show { opacity:1; }
  .pk-item { display:flex; align-items:center; padding:13px 4px; border-bottom:1px solid #f4f5f7; font-size:14px; color:#222; cursor:pointer; }
  .pk-item.on { color:#2b7cff; font-weight:600; }
  .pk-ck { margin-left:auto; color:#2b7cff; font-size:13px; }

  /* 工作量行 */
  .q-row { display:flex; align-items:flex-start; gap:10px; padding:12px 2px; border-bottom:1px solid #f4f5f7; }
  .q-l { flex:1; min-width:0; }
  .q-nm { font-size:13px; color:#222; line-height:1.5; }
  .q-sub { font-size:11px; color:#a7b0bd; margin-top:4px; }
  .q-sub b { color:#dc2626; font-weight:600; }
  .q-r { flex:none; width:92px; text-align:right; }
  .q-in { width:92px; height:32px; border:1px solid #e5e7eb; border-radius:8px; text-align:right; padding:0 8px; font-size:13px; color:#222; outline:none; font-family:inherit; background:#fbfcfe; }
  .q-amt { font-size:11px; color:#dc2626; font-weight:600; margin-top:5px; }
  .q-sum { font-size:13px; color:#222; margin-top:14px; }
  .q-sum b { color:#dc2626; font-weight:600; }

  /* 日期选择（小程序滚轮样式） */
  .dp-head { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid #f0f0f0; }
  .dp-cancel { font-size:15px; color:#8a94a6; cursor:pointer; padding:4px 6px; }
  .dp-title { font-size:15px; font-weight:600; color:#222; }
  .dp-ok { font-size:15px; color:#2b7cff; font-weight:600; cursor:pointer; padding:4px 6px; }
  .dp-body { position:relative; padding:0 12px; }
  .dp-band { position:absolute; left:12px; right:12px; top:76px; height:40px; background:#f2f6ff; border-radius:8px; pointer-events:none; }
  .dp-cols { display:flex; gap:6px; position:relative; z-index:1; }
  .dp-col { flex:1; height:192px; overflow-y:auto; scrollbar-width:none; text-align:center; }
  .dp-col::-webkit-scrollbar { display:none; }
  .dp-pad { height:76px; }
  .dp-i { height:40px; line-height:40px; font-size:15px; color:#a7b0bd; cursor:pointer; }
  .dp-i.on { color:#222; font-weight:600; }
  .dp-unit { font-size:12px; color:#98a2b3; padding:4px 16px 14px; text-align:center; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <div class="right"><span>信号</span><span>Wi-Fi</span><span>100%</span></div>
  </div>

  <!-- ============ 列表 ============ -->
  <div class="view" id="viewList">
    <div class="navbar">
      <span class="back" onclick="goBack()">‹ 现场管理</span>
      <span class="title">月计划</span>
      <span class="right" onclick="openForm()">+ 新增</span>
    </div>
    <div class="body" id="listWrap">
      <div class="search-wrap">
        <input class="search" id="kw" placeholder="搜索计划名称 / 事项 / 申请人" oninput="render()">
        <div class="chips" id="filterChips"></div>
      </div>
      <div class="list-head" id="listHead"></div>
      <div id="list"></div>
      <div class="add-row" onclick="openForm()">+ 新增月计划</div>
    </div>
  </div>

  <!-- ============ 新增 / 编辑 ============ -->
  <div class="view hide" id="viewForm">
    <div class="navbar">
      <span class="back" onclick="exitForm()">‹ 取消</span>
      <span class="title" id="formTitle">新增月计划</span>
      <span class="right" style="color:#fff;cursor:default;">　</span>
    </div>
    <div class="body" id="formBody"></div>
    <div class="form-foot">
      <button class="btn-secondary" onclick="saveDraft()">保存草稿</button>
      <button class="btn-primary" onclick="submitPlan()" id="submitBtn">提交审核</button>
    </div>
  </div>

  <!-- 月份选择 -->
  <div class="mask" id="monthMask">
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title">选择月份</div>
        <div class="sheet-close" onclick="closeMask('monthMask')">关闭</div>
      </div>
      <div class="sheet-body">
        <div class="m-grid" id="monthGrid"></div>
        <div class="m-tip">灰底的月份本部门已有月度计划，不可重复创建；默认定位到本部门已有月份的下一个月。</div>
      </div>
    </div>
  </div>

  <!-- 项目选择 -->
  <div class="mask" id="projMask" style="z-index:60">
    <div class="sheet" style="max-height:74%">
      <div class="sheet-head">
        <div class="sheet-title">选择涉及项目</div>
        <div class="sheet-close" onclick="closeMask('projMask')">关闭</div>
      </div>
      <div class="sheet-body" style="padding-top:10px">
        <input class="search" id="projKw" placeholder="搜索项目名称 / 项目编号" oninput="renderProjList()">
        <div id="projList" style="margin-top:6px"></div>
      </div>
    </div>
  </div>

  <!-- 工作量选择 -->
  <div class="mask" id="qtyMask" style="z-index:70">
    <div class="sheet" style="max-height:80%">
      <div class="sheet-head">
        <div class="sheet-title" id="qtyTitle">选择工作量</div>
        <div class="sheet-close" onclick="closeQtyPick()">关闭</div>
      </div>
      <div class="sheet-body" style="padding-top:10px">
        <input class="search" id="qtyKw" placeholder="搜索工作量名称" oninput="renderQtyList()">
        <div id="qtyList" style="margin-top:8px"></div>
      </div>
      <div class="sheet-foot">
        <button class="btn-secondary" onclick="closeQtyPick()">取消</button>
        <button class="btn-primary" onclick="confirmQtyPick()">确定</button>
      </div>
    </div>
  </div>

  <!-- 日期选择 -->
  <div class="mask" id="dateMask" style="z-index:70">
    <div class="sheet">
      <div class="dp-head">
        <span class="dp-cancel" onclick="closeDatePicker()">取消</span>
        <span class="dp-title">选择日期</span>
        <span class="dp-ok" onclick="confirmDate()">确定</span>
      </div>
      <div class="dp-body">
        <div class="dp-band"></div>
        <div class="dp-cols" id="dpCols"></div>
      </div>
      <div class="dp-unit" id="dpUnit"></div>
    </div>
  </div>

  <!-- 详情 -->
  <div class="mask" id="viewMask">
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title" id="viewTitle">计划详情</div>
        <div class="sheet-close" onclick="closeMask('viewMask')">关闭</div>
      </div>
      <div class="sheet-body" id="viewBody"></div>
      <div class="sheet-foot" id="viewFoot"></div>
    </div>
  </div>

  <!-- 确认 / 驳回 -->
  <div class="mask" id="cfmMask">
    <div class="sheet cfm-sheet">
      <div class="sheet-head">
        <div class="sheet-title" id="cfmTitle">确认</div>
        <div class="sheet-close" onclick="closeConfirm()">关闭</div>
      </div>
      <div class="cfm-body">
        <div class="cfm-desc" id="cfmDesc"></div>
        <div id="cfmExtra"></div>
      </div>
      <div class="sheet-foot">
        <button class="btn-secondary" onclick="closeConfirm()">取消</button>
        <button class="btn-primary" onclick="doConfirm()" id="cfmOk">确定</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
// ============ 基础 ============
const $ = id => document.getElementById(id);
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }
let toastTimer = null;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}
function goBack(){ location.href = "../site.html"; }
function closeMask(id){ $(id).classList.remove("open"); }

// ============ 常量 / 当前用户 ============
const CURRENT = { name:"李志强", dept:"郴州公司/项目一部", role:"项目经理" };
const AUDITOR = { name:"王敏", role:"项目经理" };
const AREA_MAP = { "郴州公司":"郴州区域", "常德分公司":"常德区域" };
const TODAY = "2026-11-06";
const BASE_Y = 2026, BASE_M = 11;   // 原型基准月份：2026-11

const PROJECT_LIB = [
  { code:"YL-2025-010", name:"园垄线10kV线路改造工程" },
  { code:"ZD-2025-007", name:"珠东线配电自动化改造工程" },
  { code:"WY-2025-003", name:"高速杆迁瓦窑坪支线工程" },
  { code:"JH-2025-012", name:"嘉禾县农网巩固提升工程" },
  { code:"SX-2025-021", name:"苏仙区低压台区改造工程" },
  { code:"BH-2025-018", name:"北湖区配网自动化工程" },
  { code:"YZ-2025-009", name:"宜章县变电站扩建工程" },
  { code:"GY-2025-015", name:"桂阳县线路绝缘化改造工程" },
  { code:"YX-2025-006", name:"永兴县农网升级工程" },
  { code:"LW-2025-011", name:"临武县配网消缺工程" },
  { code:"RC-2025-020", name:"汝城县光伏接入工程" },
  { code:"AR-2025-004", name:"安仁县线路迁改工程" }
];
function projByCode(code){ return PROJECT_LIB.find(p => p.code === code); }

// ============ 名称 / 月份工具 ============
function deptShort(dept){ return (dept || "").split("/")[1] || dept; }
function deptArea(dept){ return AREA_MAP[(dept || "").split("/")[0]] || (dept || "").split("/")[0]; }
function planName(month, dept){ return month + " " + deptArea(dept) + "_" + deptShort(dept) + "_月度计划"; }
function monthStr(y, m){ return y + "-" + ("0" + m).slice(-2); }
function monthList(){
  const arr = [];
  let y = BASE_Y, m = BASE_M;
  for (let i = 0; i < 13; i++){
    arr.push(monthStr(y, m));
    m++; if (m > 12){ m = 1; y++; }
  }
  return arr;
}
function occupiedMonths(dept){
  return PLANS.filter(p => p.dept === dept).map(p => p.month);
}
function defaultMonth(dept){
  const ms = occupiedMonths(dept).sort();
  if (!ms.length) return monthStr(BASE_Y, BASE_M);
  const last = ms[ms.length - 1];
  const y = +last.slice(0,4), m = +last.slice(5,7);
  return m === 12 ? monthStr(y + 1, 1) : monthStr(y, m + 1);
}

// ============ 列表 ============
let filter = "all";
const FILTERS = [
  { k:"all", t:"全部" },
  { k:"draft", t:"草稿" },
  { k:"wait", t:"待审核" },
  { k:"pass", t:"已通过" },
  { k:"rej", t:"已驳回" }
];
function renderChips(){
  $("filterChips").innerHTML = FILTERS.map(f =>
    `<div class="fchip ${filter===f.k?"on":""}" onclick="setFilter('${f.k}')">${f.t}</div>`
  ).join("");
}
function setFilter(k){ filter = k; render(); }

function canEdit(p){ return p.status === "draft" || p.status === "rej"; }

function render(){
  renderChips();
  const kw = ($("kw").value || "").trim();
  let list = PLANS.slice();
  if (filter !== "all") list = list.filter(p => p.status === filter);
  if (kw){
    list = list.filter(p =>
      (p.name || planName(p.month, p.dept)).includes(kw) ||
      (p.owner || "").includes(kw) ||
      (p.dept || "").includes(kw) ||
      (p.items || []).some(it => (it.title || "").includes(kw))
    );
  }
  list.sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));

  const counts = {
    all: PLANS.length,
    draft: PLANS.filter(p => p.status === "draft").length,
    wait: PLANS.filter(p => p.status === "wait").length,
    pass: PLANS.filter(p => p.status === "pass").length,
    rej: PLANS.filter(p => p.status === "rej").length
  };
  $("listHead").textContent = `共 ${counts.all} 份 · 草稿 ${counts.draft} · 待审核 ${counts.wait} · 已通过 ${counts.pass} · 已驳回 ${counts.rej}`;

  if (!list.length){
    $("list").innerHTML = `<div class="empty">没有匹配的月计划<br>换个关键词或筛选条件试试</div>`;
    return;
  }

  $("list").innerHTML = list.map(p => {
    const st = STATUS[p.status] || STATUS.draft;
    const name = p.name || planName(p.month, p.dept);
    const items = (p.items || []).length;
    return `<div class="p-card" data-id="${p.id}">
      <div class="p-name">${esc(name)}</div>
      <div class="p-tags">
        <span class="badge b-month">${esc(p.month)}</span>
        <span class="badge ${st.cls}">${st.t}</span>
        <span class="p-aud">当前审核人 <b>${esc(p.auditor || AUDITOR.name)}</b></span>
      </div>
      <div class="p-sub">明细 <b>${items}</b> 条 · 申请人 <b>${esc(p.owner)}</b> · ${esc(p.dept)}</div>
      <div class="p-sub">更新 ${esc(p.updated || "—")}</div>
      <div class="p-ops">
        ${canEdit(p) ? `<span class="p-del" data-del="${p.id}">删除</span><span class="p-edit" data-edit="${p.id}">编辑</span>` : ""}
      </div>
    </div>`;
  }).join("");

  $("list").querySelectorAll(".p-card").forEach(card => {
    card.addEventListener("click", () => openView(card.dataset.id));
  });
  $("list").querySelectorAll(".p-edit").forEach(btn => {
    btn.addEventListener("click", e => { e.stopPropagation(); openForm(btn.dataset.edit); });
  });
  $("list").querySelectorAll(".p-del").forEach(btn => {
    btn.addEventListener("click", e => { e.stopPropagation(); askDelete(btn.dataset.del); });
  });
}

    const pr = PRIO[it.prio] || PRIO.mid;

      <div class="v-item-h">
        <div class="v-item-no">${i + 1}</div>
        <div class="v-item-t">${esc(it.title)}</div>
        <span class="pd ${pr.cls}">${pr.t}</span>
      </div>
      <div class="v-item-l">
        ${it.project ? `涉及项目：<b>${esc(it.project)}</b>${it.projectCode || projCodeByName(it.project) ? "（" + esc(it.projectCode || projCodeByName(it.project)) + "）" : ""}<br>` : ""}
        ${(it.workItems && it.workItems.length) ? `预计产值：<b style="color:#dc2626;font-weight:600">¥${money(itemOutput(it))}</b><br>` : ""}

        ${it.note ? `<br>注意事项：${esc(it.note)}` : ""}
      </div>
    </div>`;
  }).join("");

  const logsHTML = (p.logs || []).length
    ? `<div class="tl">${p.logs.map(l => `<div class="tl-i on"><div class="tl-t">${esc(l.t)}</div><div class="tl-s">${esc(l.s)}</div></div>`).join("")}</div>`
    : `<div class="v-item-l" style="margin-top:8px">暂无审核记录</div>`;

  $("viewBody").innerHTML = `
    ${p.status === "rej" && p.rejectReason ? `<div class="rej-bar">驳回原因：${esc(p.rejectReason)}</div>` : ""}
    <div class="v-row"><div class="k">状态</div><div class="v"><span class="badge ${st.cls}">${st.t}</span></div></div>
    <div class="v-row"><div class="k">计划名称</div><div class="v">${esc(name)}</div></div>
    <div class="v-row"><div class="k">月份</div><div class="v">${esc(p.month)}</div></div>
    <div class="v-row"><div class="k">申请人</div><div class="v">${esc(p.owner)}</div></div>
    <div class="v-row"><div class="k">所属部门</div><div class="v">${esc(p.dept)}</div></div>
    <div class="v-row"><div class="k">当前审核人</div><div class="v">${esc(p.auditor || AUDITOR.name)} · ${p.status === "pass" ? "已审核" : (p.status === "draft" ? "未提交审核" : "待处理")}</div></div>
    <div class="v-row"><div class="k">备注</div><div class="v">${esc(p.note || "—")}</div></div>
    <div class="f-sec" style="margin:18px 0 10px">计划明细（${(p.items || []).length} 条）</div>
    ${itemsHTML}
    ${planOutput(p) ? `<div class="q-sum" style="margin:2px 0 0">预计产值合计 <b>¥${money(planOutput(p))}</b></div>` : ""}
    <div class="f-sec" style="margin:18px 0 8px">审核记录</div>
    ${logsHTML}
    <div class="v-row" style="border-bottom:none;margin-top:6px"><div class="k">更新时间</div><div class="v">${esc(p.updated || "—")}</div></div>
  `;

  // 底部按状态与角色给按钮
  let foot = `<button class="btn-secondary" onclick="closeMask('viewMask')">关闭</button>`;
  if (p.status === "draft"){
    foot = `<button class="btn-secondary" onclick="closeMask('viewMask')">关闭</button>
            <button class="btn-primary" onclick="submitFromView('${p.id}')">提交审核</button>`;
  } else if (p.status === "wait"){
    // 审核（通过/驳回）不在小程序里做，走另外的审核程序；这里只读查看，申请人可撤回
    if (p.owner === CURRENT.name){
      foot = `<button class="btn-secondary" onclick="closeMask('viewMask')">关闭</button>
              <button class="btn-primary" onclick="withdraw('${p.id}')">撤回</button>`;
    } else {
      foot = `<button class="btn-primary" onclick="closeMask('viewMask')">关闭</button>`;
    }
  } else if (p.status === "rej"){
    foot = `<button class="btn-secondary" onclick="closeMask('viewMask')">关闭</button>
            <button class="btn-primary" onclick="openForm('${p.id}')">修改重提</button>`;
  }
  $("viewFoot").innerHTML = foot;
  $("viewMask").classList.add("open");
}

// ============ 表单 ============
let draft = { id:null, month:"", note:"", items:[], rejectReason:"", name:"", nameEdited:false };

function openForm(id){
  if (viewId && $("viewMask").classList.contains("open")) closeMask("viewMask");
  const p = id ? PLANS.find(x => x.id === id) : null;
  if (p && !canEdit(p)){ toast("该计划" + STATUS[p.status].t + "，不可修改"); openView(p.id); return; }

  draft = {
    id: id || null,
    month: p ? p.month : defaultMonth(CURRENT.dept),
    note: p ? (p.note || "") : "",
    rejectReason: p ? (p.rejectReason || "") : "",
    name: p ? (p.name || planName(p.month, p.dept)) : planName(defaultMonth(CURRENT.dept), CURRENT.dept),
    nameEdited: p ? ((p.name || "") !== planName(p.month, p.dept)) : false,
    items: p ? (p.items || []).map(it => Object.assign({}, it)) : [ emptyItem() ]
  };
  $("formTitle").textContent = p ? "编辑月计划" : "新增月计划";
  $("submitBtn").textContent = (p && p.status === "rej") ? "保存并重新提交" : "提交审核";
  renderForm();
  $("viewList").classList.add("hide");
  $("viewForm").classList.remove("hide");
  $("formBody").scrollTop = 0;
}
function emptyItem(){ return { title:"", project:"", projectCode:"", workItems:[], note:"", prio:"mid", staff:"", start:"", end:"" }; }
function exitForm(){
  $("viewForm").classList.add("hide");
  $("viewList").classList.remove("hide");
}

function renderForm(){
  $("formBody").innerHTML = `
    ${draft.rejectReason ? `<div class="rej-bar" style="margin:12px">上次驳回原因：${esc(draft.rejectReason)}</div>` : ""}
    <div class="f-sec" style="margin:14px 12px 8px">基本信息</div>
    <div class="f-card">
      <div class="f-row"><label>申请人</label><div class="f-ro dark">${esc(CURRENT.name)}</div></div>
      <div class="f-row"><label>所属部门</label><div class="f-ro dark">${esc(CURRENT.dept)}</div></div>
      <div class="f-row"><label>月份<span class="req">*</span></label>
        <div class="f-pick ${draft.month ? "" : "ph"}" id="fMonth" onclick="openMonthPicker()">${esc(draft.month || "请选择月份")}</div>
      </div>
      <div class="f-row"><label>计划名称</label>
        <input class="f-in" id="fName" maxlength="60" oninput="onNameInput()" placeholder="自动生成，可修改" value="${esc(draft.name || planName(draft.month, CURRENT.dept))}">
      </div>
      <div class="f-row"><label>备注</label><textarea class="f-ta" id="fNote" maxlength="140" placeholder="选填，如本月重点、注意事项">${esc(draft.note)}</textarea></div>
    </div>

    <div class="f-sec" style="margin:16px 12px 8px">计划明细（${draft.items.length} 条）</div>
    <div id="itemWrap"></div>
    <div class="item-add" onclick="addItem()">+ 增加一条明细</div>
    <div style="height:20px"></div>
  `;
  renderItems();
}
function onNameInput(){
  const el = $("fName");
  if (!el) return;
  draft.name = el.value;
  draft.nameEdited = el.value.trim() !== planName(draft.month, CURRENT.dept);
}

function renderItems(){
  $("itemWrap").innerHTML = draft.items.map((it, i) => {
    const pr = PRIO[it.prio] ? it.prio : "mid";
    return `<div class="item-card" data-i="${i}" data-prio="${pr}">
      <div class="item-head">
        <span class="item-no">明细 ${i + 1}</span>
        ${draft.items.length > 1 ? `<span class="item-del" onclick="delItem(${i})">删除</span>` : `<span class="item-del" style="color:#c3cad6;cursor:default">必填</span>`}
      </div>
      <div class="f-row"><label>事项<span class="req">*</span></label>
        <input class="f-in" data-k="title" maxlength="50" placeholder="如 园垄线 3 号杆塔基础开挖" value="${esc(it.title)}">
      </div>
      <div class="f-row"><label>涉及项目</label>
        <div class="f-pick ${it.project ? "" : "ph"}" onclick="openProjPicker(${i})">
          <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.project || "选填，从项目库选择")}${it.project && (it.projectCode || projCodeByName(it.project)) ? `<span style="color:#a7b0bd;font-size:11px;margin-left:6px">${esc(it.projectCode || projCodeByName(it.project))}</span>` : ""}</span>
          ${it.project ? `<span class="clr" onclick="clearProj(event, ${i})">×</span>` : ""}
        </div>
      </div>
      ${it.project ? `<div class="f-row"><label>预计产值</label>
        <div class="f-pick" onclick="openQtyPicker(${i})">
          <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#dc2626;font-weight:600">${(it.workItems && it.workItems.length) ? "¥" + money(itemOutput(it)) : "选择工作量（选填）"}</span>
          ${(it.workItems && it.workItems.length) ? `<span style="color:#a7b0bd;font-size:11px;margin-left:6px">${it.workItems.length} 项</span>` : ""}
        </div>
      </div>` : ""}
      <div class="f-row"><label>注意事项</label>
        <textarea class="f-ta" data-k="note" maxlength="100" placeholder="选填，如安全要点、配合要求">${esc(it.note)}</textarea>
      </div>
      <div class="f-row"><label>优先级<span class="req">*</span></label>
        <div class="type-chips">
          <div class="tchip ${pr==="high"?"on":""}" data-p="high" onclick="setPrio(${i},'high')">高</div>
          <div class="tchip ${pr==="mid"?"on":""}" data-p="mid" onclick="setPrio(${i},'mid')">中</div>
          <div class="tchip ${pr==="low"?"on":""}" data-p="low" onclick="setPrio(${i},'low')">低</div>
        </div>
      </div>
      <div class="f-row"><label>人员安排</label>
        <input class="f-in" data-k="staff" placeholder="如 技工 3 人、副工 2 人、挖机 1 台" value="${esc(it.staff)}">
      </div>
      <div class="f-row"><label>时间范围</label>
        <div class="date-row">
          <div class="date-pick ${it.start ? "" : "ph"}" onclick="openDatePicker(${i},'start')">${esc(it.start || "开始日期")}</div>
          <span class="date-split">至</span>
          <div class="date-pick ${it.end ? "" : "ph"}" onclick="openDatePicker(${i},'end')">${esc(it.end || "结束日期")}</div>
        </div>
      </div>
    </div>`;
  }).join("");
}

function syncForm(){
  const note = $("fNote");
  if (note) draft.note = note.value;
  const nameEl = $("fName");
  if (nameEl) draft.name = nameEl.value;
  const cards = $("itemWrap").querySelectorAll(".item-card");
  cards.forEach(card => {
    const i = +card.dataset.i;
    const it = draft.items[i];
    if (!it) return;
    it.prio = card.dataset.prio || it.prio;
    card.querySelectorAll("[data-k]").forEach(inp => { it[inp.dataset.k] = inp.value; });
  });
}
function addItem(){
  if (draft.items.length >= 20){ toast("最多 20 条明细"); return; }
  syncForm();
  draft.items.push(emptyItem());
  renderForm();
}
function delItem(i){
  syncForm();
  draft.items.splice(i, 1);
  renderForm();
}
function setPrio(i, p){
  const card = $("itemWrap").querySelector(`.item-card[data-i="${i}"]`);
  if (!card) return;
  card.dataset.prio = p;
  card.querySelectorAll(".tchip").forEach(el => el.classList.toggle("on", el.dataset.p === p));
}

// 月份选择
function openMonthPicker(){
  const occ = occupiedMonths(CURRENT.dept);
  const months = monthList();
  const def = draft.month || defaultMonth(CURRENT.dept);
  $("monthGrid").innerHTML = months.map(m => {
    const dis = occ.includes(m) && m !== draft.month && !(draft.id && PLANS.find(p => p.id === draft.id)?.month === m);
    const on = m === def;
    const label = m.slice(0,4) + "." + m.slice(5,7);
    return `<div class="m-cell ${on?"on":""} ${dis?"dis":""}" ${dis?"":`onclick="pickMonth('${m}')"`}>${label}<span class="m-sub">${dis ? "已有计划" : (on ? "默认" : "可创建")}</span></div>`;
  }).join("");
  $("monthMask").classList.add("open");
}
function pickMonth(m){
  const occ = occupiedMonths(CURRENT.dept);
  if (occ.includes(m) && !(draft.id && (PLANS.find(p => p.id === draft.id) || {}).month === m)){
    toast("该月份已有计划");
    return;
  }
  syncForm();
  draft.month = m;
  if (!draft.nameEdited) draft.name = planName(m, CURRENT.dept);
  closeMask("monthMask");
  renderForm();
  $("formBody").scrollTop = 0;
}

// 项目选择
let projTarget = null;
function openProjPicker(i){
  syncForm();
  projTarget = i;
  $("projKw").value = "";
  renderProjList();
  $("projMask").classList.add("open");
}
function renderProjList(){
  const kw = ($("projKw").value || "").trim();
  const list = kw ? PROJECT_LIB.filter(v => v.name.includes(kw) || v.code.includes(kw.toUpperCase())) : PROJECT_LIB;
  if (!list.length){
    $("projList").innerHTML = `<div class="empty" style="margin:28px 0">没有匹配的项目<br>可搜项目名称或编号</div>`;
    return;
  }
  $("projList").innerHTML = list.map(v =>
    `<div class="pk-item" style="flex-direction:column;align-items:flex-start;gap:3px" onclick="pickProject('${esc(v.name)}')">
      <span style="font-size:14px;color:#222">${esc(v.name)}</span>
      <span style="font-size:11px;color:#a7b0bd">${esc(v.code)}</span>
    </div>`
  ).join("");
}
function pickProject(v){
  const p = PROJECT_LIB.find(x => x.name === v);
  const it = draft.items[projTarget];
  if (it.project !== v){ it.workItems = []; it.projectCode = p ? p.code : ""; }
  it.project = v;
  closeMask("projMask");
  renderForm();
}
function clearProj(e, i){
  e.stopPropagation();
  syncForm();
  draft.items[i].project = "";
  draft.items[i].projectCode = "";
  draft.items[i].workItems = [];
  renderForm();
}

// ============ 预计产值 · 工作量选择 ============
function itemOutput(it){
  return (it.workItems || []).reduce((s, w) => s + (w.price || 0) * (w.qty || 0), 0);
}
function planOutput(p){
  return (p.items || []).reduce((s, it) => s + itemOutput(it), 0);
}

let qtyTarget = null, qtyItem = null, qtyDraft = {};
function openQtyPicker(i){
  syncForm();
  qtyTarget = i;
  qtyItem = draft.items[i];
  qtyDraft = {};
  (qtyItem.workItems || []).forEach(w => { qtyDraft[w.qid] = w.qty; });
  $("qtyTitle").textContent = "选择工作量 · " + (qtyItem.project || "");
  $("qtyKw").value = "";
  renderQtyList();
  $("qtyMask").classList.add("open");
}
function renderQtyList(){
  const it = qtyItem;
  if (!it) return;
  const code = it.projectCode || projCodeByName(it.project);
  const lib = qtyByProject(code);
  const kw = ($("qtyKw").value || "").trim();
  const list = kw ? lib.filter(q => q.name.includes(kw)) : lib;
  if (!lib.length){
    $("qtyList").innerHTML = `<div class="empty" style="margin:28px 0">该项目还没有立项工程量清单<br>可先在项目立项里录入工程量</div>`;
    return;
  }
  if (!list.length){
    $("qtyList").innerHTML = `<div class="empty" style="margin:28px 0">没有匹配的工作量</div>`;
    return;
  }
  $("qtyList").innerHTML = list.map(q => {
    const v = qtyDraft[q.qid];
    return `<div class="q-row" data-nm="${esc(q.name)}">
      <div class="q-l">
        <div class="q-nm">${esc(q.name)}</div>
        <div class="q-sub">${esc(q.unit)} · 单价 <b>¥${money(q.price)}</b></div>
        <div class="q-sub">合同 <b>${trimNum(qtyTotalQty(q))}</b> ${esc(q.unit)} · 金额 <b>¥${money(qtyTotalQty(q) * q.price)}</b></div>
        <div class="q-sub">已完成 <b>${trimNum(qtyDone(q))}</b> ${esc(q.unit)} · <b>¥${money(qtyDone(q) * q.price)}</b></div>
      </div>
      <div class="q-r">
        <input class="q-in" inputmode="decimal" placeholder="数量" value="${v ? v : ""}" oninput="qtyInput('${q.qid}', this.value)">
        <div class="q-amt" id="qamt_${q.qid}">¥${money((v || 0) * q.price)}</div>
      </div>
    </div>`;
  }).join("") + `<div class="q-sum">预计产值合计 <b id="qtySum">¥${money(qtyTotal())}</b></div>`;
}
function qtyInput(qid, val){
  const q = QTY_LIB.find(x => x.qid === qid);
  if (!q) return;
  const v = parseFloat(val);
  if (isNaN(v) || v <= 0) delete qtyDraft[qid];
  else qtyDraft[qid] = v;
  const el = $("qamt_" + qid);
  if (el) el.textContent = "¥" + money((isNaN(v) ? 0 : v) * q.price);
  const sum = $("qtySum");
  if (sum) sum.textContent = "¥" + money(qtyTotal());
}
function qtyTotal(){
  return Object.keys(qtyDraft).reduce((s, qid) => {
    const q = QTY_LIB.find(x => x.qid === qid);
    return s + (q ? q.price * qtyDraft[qid] : 0);
  }, 0);
}
function closeQtyPick(){
  $("qtyMask").classList.remove("open");
  qtyTarget = null; qtyItem = null; qtyDraft = {};
}
function confirmQtyPick(){
  if (!qtyItem) return;
  const ids = Object.keys(qtyDraft);
  if (!ids.length){
    qtyItem.workItems = [];
  } else {
    qtyItem.workItems = ids.map(qid => {
      const q = QTY_LIB.find(x => x.qid === qid);
      return { qid, name:q.name, unit:q.unit, price:q.price, qty:qtyDraft[qid] };
    });
  }
  const amt = itemOutput(qtyItem);
  closeQtyPick();
  renderForm();
  toast(ids.length ? "预计产值 ¥" + money(amt) : "已清空工作量");
}

// ============ 日期选择（小程序滚轮样式） ============
let dp = null;
function daysInMonth(y, m){ return new Date(y, m, 0).getDate(); }
function openDatePicker(i, k){
  syncForm();
  const ym = draft.month || monthStr(BASE_Y, BASE_M);
  dp = { i, k, y:+ym.slice(0,4), m:+ym.slice(5,7), d:1 };
  const cur = draft.items[i][k];
  if (cur) dp.d = +cur.slice(8, 10) || 1;
  renderDateCols();
  $("dateMask").classList.add("open");
  requestAnimationFrame(scrollDateCols);
}
function renderDateCols(){
  const days = daysInMonth(dp.y, dp.m);
  $("dpCols").innerHTML = `
    <div class="dp-col"><div class="dp-pad"></div><div class="dp-i on">${dp.y} 年</div><div class="dp-pad"></div></div>
    <div class="dp-col"><div class="dp-pad"></div><div class="dp-i on">${dp.m} 月</div><div class="dp-pad"></div></div>
    <div class="dp-col" id="dpD">
      <div class="dp-pad"></div>
      ${Array.from({ length: days }, (_, idx) => idx + 1).map(n =>
        `<div class="dp-i ${n === dp.d ? "on" : ""}" data-d="${n}" onclick="pickDay(${n})">${n} 日</div>`
      ).join("")}
      <div class="dp-pad"></div>
    </div>`;
  $("dpUnit").textContent = `${dp.y} 年 ${dp.m} 月 · 共 ${days} 天（限计划月份内）`;
}
function scrollDateCols(){
  const col = $("dpD");
  if (col) col.scrollTop = (dp.d - 1) * 40;
}
function pickDay(n){
  dp.d = n;
  $("dpD").querySelectorAll(".dp-i").forEach(el => el.classList.toggle("on", +el.dataset.d === n));
  scrollDateCols();
}
function closeDatePicker(){
  $("dateMask").classList.remove("open");
  dp = null;
}
function confirmDate(){
  if (!dp) return;
  const it = draft.items[dp.i];
  if (!it) { closeDatePicker(); return; }
  const v = dp.y + "-" + ("0" + dp.m).slice(-2) + "-" + ("0" + dp.d).slice(-2);
  if (dp.k === "end" && it.start && v < it.start){
    toast("结束日期不能早于开始日期");
    return;
  }
  if (dp.k === "start" && it.end && v > it.end){
    it.end = "";
  }
  it[dp.k] = v;
  closeDatePicker();
  renderForm();
}

// ============ 保存 / 提交 ============
function collect(){
  syncForm();
  return draft;
}
function validateForSubmit(){
  if (!draft.month){ toast("请选择月份"); return false; }
  if (!draft.items.length){ toast("至少添加一条明细"); return false; }
  for (let i = 0; i < draft.items.length; i++){
    if (!(draft.items[i].title || "").trim()){ toast(`请填写明细 ${i + 1} 的事项`); return false; }
  }
  return true;
}
function upsertPlan(status, isSubmit){
  const items = draft.items.map(it => Object.assign({}, it, {
    title: (it.title || "").trim(),
    staff: (it.staff || "").trim(),
    note: (it.note || "").trim()
  }));
  let p = draft.id ? PLANS.find(x => x.id === draft.id) : null;
  if (!p){
    p = { id:"m" + Date.now().toString().slice(-6), owner:CURRENT.name, dept:CURRENT.dept, logs:[], name:"" };
    PLANS.unshift(p);
  }
  p.month = draft.month;
  p.name = (draft.name || "").trim() || planName(draft.month, CURRENT.dept);
  p.note = (draft.note || "").trim();
  p.items = items;
  p.updated = TODAY;
  p.status = status;
  if (isSubmit){
    p.logs = (p.logs || []).concat([{ t:"提交审核", s:CURRENT.name + " · " + TODAY + " 09:30", on:true }]);
    if (p.rejectReason) p.rejectReason = "";
  }
  return p;
}
function saveDraft(){
  collect();
  if (!draft.month){ toast("请选择月份"); return; }
  upsertPlan("draft", false);
  exitForm();
  render();
  toast("已存草稿");
}
function submitPlan(){
  collect();
  if (!validateForSubmit()) return;
  upsertPlan("wait", true);
  exitForm();
  render();
  toast("已提交审核");
}
function submitFromView(id){
  const p = PLANS.find(x => x.id === id);
  if (!p) return;
  p.status = "wait";
  p.updated = TODAY;
  p.logs = (p.logs || []).concat([{ t:"提交审核", s:CURRENT.name + " · " + TODAY + " 09:30", on:true }]);
  closeMask("viewMask");
  render();
  toast("已提交审核");
}
function withdraw(id){
  const p = PLANS.find(x => x.id === id);
  if (!p) return;
  p.status = "draft";
  p.updated = TODAY;
  p.logs = (p.logs || []).concat([{ t:"撤回", s:CURRENT.name + " · " + TODAY, on:true }]);
  closeMask("viewMask");
  render();
  toast("已撤回，可继续修改");
}

// ============ 审核 / 删除 ============
function approve(id){
  const p = PLANS.find(x => x.id === id);
  if (!p) return;
  openConfirm("审核通过", `确认通过「${p.month} ${deptShort(p.dept)} 月度计划」？通过后将不可再修改。`, () => {
    p.status = "pass";
    p.updated = TODAY;
    p.logs = (p.logs || []).concat([{ t:"审核通过", s:"王敏 · 项目经理 · " + TODAY, on:true }]);
    closeMask("viewMask");
    render();
    toast("已通过，可开始执行");
  }, "确认通过");
}
function askReject(id){
  const p = PLANS.find(x => x.id === id);
  if (!p) return;
  openConfirm("驳回计划", "请填写驳回原因，申请人可修改后重新提交。", () => {
    const v = ($("cfmTa").value || "").trim();
    if (!v){ toast("请填写驳回原因"); return; }
    p.status = "rej";
    p.rejectReason = v;
    p.updated = TODAY;
    p.logs = (p.logs || []).concat([{ t:"审核驳回：" + v, s:"王敏 · 项目经理 · " + TODAY, on:true }]);
    closeConfirm();
    closeMask("viewMask");
    render();
    toast("已驳回");
  }, "确认驳回", true);
}
function askDelete(id){
  const p = PLANS.find(x => x.id === id);
  if (!p) return;
  openConfirm("删除计划", `确定删除「${p.month} ${deptShort(p.dept)} 月度计划」？删除后不可恢复。`, () => {
    PLANS = PLANS.filter(x => x.id !== id);
    if (viewId === id){ closeMask("viewMask"); viewId = null; }
    render();
    toast("已删除");
  }, "删除");
}

// 通用确认弹层
let confirmCb = null;
function openConfirm(title, desc, cb, okText, withInput){
  confirmCb = cb;
  $("cfmTitle").textContent = title;
  $("cfmDesc").textContent = desc;
  $("cfmOk").textContent = okText || "确定";
  $("cfmExtra").innerHTML = withInput ? `<textarea class="cfm-ta" id="cfmTa" maxlength="60" placeholder="必填，最多 60 字"></textarea>` : "";
  $("cfmMask").classList.add("open");
}
function closeConfirm(){
  $("cfmMask").classList.remove("open");
  confirmCb = null;
}
function doConfirm(){
  const cb = confirmCb;
  if (cb) cb();
  $("cfmMask").classList.remove("open");
}

// ============ 启动 ============
render();
// 原型直达：#wait 打开第一份待审核计划的详情
if ((location.hash || "").replace("#", "") === "wait") {
  const p = PLANS.find(x => x.status === "wait");
  if (p) openView(p.id);
}
</script>
</body>
</html>
