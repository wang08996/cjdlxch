  }
];

// ========== 状态 ==========
let curTab = "form";      // form | list | mine
let flt = "all";          // all | q | s | pending | done
let editingId = null;     // 编辑中的记录
let detailId = null;      // 详情中的记录
let replyId = null;       // 回复中的记录
let cfmId = null;
let replyPhotos = 0;
let replyNote = "";
let form = { type: "", proj: "", part: "", issue: "", photos: 0, due: "", assignee: "" };

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 1900);
}
function goBack() { location.href = "../site.html"; }
function closeMask(id) { document.getElementById(id).classList.remove("open"); }
function stTxt(r) {
  if (r.status === "done") return { txt: "已整改", cls: "b-done" };
  if (r.reply) return { txt: "已回复·待确认", cls: "b-replied" };
  return { txt: "待整改", cls: "b-pending" };
}
function isOverdue(r) {
  return r.status !== "done" && r.due && r.due < todayStr();
}

// ========== Tab & 主渲染 ==========
function switchTab(t) {
  if (curTab === "form" && t !== "form") syncFormInputs();
  curTab = t;
  document.getElementById("paneForm").className = "pane" + (t === "form" ? "" : " hide");
  document.getElementById("paneList").className = "pane" + (t === "list" ? "" : " hide");
  document.getElementById("paneMine").className = "pane" + (t === "mine" ? "" : " hide");
  render();
}
function render() {
  const mineRows = RECORDS.filter(r => r.assignee === ME);
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = `
    <div class="tab ${curTab === "list" ? "on" : ""}" onclick="switchTab('list')">整改单 ${RECORDS.length}</div>
    <div class="tab ${curTab === "mine" ? "on" : ""}" onclick="switchTab('mine')">待我整改 ${mineRows.length}</div>`;
  tabsEl.style.display = curTab === "form" ? "none" : "flex";
  const nr = document.getElementById("navRight");
  if (curTab === "form") {
    nr.textContent = "取消";
    nr.onclick = function () { cancelForm(); };
  } else {
    nr.textContent = "+ 新增";
    nr.onclick = function () { openForm(); };
  }

  if (curTab === "form") renderForm();
  else if (curTab === "list") renderList();
  else renderMine();
}
function openForm() {
  editingId = null;
  form = { type: "", proj: "", part: "", issue: "", photos: 0, due: "", assignee: "" };
  switchTab("form");
}
function cancelForm() {
  editingId = null;
  form = { type: "", proj: "", part: "", issue: "", photos: 0, due: "", assignee: "" };
  switchTab("list");
}

// ========== 录入表单 ==========
function renderForm() {
  const p = projOf(form.proj);
  const isEdit = editingId !== null;
  document.getElementById("paneForm").innerHTML = `
    ${isEdit ? `<div class="sec-title" style="color:#2b7cff;">正在编辑 ${RECORDS.find(r=>r.id===editingId).no}，保存后覆盖原记录</div>` : ""}
    <div class="sec-title">问题信息</div>
    <div class="card">
      <div class="row">
        <span class="lbl"><i>*</i>整改类型</span>
        <div class="tchips">
          <span class="tchip ${form.type === "quality" ? "on-q" : ""}" onclick="setType('quality')">质量整改</span>
          <span class="tchip ${form.type === "safety" ? "on-s" : ""}" onclick="setType('safety')">安全整改</span>
        </div>
      </div>
      <div class="row tap" onclick="openProjPick()">
        <span class="lbl"><i>*</i>所属项目</span>
        <span class="val ${p ? "" : "ph"}">${p ? p.name : "请选择项目"}</span>
        <span class="arr">›</span>
      </div>
      <div class="row tap" onclick="openPartPick()">
        <span class="lbl">部位 / 地点</span>
        <span class="val ${form.part ? '' : 'ph'}">${form.part || "如 HA-2 环网箱基础"}</span>
        <span class="arr">›</span>
      </div>
    </div>
    <div class="card" style="margin-top:10px;">
      <div class="issue-box">
        <span class="lbl"><i>*</i>问题内容</span>
        <textarea class="f-area" id="fIssue" placeholder="描述发现的问题、部位、现象与依据（如不符合哪条规范）">${form.issue}</textarea>
      </div>
    </div>

    <div class="photo-card">
      <div class="photo-head">
        <div class="t"><i>*</i> 问题照片</div>
        <div class="c">${form.photos}/6 张</div>
      </div>
      <div class="photo-grid" id="formPhotos"></div>
    </div>

    <div class="sec-title">整改要求</div>
    <div class="card">
      <div class="row">
        <span class="lbl">要求整改日期</span>
        <input class="inp" type="date" id="fDue" value="${form.due}" min="${todayStr()}" onchange="form.due=this.value">
      </div>
      <div class="row tap" onclick="openPersonPick()">
        <span class="lbl">整改人</span>
        <span class="val ${form.assignee ? "" : "ph"}">${form.assignee || "不填则由班组长指派"}</span>
        <span class="arr">›</span>
      </div>
    </div>

    <div class="submit-bar">
      <button class="btn-main" onclick="submitForm()">${isEdit ? "保存修改" : "提交整改单"}</button>
      ${isEdit ? `<div style="margin-top:10px"><button class="btn-ghost-wide" onclick="cancelEdit()">取消编辑</button></div>` : ""}
    </div>`;
  renderFormPhotos();
}
function renderFormPhotos() {
  const g = document.getElementById("formPhotos");
  if (!g) return;
  let s = "";
  for (let i = 0; i < form.photos; i++) {
    s += `<div class="thumb">照片 ${i + 1}<span class="del" onclick="delFormPhoto()">✕</span></div>`;
  }
  if (form.photos < 6) s += `<div class="add-photo" onclick="addFormPhoto()">+</div>`;
  g.innerHTML = s;
}
function setType(t) { syncFormInputs(); form.type = t; renderForm(); }
function addFormPhoto() {
  if (form.photos >= 6) { toast("最多 6 张"); return; }
  form.photos++; renderFormPhotos(); toast("已添加 1 张照片（演示）");
}
function delFormPhoto() { if (form.photos > 0) { form.photos--; renderFormPhotos(); } }
function cancelEdit() {
  editingId = null;
  form = { type: "", proj: "", part: "", issue: "", photos: 0, due: "", assignee: "" };
  render();
}
function submitForm() {
  const fp = document.getElementById("fPart");
  if (fp) form.part = (fp.value || "").trim();
  form.issue = (document.getElementById("fIssue").value || "").trim();
  form.due = (document.getElementById("fDue").value || "").trim();
  if (!form.type) { toast("请选择整改类型"); return; }
  if (!form.proj) { toast("请选择所属项目"); return; }
  if (!form.issue) { toast("请填写问题内容"); return; }
  if (form.photos < 1) { toast("请至少上传 1 张问题照片"); return; }

  if (editingId === null) {
    const id = RECORDS.reduce((m, r) => Math.max(m, r.id), 0) + 1;
    const now = nowText();
    RECORDS.unshift({
      id: id, no: makeNo(todayStr().replace(/-/g, "")), proj: form.proj, part: form.part,
      type: form.type, issue: form.issue, photos: form.photos, due: form.due,
      assignee: form.assignee, reporter: ME, createdAt: now,
      reply: null, status: "pending", doneAt: ""
    });
    toast("整改单已提交");
  } else {
    const r = RECORDS.find(x => x.id === editingId);
    r.proj = form.proj; r.part = form.part; r.type = form.type; r.issue = form.issue;
    r.photos = form.photos; r.due = form.due; r.assignee = form.assignee;
    toast("整改单已更新");
  }
  editingId = null;
  form = { type: "", proj: "", part: "", issue: "", photos: 0, due: "", assignee: "" };
  switchTab("list");
}

// ========== 列表 ==========
function matchKw(r) {
  const kw = (document.getElementById("kw") ? document.getElementById("kw").value : "").trim().toLowerCase();
  if (!kw) return true;
  return (r.issue + " " + projName(r.proj) + " " + (r.part || "") + " " + (r.assignee || "") + " " + r.no + " " + r.reporter)
    .toLowerCase().indexOf(kw) >= 0;
}
function filterRows(rows) {
  return rows.filter(r => {
    if (!matchKw(r)) return false;
    if (flt === "q") return r.type === "quality";
    if (flt === "s") return r.type === "safety";
    if (flt === "pending") return r.status === "pending";
    if (flt === "done") return r.status === "done";
    return true;
  });
}
function cardHtml(r, showRole) {
  const st = stTxt(r);
  const over = isOverdue(r);
  const roleTag = showRole
    ? (r.reporter === ME ? "我发起" : (r.assignee === ME ? "我整改" : ""))
    : "";
  return `<div class="r-card" onclick="openDetail(${r.id})">
    <div class="r-top">
      <span class="badge ${r.type === "quality" ? "b-q" : "b-s"}">${TYPE_TXT[r.type]}</span>
      <span class="badge ${st.cls}">${st.txt}</span>
      ${over ? `<span class="badge b-over">已超期</span>` : ""}
      <span class="r-no">${r.no}</span>
    </div>
    <div class="r-issue">${r.issue}</div>
    <div class="r-line"><b>${projName(r.proj)}</b>${r.part ? " · " + r.part : ""}</div>
    <div class="r-line">要求整改 ${r.due ? shortDate(r.due) : "未设期限"} · 整改人 ${r.assignee || "待指派"}</div>
    <div class="r-foot">
      <span>照片 ${r.photos} 张</span>
      <span>${r.reporter} · ${r.createdAt.slice(5)}</span>
    </div>
    ${roleTag ? `<div class="r-line" style="margin-top:8px"><span class="r-role">${roleTag}</span></div>` : ""}
  </div>`;
}
function renderList() {
  const q = RECORDS.filter(matchKw);
  const cnt = {
    all: q.length,
    q: q.filter(r => r.type === "quality").length,
    s: q.filter(r => r.type === "safety").length,
    pending: q.filter(r => r.status === "pending").length,
    done: q.filter(r => r.status === "done").length
  };
  const rows = filterRows(RECORDS);
  document.getElementById("paneList").innerHTML = `
    <div class="search-wrap">
      <input class="search" id="kw" placeholder="搜索问题内容 / 项目 / 整改人 / 编号" oninput="render()">
      <div class="chips">
        <span class="fchip ${flt === "all" ? "on" : ""}" onclick="setFlt('all')">全部 ${cnt.all}</span>
        <span class="fchip ${flt === "q" ? "on" : ""}" onclick="setFlt('q')">质量 ${cnt.q}</span>
        <span class="fchip ${flt === "s" ? "on" : ""}" onclick="setFlt('s')">安全 ${cnt.s}</span>
        <span class="fchip ${flt === "pending" ? "on" : ""}" onclick="setFlt('pending')">待整改 ${cnt.pending}</span>
        <span class="fchip ${flt === "done" ? "on" : ""}" onclick="setFlt('done')">已整改 ${cnt.done}</span>
      </div>
    </div>
    <div class="list-head">共 ${rows.length} 条整改单</div>
    ${rows.length ? rows.map(r => cardHtml(r, false)).join("") : `<div class="empty">没有符合条件的整改单</div>`}
    <div class="add-row" onclick="switchTab('form')">+ 录入整改单</div>`;
}
function setFlt(f) { flt = f; render(); }
function renderMine() {
  const rows = RECORDS.filter(r => r.assignee === ME);
  document.getElementById("paneMine").innerHTML = `
    <div class="list-head">待我整改 ${rows.length} 条</div>
    ${rows.length ? rows.map(r => cardHtml(r, true)).join("") :
      `<div class="empty">暂无指派给你的整改单<br>管理员指派整改人后会出现在这里</div>`}`;
}

// ========== 详情 ==========
function openDetail(id) {
  const r = RECORDS.find(x => x.id === id);
  if (!r) return;
  detailId = id;
  const st = stTxt(r);
  const over = isOverdue(r);
  const canReply = r.status === "pending" && !r.reply && (r.assignee === ME || !r.assignee);
  const canConfirm = r.status === "pending" && !!r.reply && r.reporter === ME;
  const canEdit = r.reporter === ME && r.status === "pending" && !r.reply;
  const canDel = r.reporter === ME && r.status === "pending" && !r.reply;

  document.getElementById("detailBody").innerHTML = `
    <div class="r-top" style="margin-bottom:12px;">
      <span class="badge ${r.type === "quality" ? "b-q" : "b-s"}">${TYPE_TXT[r.type]}</span>
      <span class="badge ${st.cls}">${st.txt}</span>
      ${over ? `<span class="badge b-over">已超期</span>` : ""}
      <span class="r-no">${r.no}</span>
    </div>
    <div class="d-sec" style="margin-top:0;">问题信息</div>
    <div class="d-row"><span class="k">项目</span><span class="v">${projName(r.proj)}</span></div>
    <div class="d-row"><span class="k">部位</span><span class="v">${r.part || "—"}</span></div>
    <div class="d-row"><span class="k">问题内容</span><span class="v">${r.issue}</span></div>
    <div class="d-photo">
      <div class="d-photo-t">问题照片 <span class="c">${r.photos} 张</span></div>
      <div class="photo-grid" id="detailProbGrid"></div>
    </div>
    <div class="d-sec">整改要求</div>
    <div class="d-row"><span class="k">要求日期</span><span class="v">${r.due ? shortDate(r.due) : "未设期限"}</span></div>
    <div class="d-row"><span class="k">整改人</span><span class="v">${r.assignee || "待指派"}</span></div>
    <div class="d-row"><span class="k">发现人</span><span class="v">${r.reporter} · ${r.createdAt}</span></div>
    <div class="d-sec">整改回复</div>
    ${r.reply ? `<div class="reply-box">
        <div class="rh">${r.reply.by} 于 ${r.reply.at} 提交 · 整改后照片 ${r.reply.photos} 张</div>
        ${r.reply.note}
        ${r.status === "done"
          ? `<div style="margin-top:8px;color:#15803d;font-weight:600;">已由 ${r.reporter} 确认完成（${r.doneAt}）</div>`
          : `<div style="margin-top:8px;color:#b45309;font-weight:600;">等待发起人 ${r.reporter} 确认</div>`}
      </div>`
      : `<div class="wait-box">整改人尚未提交整改回复${r.assignee ? "，" + r.assignee + " 提交后需由发起人确认" : "，当前待指派"}</div>`}
    ${(r.reply || canReply) ? `<div class="d-photo" style="border-bottom:0;">
      <div class="d-photo-t">整改照片 <span class="c">${r.reply ? "整改人上传" : "先拍照上传，提交回复时一并提交"}</span></div>
      <div class="photo-grid" id="detailRepGrid"></div>
    </div>` : ""}`;

  let foot = "";
  if (canEdit || canDel) {
    foot += `<div style="display:flex;gap:10px;">
      ${canEdit ? `<button class="btn-ghost-wide" style="flex:1" onclick="editRecord(${r.id})">编辑</button>` : ""}
      ${canDel ? `<button class="btn-ghost-wide" style="flex:1;border-color:#fca5a5;color:#dc2626" onclick="askDelete(${r.id})">删除</button>` : ""}
    </div>`;
  }
  let mainBtn = "";
  if (canReply) mainBtn = `<button class="btn-primary" onclick="openReply(${r.id})">提交整改回复</button>`;
  else if (canConfirm) mainBtn = `<button class="btn-primary" onclick="askConfirm(${r.id})">确认完成（闭环）</button>`;
  else mainBtn = `<button class="btn-secondary" onclick="closeMask('detailMask')">关闭</button>`;
  document.getElementById("detailFoot").innerHTML =
    `<div style="width:100%">${foot}${foot ? '<div style="height:10px"></div>' : ""}<div style="display:flex;gap:10px">${mainBtn}</div></div>`;
  document.getElementById("detailMask").classList.add("open");
  renderDetailPhotos();
}

// 详情照片（问题照片只读 / 整改照片可上传）
function renderDetailPhotos() {
  const r = RECORDS.find(x => x.id === detailId);
  if (!r) return;
  const g1 = document.getElementById("detailProbGrid");
  if (g1) {
    let s = "";
    for (let i = 0; i < r.photos; i++) s += `<div class="thumb">问题 ${i + 1}</div>`;
    g1.innerHTML = s || `<div class="ph-none">暂无照片</div>`;
  }
  const g2 = document.getElementById("detailRepGrid");
  if (!g2) return;
  const n = r.reply ? r.reply.photos : (r.photoCount || 0);
  let s = "";
  for (let i = 0; i < n; i++) {
    s += `<div class="thumb">整改 ${i + 1}${r.reply ? "" : `<span class="del" onclick="delDetailPhoto()">✕</span>`}</div>`;
  }
  if (!r.reply && n < 6) s += `<div class="add-photo" onclick="addDetailPhoto()">+</div>`;
  g2.innerHTML = s || `<div class="ph-none">还没有上传整改照片</div>`;
}
function addDetailPhoto() {
  const r = RECORDS.find(x => x.id === detailId);
  if (!r || r.reply) return;
  r.photoCount = Math.min(6, (r.photoCount || 0) + 1);
  renderDetailPhotos();
  toast("已上传 1 张整改照片（演示）");
}
function delDetailPhoto() {
  const r = RECORDS.find(x => x.id === detailId);
  if (!r || r.reply) return;
  r.photoCount = Math.max(0, (r.photoCount || 0) - 1);
  renderDetailPhotos();
}

// ========== 整改回复 ==========
function openReply(id) {
  const r = RECORDS.find(x => x.id === id);
  if (!r) return;
  replyId = id; replyPhotos = r.photoCount || 0; replyNote = "";
  document.getElementById("replyBody").innerHTML = `
    <div class="d-row" style="padding-top:0"><span class="k">整改单</span><span class="v">${r.no} · ${projName(r.proj)}</span></div>
    <div class="d-row" style="border-bottom:0;"><span class="k">问题</span><span class="v">${r.issue}</span></div>
    <div class="d-sec">整改说明<span style="color:#dc2626">*</span></div>
    <textarea class="f-area" id="rNote" placeholder="写清整改措施、整改结果、复测数据（如支护高度、紧固力矩）">${replyNote}</textarea>
    <div class="photo-card" style="margin:12px 0 0;padding:12px 0 0;">
      <div class="photo-head">
        <div class="t"><i>*</i> 整改后照片</div>
        <div class="c" id="replyCnt">${replyPhotos}/6 张</div>
      </div>
      <div class="photo-grid" id="replyPhotoGrid"></div>
    </div>`;
  renderReplyPhotos();
  document.getElementById("replyMask").classList.add("open");
}
function renderReplyPhotos() {
  const g = document.getElementById("replyPhotoGrid");
  if (!g) return;
  let s = "";
  for (let i = 0; i < replyPhotos; i++) {
    s += `<div class="thumb">照片 ${i + 1}<span class="del" onclick="delReplyPhoto()">✕</span></div>`;
  }
  if (replyPhotos < 6) s += `<div class="add-photo" onclick="addReplyPhoto()">+</div>`;
  g.innerHTML = s;
  const c = document.getElementById("replyCnt");
  if (c) c.textContent = replyPhotos + "/6 张";
}
function addReplyPhoto() {
  if (replyPhotos >= 6) { toast("最多 6 张"); return; }
  replyPhotos++; renderReplyPhotos(); toast("已添加 1 张照片（演示）");
}
function delReplyPhoto() { if (replyPhotos > 0) { replyPhotos--; renderReplyPhotos(); } }
function submitReply() {
  const r = RECORDS.find(x => x.id === replyId);
  if (!r) return;
  replyNote = (document.getElementById("rNote").value || "").trim();
  if (!replyNote) { toast("请填写整改说明"); return; }
  if (replyPhotos < 1) { toast("请至少上传 1 张整改后照片"); return; }
  r.reply = { by: ME, at: nowText(), note: replyNote, photos: replyPhotos };
  r.photoCount = replyPhotos;
  closeMask("replyMask");
  render();
  toast("整改回复已提交，等待发起人确认");
  openDetail(r.id);
}

// ========== 确认闭环 ==========
function askConfirm(id) {
  const r = RECORDS.find(x => x.id === id);
  if (!r) return;
  cfmId = id;
  document.getElementById("cfmTitle").textContent = "确认整改完成";
  document.getElementById("cfmDesc").innerHTML =
    `确认 <b>${r.assignee || "整改人"}</b> 对「${projName(r.proj)}」问题已完成整改？<br>` +
    `确认后整改单状态变为「已整改」，不可再编辑或删除。`;
  const ok = document.getElementById("cfmOk");
  ok.textContent = "确认完成";
  ok.className = "btn-primary";
  ok.onclick = function () { doConfirm(); };
  document.getElementById("cfmMask").classList.add("open");
}
function doConfirm() {
  const r = RECORDS.find(x => x.id === cfmId);
  if (!r) return;
  r.status = "done";
  r.doneAt = nowText();
  closeMask("cfmMask");
  render();
  toast("已确认完成，整改单闭环");
  openDetail(r.id);
}

// ========== 编辑 / 删除 ==========
function editRecord(id) {
  const r = RECORDS.find(x => x.id === id);
  if (!r) return;
  editingId = id;
  form = { type: r.type, proj: r.proj, part: r.part, issue: r.issue, photos: r.photos, due: r.due, assignee: r.assignee };
  closeMask("detailMask");
  switchTab("form");
}
function askDelete(id) {
  const r = RECORDS.find(x => x.id === id);
  if (!r) return;
  cfmId = id;
  document.getElementById("cfmTitle").textContent = "删除整改单";
  document.getElementById("cfmDesc").innerHTML =
    `确定删除整改单 <b>${r.no}</b>？<br>${projName(r.proj)} · ${r.issue.slice(0, 28)}…<br>删除后不可恢复。`;
  const ok = document.getElementById("cfmOk");
  ok.textContent = "删除";
  ok.className = "btn-danger";
  ok.onclick = function () { doDelete(); };
  document.getElementById("cfmMask").classList.add("open");
}
function doDelete() {
  RECORDS = RECORDS.filter(x => x.id !== cfmId);
  closeMask("cfmMask");
  closeMask("detailMask");
  render();
  toast("整改单已删除");
}

// ========== 部位 / 地点 弹窗输入 ==========
const PART_PRESETS = ["HA-2 环网箱基础", "开关柜（10kV）", "电缆井 / 工井", "杆塔基础", "顶管段", "表箱安装位置", "变压器台架"];
function openPartPick() {
  syncFormInputs();
  document.getElementById("partInput").value = form.part || "";
  renderPartChips();
  document.getElementById("partMask").classList.add("open");
  setTimeout(() => document.getElementById("partInput").focus(), 80);
}
function renderPartChips() {
  document.getElementById("partChips").innerHTML = PART_PRESETS.map(t =>
    `<span class="tchip ${form.part === t ? "on-q" : ""}" onclick="pickPart('${t}')">${t}</span>`
  ).join("");
}
function pickPart(t) {
  form.part = t;
  document.getElementById("partInput").value = t;
  renderPartChips();
}
function savePart() {
  form.part = (document.getElementById("partInput").value || "").trim();
  closeMask("partMask");
  render();
  toast(form.part ? "部位已填写" : "已清空部位");
}

// ========== 项目 / 人员选择 ==========
function syncFormInputs() {
  const p = document.getElementById("fPart");
  const i = document.getElementById("fIssue");
  const d = document.getElementById("fDue");
  if (p) form.part = p.value;
  if (i) form.issue = i.value;
  if (d) form.due = d.value;
}
function openProjPick() {
  syncFormInputs();
  document.getElementById("projKw").value = "";
  renderProjList();
  document.getElementById("projMask").classList.add("open");
}
function renderProjList() {
  const kw = (document.getElementById("projKw").value || "").trim().toLowerCase();
  const rows = PROJECTS.filter(p => !kw || (p.name + " " + p.leader).toLowerCase().indexOf(kw) >= 0);
  document.getElementById("projList").innerHTML = rows.length
    ? rows.map(p => `<div class="pk-item ${form.proj === p.code ? "on" : ""}" data-code="${p.code}" onclick="pickProj(this.dataset.code)">
        ${p.name}<span class="pk-lead">负责人 ${p.leader}</span>
        ${form.proj === p.code ? '<span class="pk-ck">已选</span>' : ""}
      </div>`).join("")
    : `<div class="empty" style="margin:24px 0;">没有匹配的项目</div>`;
}
function pickProj(code) {
  form.proj = code;
  closeMask("projMask");
  renderForm();
}
function openPersonPick() {
  syncFormInputs();
  document.getElementById("personKw").value = "";
  renderPersonList();
  document.getElementById("personMask").classList.add("open");
}
function renderPersonList() {
  const kw = (document.getElementById("personKw").value || "").trim().toLowerCase();
  const rows = PEOPLE.filter(p => !kw || (p.name + " " + p.role + " " + p.dept).toLowerCase().indexOf(kw) >= 0);
  const none = `<div class="pk-item ${form.assignee ? "" : "on"}" onclick="pickPerson('')">不指派<span class="pk-lead">由班组长后续指派</span>${form.assignee ? "" : '<span class="pk-ck">已选</span>'}</div>`;
  document.getElementById("personList").innerHTML = none + (rows.length
    ? rows.map(p => `<div class="pk-item ${form.assignee === p.name ? "on" : ""}" data-nm="${p.name}" onclick="pickPerson(this.dataset.nm)">
        ${p.name}<span class="pk-lead">${p.role} · ${p.dept}</span>
        ${form.assignee === p.name ? '<span class="pk-ck">已选</span>' : ""}
      </div>`).join("")
    : `<div class="empty" style="margin:20px 0;">没有匹配的人员</div>`);
}
function pickPerson(name) {
  form.assignee = name;
  closeMask("personMask");
  renderForm();
}

// ========== 启动 ==========
(function boot() {
  var qs = new URLSearchParams(location.search);
  var p = qs.get("proj");
  var issue = qs.get("issue");
  if (p && projOf(p)) {
    openForm();
    form.proj = p;
    if (issue) form.issue = issue;
    renderForm();
    toast("已从项目日报带入项目与问题描述");
  } else {
    switchTab("form");
  }
  if ((location.hash || "").indexOf("part") >= 0) setTimeout(() => openPartPick(), 60);
})();
</script>
</body>
</html>
