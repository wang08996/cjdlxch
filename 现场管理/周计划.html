<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周计划 - 郴江电力</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#e9ecf1; }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  .phone { width:390px; height:820px; background:#f4f6f9; border-radius:36px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.18); position:relative; display:flex; flex-direction:column; }
  .statusbar { height:44px; background:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-size:14px; font-weight:600; flex-shrink:0; }
  .statusbar .right { display:flex; align-items:center; gap:6px; font-size:12px; }
  .navbar { height:48px; background:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 12px; border-bottom:1px solid #f0f0f0; flex-shrink:0; }
  .navbar .back { font-size:15px; color:#2b7cff; padding:8px 4px; cursor:pointer; }
  .navbar .title { font-size:17px; font-weight:600; color:#222; }
  .navbar .right { width:60px; text-align:right; }

  .body { flex:1; overflow-y:auto; background:#f4f6f9; }

  /* 周选择 */
  .week-bar { background:#fff; padding:12px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #f0f0f0; position:relative; }
  .share-chip { position:absolute; top:8px; right:8px; background:#eef4ff; color:#2b7cff; font-size:11px; font-weight:600; padding:4px 9px; border-radius:12px; cursor:pointer; }
  .share-chip:active { opacity:.7; }
  .week-nav { font-size:18px; color:#2b7cff; cursor:pointer; padding:4px 10px; }
  .week-info { text-align:center; }
  .week-title { font-size:15px; font-weight:600; color:#222; }
  .week-range { font-size:12px; color:#888; margin-top:2px; }
  .week-status { font-size:11px; padding:3px 10px; border-radius:10px; font-weight:600; margin-top:4px; display:inline-block; }
  .st-draft { background:#fef3c7; color:#b45309; }
  .st-review { background:#dbeafe; color:#1d4ed8; }
  .st-published { background:#dcfce7; color:#16a34a; }

  /* 整体备注 */
  .global-note { margin:10px 12px; background:#fff; border-radius:10px; padding:12px; }
  .global-note label { font-size:12px; color:#888; display:block; margin-bottom:6px; }
  .global-note textarea { width:100%; min-height:50px; border:1px solid #e5e7eb; border-radius:8px; padding:8px; font-size:13px; resize:none; }

  /* 7天 */
  .day-card { background:#fff; margin:0 12px 10px; border-radius:12px; overflow:hidden; }
  .day-head { padding:12px 14px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; border-bottom:1px solid #f4f4f4; }
  .day-name { font-size:15px; font-weight:600; color:#222; }
  .day-date { font-size:12px; color:#888; margin-top:2px; }
  .day-count { font-size:11px; color:#2b7cff; background:#dbeafe; padding:2px 8px; border-radius:8px; }
  .day-body { padding:10px 14px; display:none; }
  .day-body.open { display:block; }

  .proj-item { background:#f8f9fb; border-radius:8px; padding:10px; margin-bottom:8px; }
  .proj-name { font-size:13px; font-weight:600; color:#222; margin-bottom:6px; }
  .task-line { font-size:12px; color:#555; padding:3px 0; }
  .task-line b { color:#222; }
  .risk-badge { display:inline-block; font-size:10px; padding:1px 6px; border-radius:4px; margin-left:4px; }
  .r-I { background:#dcfce7; color:#16a34a; }
  .r-II { background:#d1fae5; color:#059669; }
  .r-III { background:#fef3c7; color:#b45309; }
  .r-IV { background:#ffedd5; color:#ea580c; }
  .r-V { background:#fee2e2; color:#dc2626; }

  .add-row { margin:8px 12px; padding:12px; text-align:center; font-size:14px; color:#2b7cff; border:1px dashed #c8ddff; border-radius:10px; cursor:pointer; background:#fff; }

  .bottom-bar { flex-shrink:0; background:#fff; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid #f0f0f0; display:flex; gap:10px; }
  .btn-primary { flex:1; height:48px; border:none; border-radius:10px; background:#2b7cff; color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
  .btn-secondary { flex:1; height:48px; border:1px solid #2b7cff; border-radius:10px; background:#fff; color:#2b7cff; font-size:16px; font-weight:600; cursor:pointer; }
  .btn-disabled { flex:1; height:48px; border:none; border-radius:10px; background:#f0f0f0; color:#999; font-size:15px; }

  .mask { position:absolute; inset:0; background:rgba(0,0,0,.45); z-index:50; display:none; align-items:flex-end; }
  .mask.open { display:flex; }
  .sheet { background:#fff; width:100%; max-height:85%; border-radius:16px 16px 0 0; display:flex; flex-direction:column; }
  .sheet-head { padding:14px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #f0f0f0; }
  .sheet-title { font-size:16px; font-weight:600; }
  .sheet-close { color:#888; font-size:14px; cursor:pointer; }
  .sheet-body { flex:1; overflow-y:auto; padding:14px; }
  .sheet-foot { padding:12px 14px; border-top:1px solid #f0f0f0; display:flex; gap:8px; }

  /* 人员选择浮层（统一样式） */
  .pw-search { width:100%; height:40px; border:none; background:#f2f3f5; border-radius:20px; padding:0 14px; font-size:14px; box-sizing:border-box; outline:none; }
  .pw-tabs { display:flex; gap:6px; padding:0 14px 10px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
  .pw-tabs::-webkit-scrollbar { display:none; }
  .pw-tab { padding:7px 10px; border-radius:16px; background:#f2f3f5; font-size:12.5px; color:#555; cursor:pointer; flex:none; white-space:nowrap; }
  .pw-tab.on { background:#2b7cff; color:#fff; }
  .pw-row { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid #f2f3f5; cursor:pointer; }
  .pw-row.disabled { opacity:.55; cursor:not-allowed; }
  .pw-avatar { width:40px; height:40px; border-radius:50%; background:#dbeafe; color:#2b7cff; display:flex; align-items:center; justify-content:center; font-weight:600; flex:none; }
  .pw-info { flex:1; min-width:0; }
  .pw-name { font-size:15px; font-weight:600; color:#222; }
  .pw-name .pw-tag-self { font-size:10px; background:#dbeafe; color:#1d4ed8; padding:1px 6px; border-radius:4px; margin-left:6px; font-weight:400; }
  .pw-name .pw-tag-out { font-size:10px; background:#fef3c7; color:#92400e; padding:1px 6px; border-radius:4px; margin-left:6px; font-weight:400; }
  .pw-name .pw-tag-grid { font-size:10px; background:#e3f0ff; color:#1b5fd0; padding:1px 6px; border-radius:4px; margin-left:4px; font-weight:600; }
  .pw-name .pw-tag-nogrid { font-size:10px; background:#f3f4f6; color:#9ca3af; padding:1px 6px; border-radius:4px; margin-left:4px; font-weight:400; }
  .pw-sub { font-size:11px; color:#888; margin-top:3px; }
  .pw-ins { font-size:11px; padding:2px 8px; border-radius:8px; font-weight:500; }
  .pw-ins.ok { background:#dcfce7; color:#15803d; }
  .pw-ins.warn { background:#fef3c7; color:#b45309; }
  .pw-ins.bad { background:#fee2e2; color:#b91c1c; }
  .pw-check { width:24px; height:24px; border-radius:50%; border:2px solid #ccc; flex:none; }
  .pw-check.on { background:#2b7cff; border-color:#2b7cff; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; }

  .form-row { margin-bottom:12px; }
  .form-row label { font-size:12px; color:#888; display:block; margin-bottom:4px; }
  .form-row input, .form-row select, .form-row textarea { width:100%; height:40px; border:1px solid #ddd; border-radius:8px; padding:0 10px; font-size:14px; }
  .form-row textarea { min-height:60px; padding:8px; }
  .risk-pick { display:flex; gap:6px; }
  .risk-opt { flex:1; height:40px; border:1px solid #ddd; border-radius:8px; background:#fff; font-size:14px; cursor:pointer; }
  .risk-opt.on { background:#2b7cff; color:#fff; border-color:#2b7cff; font-weight:600; }

  .toast { position:absolute; bottom:100px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.75); color:#fff; padding:10px 20px; border-radius:20px; font-size:14px; z-index:99; display:none; white-space:nowrap; }
  .toast.show { display:block; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="right">📶 🔋 100%</span></div>
  <div class="navbar">
    <div class="back" onclick="location.href='../site.html'">‹ 现场管理</div>
    <div class="title">周计划</div>
    <div class="right"></div>
  </div>
  <div class="body" id="body"></div>
  <div class="bottom-bar" id="bottomBar"></div>

  <!-- 任务编辑 sheet -->
  <div class="mask" id="taskMask">
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title" id="taskSheetTitle">添加任务</div>
        <div class="sheet-close" onclick="closeTaskSheet()">关闭</div>
      </div>
      <div class="sheet-body">
        <div class="form-row"><label>项目（选一次，本页多条任务都归这个项目）</label>
          <input id="fProj" placeholder="点击选择项目" readonly onclick="openProjPicker()" style="background:#f9fafb;">
        </div>
        <div id="pendingBox" style="display:none;margin:0 0 12px;">
          <div style="font-size:12px;color:#888;margin-bottom:6px;">本页已添加 <b id="pendingCount" style="color:#2b7cff;">0</b> 条任务（同一项目）</div>
          <div id="pendingList"></div>
        </div>
        <div style="font-size:12px;color:#888;margin:-2px 0 8px;padding-top:8px;border-top:1px dashed #eee;">正在填写下一条任务</div>
        <div class="form-row"><label>作业内容</label><input id="fTask" placeholder="如：放线、顶管"></div>
        <div id="taskHistory" style="margin:-6px 0 12px;display:flex;flex-wrap:wrap;gap:6px;"></div>
        <div class="form-row"><label>风险等级</label>
          <div class="risk-pick" id="fRisk">
            <button class="risk-opt on" data-v="I">I</button>
            <button class="risk-opt" data-v="II">II</button>
            <button class="risk-opt" data-v="III">III</button>
            <button class="risk-opt" data-v="IV">IV</button>
            <button class="risk-opt" data-v="V">V</button>
          </div>
        </div>
        <div class="form-row"><label>注意事项</label><textarea id="fNote" placeholder="安全注意事项"></textarea></div>
        <div class="form-row"><label>任务负责人（选具体人）</label>
          <input id="fLeader" placeholder="点击选择人员" readonly onclick="openWorkerPicker()" style="background:#f9fafb;">
        </div>
        <div style="display:flex;gap:8px;">
          <div class="form-row" style="flex:1;"><label>技工数</label><input id="fLabor" type="number" value="0"></div>
          <div class="form-row" style="flex:1;"><label>副工数</label><input id="fTech" type="number" value="0"></div>
        </div>
        <div class="form-row"><label>车辆（可多选）</label>
          <input id="fCar" placeholder="点击选车" readonly onclick="openCarPicker()" style="background:#f9fafb;">
        </div>
        <div class="form-row"><label>机械（可多选）</label>
          <input id="fMachine" placeholder="点击选机械" readonly onclick="openMachinePicker()" style="background:#f9fafb;">
        </div>
      </div>
      <div class="sheet-foot">
        <button class="btn-secondary" id="addMoreBtn" onclick="addPendingTask()" style="flex:1;">+ 再加一条任务</button>
        <button class="btn-primary" id="saveTaskBtn" onclick="saveTask()" style="flex:1.2;box-shadow:0 4px 12px rgba(43,124,255,.3);border-radius:12px;">保存任务</button>
      </div>
    </div>
  </div>

  <!-- 新建周计划 sheet（选周 + 作业组 + 创建人 / 部门） -->
  <div class="mask" id="pickWeekMask">
    <div class="sheet">
      <div class="sheet-head"><div class="sheet-title">新建周计划</div><div class="sheet-close" onclick="closePickWeek()">关闭</div></div>
      <div style="padding:12px 14px 2px;font-size:12px;color:#888;">先选周，再选作业组；同一周同一组只能有一份周计划</div>
      <div class="sheet-body" id="pickWeekList" style="max-height:250px;padding-bottom:4px;"></div>
      <div style="padding:0 14px 6px;border-top:1px solid #f0f0f0;">
        <div class="form-row"><label>作业组</label>
          <div id="newGroupRow" style="display:flex;gap:8px;padding:2px 0 4px;"></div>
        </div>
        <div class="form-row"><label>创建人</label><input id="newCreator" value="李志强"></div>
        <div class="form-row"><label>创建部门（默认）</label><input id="newDept" value="电网建设运维中心项目一部"></div>
        <div id="newWeekHint" style="font-size:12px;color:#ef4444;padding:2px 0 8px;display:none;"></div>
      </div>
      <div class="sheet-foot"><button class="btn-primary" id="newWeekBtn" style="box-shadow:0 4px 12px rgba(43,124,255,.3);border-radius:12px;" onclick="confirmPickWeek()">创建周计划</button></div>
    </div>
  </div>

  <!-- 项目选择 sheet -->
  <div class="mask" id="projMask">
    <div class="sheet">
      <div class="sheet-head"><div class="sheet-title">选择项目</div><div class="sheet-close" onclick="closeProjPicker()">关闭</div></div>
      <div style="padding:10px 14px;border-bottom:1px solid #f0f0f0;">
        <input id="projSearch" placeholder="搜索项目名称 / 项目编号" oninput="renderProjList()" style="width:100%;height:40px;border:1px solid #ddd;border-radius:8px;padding:0 10px;font-size:14px;">
      </div>
      <div class="sheet-body" id="projList" style="max-height:300px;"></div>
    </div>
  </div>

  <!-- 分享到群 sheet -->
  <div class="mask" id="shareMask">
    <div class="sheet">
      <div class="sheet-head"><div class="sheet-title">分享到工作群</div><div class="sheet-close" onclick="closeShare()">关闭</div></div>
      <div style="padding:10px 14px 6px;font-size:12px;color:#888;">已发布计划卡片将发送到所选群，群成员可直接查看本周安排</div>
      <div class="sheet-body" id="shareList" style="max-height:320px;padding:0 14px 14px;"></div>
    </div>
  </div>

  <!-- 选人 sheet -->
  <div class="mask" id="workerMask">
    <div class="sheet">
      <div class="sheet-head"><div class="sheet-title">选择任务负责人</div><div class="sheet-close" onclick="closeWorkerPicker()">关闭</div></div>
      <div style="padding:10px 14px 8px;">
        <input id="workerSearch" class="pw-search" placeholder="输入姓名搜索" oninput="renderWorkerList()">
      </div>
      <div class="pw-tabs" id="workerTabs">
        <div class="pw-tab on" data-f="all" onclick="setWorkerFilter(this)">全部</div>
        <div class="pw-tab" data-f="self" onclick="setWorkerFilter(this)">自有</div>
        <div class="pw-tab" data-f="out" onclick="setWorkerFilter(this)">外包</div>
        <div class="pw-tab" data-f="tech" onclick="setWorkerFilter(this)">技工</div>
        <div class="pw-tab" data-f="help" onclick="setWorkerFilter(this)">副工</div>
        <div class="pw-tab" data-f="grid" onclick="setWorkerFilter(this)">国网准入</div>
      </div>
      <div class="sheet-body" id="workerList" style="max-height:350px;padding:0 14px 14px;"></div>
    </div>
  </div>

  <!-- 选车 sheet -->
  <div class="mask" id="carMask">
    <div class="sheet">
      <div class="sheet-head"><div class="sheet-title">选择车辆（可多选）</div><div class="sheet-close" onclick="closeCarPicker()">关闭</div></div>
      <div style="padding:10px 14px;border-bottom:1px solid #f0f0f0;">
        <input id="carSearch" placeholder="搜索车牌/车型..." oninput="renderCarList()" style="width:100%;height:40px;border:1px solid #ddd;border-radius:8px;padding:0 10px;font-size:14px;">
      </div>
      <div class="sheet-body" id="carList" style="max-height:320px;"></div>
      <div style="padding:12px 14px;border-top:1px solid #f0f0f0;background:#fff;">
        <button onclick="confirmCarPicker()" style="width:100%;height:48px;border:none;border-radius:10px;background:#2b7cff;color:#fff;font-size:17px;font-weight:600;cursor:pointer;">确定</button>
      </div>
    </div>
  </div>

  <!-- 选择机械（可多选 + 数量） -->
  <div class="mask" id="machineMask">
    <div class="sheet">
      <div class="sheet-head"><div class="sheet-title">选择机械（可多选）</div><div class="sheet-close" onclick="closeMachinePicker()">关闭</div></div>
      <div style="padding:12px 14px 0;font-size:12px;color:#888;">点 ＋ / － 确定每类机械的台数</div>
      <div class="sheet-body" id="machineList" style="padding:10px 14px;"></div>
      <div style="padding:12px 14px;border-top:1px solid #f0f0f0;background:#fff;">
        <div id="machineSum" style="font-size:12px;color:#888;text-align:center;margin-bottom:8px;">还没有选择机械</div>
        <button onclick="confirmMachinePicker()" style="width:100%;height:48px;border:none;border-radius:10px;background:#2b7cff;color:#fff;font-size:17px;font-weight:600;cursor:pointer;">确定</button>
      </div>
    </div>
  </div>

  <!-- 历史周计划 sheet -->
  <div class="mask" id="historyMask">
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title">历史周计划</div>
        <div class="sheet-close" onclick="closeHistory()">关闭</div>
      </div>
      <div class="sheet-body" id="historyList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
// 项目库
const PROJ_LIB = [
  { code:"YL-2025-010", name:"园垄线10kV改造工程" },
  { code:"ZD-2025-007", name:"珠东线配电自动化改造" },
  { code:"WY-2025-003", name:"高速杆迁瓦窑坪支线工程" },
  { code:"JH-2025-012", name:"嘉禾县农网巩固提升工程" },
  { code:"SX-2025-021", name:"苏仙区小区供配电改造" },
  { code:"BL-2025-002", name:"10kV白露塘线迁改工程" },
  { code:"XN-2025-016", name:"湘南物流园屋顶分布式光伏" },
  { code:"BG-2025-008", name:"碧桂园配电房新建工程" },
];
// 劳务人员库（grid = 国网准入通过）
const WORKERS = [
  { name:"黄志远", type:"自有", role:"现场负责人", ins:"ok", insText:"保险有效", grid:true },
  { name:"刘建国", type:"自有", role:"队长", ins:"ok", insText:"保险有效", grid:true },
  { name:"陈立军", type:"自有", role:"队长", ins:"ok", insText:"保险有效", grid:true },
  { name:"张强",   type:"外包", role:"队长", ins:"ok", insText:"保险有效", grid:true },
  { name:"唐良辉", type:"外包", role:"队长", ins:"warn", insText:"保险11/18到期", grid:true },
  { name:"王大伟", type:"自有", role:"技工", ins:"ok", insText:"保险有效", grid:true },
  { name:"李军",   type:"自有", role:"技工", ins:"ok", insText:"保险有效", grid:true },
  { name:"刘文兵", type:"自有", role:"技工", ins:"ok", insText:"保险有效", grid:false },
  { name:"张喜明", type:"自有", role:"技工", ins:"ok", insText:"保险有效", grid:true },
  { name:"周正权", type:"外包", role:"技工", ins:"ok", insText:"保险有效", grid:true },
  { name:"朱伟林", type:"自有", role:"技工", ins:"ok", insText:"保险有效", grid:false },
  { name:"黄勇",   type:"外包", role:"技工", ins:"ok", insText:"保险有效", grid:true },
  { name:"李铁牛", type:"外包", role:"副工", ins:"ok", insText:"保险有效", grid:false },
  { name:"刘海",   type:"自有", role:"副工", ins:"ok", insText:"保险有效", grid:true },
  { name:"陈小兵", type:"外包", role:"副工", ins:"ok", insText:"保险有效", grid:true },
  { name:"张二狗", type:"外包", role:"副工", ins:"bad", insText:"保险过期", grid:false },
];
// 车辆库
const CARS = [
  { plate:"湘L·D1234", type:"皮卡车" },
  { plate:"湘L·T5678", type:"工程车" },
  { plate:"湘L·E9012", type:"面包车" },
  { plate:"湘L·K3456", type:"货车" },
];
// 常用作业内容历史
let TASK_HISTORY = ["放线","顶管","基础开挖","立杆","架线","放线撤线"];

// 根据今天算当前周
function getCurrentWeek(){
  const now = new Date();
  const onejan = new Date(now.getFullYear(),0,1);
  const week = Math.ceil((((now - onejan) / 86400000) + onejan.getDay()+1)/7);
  const d = new Date(now);
  const day = d.getDay()||7;
  d.setDate(d.getDate()-day+1);
  const fmt = x => (x.getMonth()+1)+'/'+x.getDate();
  const mon = new Date(d);
  const sun = new Date(d); sun.setDate(sun.getDate()+6);
  return { weekNo: week, start: fmt(mon), end: fmt(sun) };
}

  const days=names.map((n,i)=>({m:start.split('/')[0]+'/'+(parseInt(start.split('/')[1])+i), name:n, tasks:(tasksByDay&&tasksByDay[i])||[]}));
  return { weekNo:no, start, end, year:2026, dept:DEPT_DEFAULT, creator:creator||"李志强", status, remark, days, group:group||"pw" };
}

function toggleDay(m){ expandedDays[m] = !expandedDays[m]; render(); }

function shiftWeek(dir){
  currentWeekIdx += dir;
  if (currentWeekIdx < 0) currentWeekIdx = 0;
  if (currentWeekIdx >= WEEKS.length) currentWeekIdx = WEEKS.length - 1;
  WEEK = WEEKS[currentWeekIdx];
  expandedDays = {};
  render();
}
function switchTab(isHistory){
  historyMode = isHistory;
  render();
}
let pickedWeekOffset = 1; // 默认下周
let newGroup = "pw";      // 新建时选中的作业组
let NEW_WEEK_OPTS = [];

function weekOpts(){
  const arr = [];
  for (let i=0; i<=2; i++) {
    const d = new Date();
    const day = d.getDay()||7;
    d.setDate(d.getDate()-day+1 + i*7); // 周一
    const fmt = x => (x.getMonth()+1)+'/'+x.getDate();
    const mon = new Date(d);
    const sun = new Date(d); sun.setDate(sun.getDate()+6);
    const onejan = new Date(mon.getFullYear(),0,1);
    const wk = Math.ceil((((mon - onejan) / 86400000) + onejan.getDay()+1)/7);
    arr.push({ offset:i, weekNo:wk, start:fmt(mon), end:fmt(sun), mon:mon, sun:sun });
  }
  return arr;
}
function findWeek(weekNo, gid){
  return WEEKS.find(w=>w.weekNo===weekNo && (w.group||"pw")===gid);
}

function newWeek(){
  NEW_WEEK_OPTS = weekOpts();
  // 默认落在第一个「还有组没建」的周
  const firstFree = NEW_WEEK_OPTS.find(o=>GROUPS.some(g=>!findWeek(o.weekNo,g.id))) || NEW_WEEK_OPTS[0];
  pickedWeekOffset = firstFree.offset;
  // 默认组：当前所在组优先；该周该组已建则挑一个未建的组
  newGroup = (!historyMode && WEEK && WEEK.group) ? WEEK.group : "pw";
  if (findWeek(firstFree.weekNo, newGroup)) {
    const free = GROUPS.find(g=>!findWeek(firstFree.weekNo,g.id));
    if (free) newGroup = free.id;
  }
  document.getElementById("newCreator").value = "李志强";
  document.getElementById("newDept").value = DEPT_DEFAULT;
  renderNewSheet();
  document.getElementById("pickWeekMask").classList.add("open");
}
function closePickWeek(){ document.getElementById("pickWeekMask").classList.remove("open"); }
function pickWeekOffset(i){
  pickedWeekOffset = i;
  const opt = NEW_WEEK_OPTS.find(o=>o.offset===i);
  if (opt && findWeek(opt.weekNo, newGroup)) {
    const free = GROUPS.find(g=>!findWeek(opt.weekNo,g.id));
    if (free) newGroup = free.id;
  }
  renderNewSheet();
}
function pickNewGroup(gid){
  const opt = NEW_WEEK_OPTS.find(o=>o.offset===pickedWeekOffset);
  if (opt && findWeek(opt.weekNo, gid)) { toast(`${gNameOf(gid)}的该周计划已存在，不能重复创建`); return; }
  newGroup = gid;
  renderNewSheet();
}
function renderNewSheet(){
  const sel = NEW_WEEK_OPTS.find(o=>o.offset===pickedWeekOffset) || NEW_WEEK_OPTS[0];
  let html = "";
  NEW_WEEK_OPTS.forEach(w => {
    const label = w.offset===0?'本周':w.offset===1?'下周':'下下周';
    const on = pickedWeekOffset===w.offset;
    const full = GROUPS.every(g=>findWeek(w.weekNo,g.id));
    const tags = GROUPS.map(g=>{
      const has = !!findWeek(w.weekNo,g.id);
      return `<span style="font-size:10px;padding:2px 6px;border-radius:8px;${has?'background:#eef4ff;color:#2b7cff;':'background:#f5f5f5;color:#bbb;'}">${g.name}${has?' ✓':''}</span>`;
    }).join(" ");
    html += `<div onclick="pickWeekOffset(${w.offset})" style="padding:12px 14px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:${on?'#eef4ff':'#fff'};">
      <div style="min-width:0;">
        <div style="font-size:15px;font-weight:${on?'600':'400'};${full?'color:#bbb;':''}">第${w.weekNo}周（${label}）${full?' <span style="font-size:11px;color:#bbb;font-weight:400;">已满</span>':''}</div>
        <div style="font-size:12px;color:#888;margin-top:3px;">${w.start} ~ ${w.end}</div>
        <div style="margin-top:6px;display:flex;gap:6px;">${tags}</div>
      </div>
      <span style="width:22px;height:22px;flex:none;border-radius:50%;border:2px solid ${on?'#2b7cff':'#ccc'};background:${on?'#2b7cff':'#fff'};display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;">${on?'✓':''}</span>
    </div>`;
  });
  document.getElementById("pickWeekList").innerHTML = html;

  // 作业组选择
  const gHtml = GROUPS.map(g=>{
    const has = sel ? !!findWeek(sel.weekNo,g.id) : false;
    const on = newGroup===g.id;
    return `<div onclick="pickNewGroup('${g.id}')" style="flex:1;text-align:center;padding:9px 0;border-radius:9px;font-size:13px;
      border:1px solid ${on?'#2b7cff':(has?'#eee':'#ddd')};
      background:${on?'#eef4ff':(has?'#f7f7f7':'#fff')};
      color:${has?'#bbb':(on?'#2b7cff':'#333')};cursor:pointer;">
      ${g.name}${has?'<div style="font-size:10px;margin-top:2px;">已创建</div>':''}
    </div>`;
  }).join("");
  document.getElementById("newGroupRow").innerHTML = gHtml;

  // 按钮与提示
  const dup = sel ? !!findWeek(sel.weekNo, newGroup) : false;
  const btn = document.getElementById("newWeekBtn");
  btn.disabled = dup;
  btn.style.opacity = dup ? .5 : 1;
  btn.textContent = dup ? "该周该组已创建" : "创建周计划";
  const hint = document.getElementById("newWeekHint");
  if (dup) {
    hint.style.display = "block";
    hint.textContent = `第${sel.weekNo}周 · ${gNameOf(newGroup)}已有周计划，请换一周或换组`;
  } else {
    hint.style.display = "none";
  }
}
function confirmPickWeek(){
  const sel = NEW_WEEK_OPTS.find(o=>o.offset===pickedWeekOffset) || NEW_WEEK_OPTS[0];
  const wkNo = sel.weekNo;
  if (findWeek(wkNo, newGroup)) {
    toast(`第${wkNo}周 · ${gNameOf(newGroup)}已存在周计划，不能重复创建`);
    return;
  }
  const mon = sel.mon, sun = sel.sun;
  const fmt = x => (x.getMonth()+1)+'/'+x.getDate();
  const m = mon.getMonth()+1;
  const d0 = mon.getDate();
  const names=["周一","周二","周三","周四","周五","周六","周日"];
  const days = names.map((n,i)=>({ m:m+'/'+(d0+i), name:n, tasks:[] }));
  const creator = (document.getElementById("newCreator").value||"").trim() || "李志强";
  const dept = (document.getElementById("newDept").value||"").trim() || DEPT_DEFAULT;
  WEEKS.unshift({
    weekNo: wkNo, start:fmt(mon), end:fmt(sun), year:2026,
    dept, creator, status:"draft", remark:"", days, group:newGroup
  });
  currentWeekIdx = 0;
  WEEK = WEEKS[0];
  historyMode = false;
  expandedDays = {};
  closePickWeek();
  render();
  toast(`已创建第${wkNo}周 · ${gNameOf(newGroup)}周计划（${fmt(mon)}~${fmt(sun)}）`);
}
function pickWeek(i){
  currentWeekIdx = i;
  WEEK = WEEKS[i];
  expandedDays = {};
}
function delWeek(i){
  if (!confirm("确定删除这一整周计划？不可恢复")) return;
  WEEKS.splice(i,1);
  if (currentWeekIdx >= WEEKS.length) currentWeekIdx = WEEKS.length-1;
  WEEK = WEEKS[currentWeekIdx];
  render();
  toast("周计划已删除");
}
function viewWeek(i){
  pickWeek(i);
  switchTab(false);
}
function editWeek(i){
  const w = WEEKS[i];
  if (w.status === 'published') { toast("已发布的周计划，需先撤回后才能修改"); return; }
  pickWeek(i);
  switchTab(false);
  if (w.status === 'review') toast("待审核的周计划，可先撤回再改");
}

function renderTaskHistory(){
  const el = document.getElementById("taskHistory");
  if (!el) return;
  el.innerHTML = TASK_HISTORY.map(t=>`<span onclick="document.getElementById('fTask').value='${t}'" style="font-size:12px;background:#eef4ff;color:#2b7cff;padding:4px 10px;border-radius:12px;cursor:pointer;">${t}</span>`).join("");
}
let pendingTasks = [];   // 本页同一项目下已添加、待保存的任务

function renderPending(){
  const box = document.getElementById("pendingBox");
  const list = document.getElementById("pendingList");
  const cnt = document.getElementById("pendingCount");
  if (!pendingTasks.length) { box.style.display = "none"; list.innerHTML = ""; cnt.textContent = "0"; return; }
  box.style.display = "block";
  cnt.textContent = pendingTasks.length;
  list.innerHTML = pendingTasks.map((t,i)=>`<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;background:#f8fafc;border:1px solid #eef2f7;border-radius:9px;padding:8px 10px;margin-bottom:6px;">
    <div style="min-width:0;">
      <div style="font-size:13px;color:#222;font-weight:600;">${i+1}. ${t.task} <span class="risk-badge r-${t.risk}">风险${t.risk}</span></div>
      <div style="font-size:11px;color:#888;margin-top:3px;">${t.leader||'待选负责人'} · 技工${t.labor} / 副工${t.tech}${t.car&&t.car!=='未派车'?' · '+t.car:''}</div>
    </div>
    <span onclick="delPending(${i})" style="flex:none;color:#ef4444;font-size:12px;cursor:pointer;padding:2px 4px;">删除</span>
  </div>`).join("");
}
function delPending(i){
  pendingTasks.splice(i,1);
  renderPending();
}
function clearTaskForm(keepProj){
  document.getElementById("fTask").value = "";
  document.getElementById("fNote").value = "";
  document.getElementById("fLeader").value = "";
  document.getElementById("fLabor").value = 0;
  document.getElementById("fTech").value = 0;
  document.getElementById("fCar").value = "";
  document.getElementById("fMachine").value = "";
  if (!keepProj) document.getElementById("fProj").value = "";
  document.querySelectorAll("#fRisk .risk-opt").forEach(o => o.classList.toggle("on", o.dataset.v==="I"));
  renderTaskHistory();
}
function readTaskForm(){
  return {
    proj: document.getElementById("fProj").value,
    task: (document.getElementById("fTask").value||"").trim(),
    note: document.getElementById("fNote").value,
    leader: document.getElementById("fLeader").value,
    labor: parseInt(document.getElementById("fLabor").value)||0,
    tech: parseInt(document.getElementById("fTech").value)||0,
    car: document.getElementById("fCar").value || "未派车",
    machine: document.getElementById("fMachine").value || "无",
    risk: document.querySelector("#fRisk .risk-opt.on").dataset.v
  };
}
function addPendingTask(){
  const t = readTaskForm();
  if (!t.proj) { toast("请先选择项目"); return; }
  if (!t.task) { toast("请填写作业内容"); return; }
  pendingTasks.push(t);
  renderPending();
  clearTaskForm(true);           // 保留项目，清空任务字段，继续填下一条
  toast(`已加入第${pendingTasks.length}条，项目已锁定`);
}
function addTask(dayIdx){
  editingCtx = { dayIdx, taskIdx:null };
  pendingTasks = [];
  document.getElementById("taskSheetTitle").textContent = "添加任务";
  clearTaskForm(false);
  renderPending();
  document.getElementById("addMoreBtn").style.display = "";
  document.getElementById("saveTaskBtn").style.flex = "1.2";
  document.getElementById("saveTaskBtn").textContent = "保存任务";
  openSheet("taskMask");
}
function editTask(dayIdx, taskIdx){
  editingCtx = { dayIdx, taskIdx };
  pendingTasks = [];
  const t = WEEK.days[dayIdx].tasks[taskIdx];
  document.getElementById("taskSheetTitle").textContent = "编辑任务";
  document.getElementById("fProj").value = t.proj;
  document.getElementById("fTask").value = t.task;
  document.getElementById("fNote").value = t.note||"";
  document.getElementById("fLeader").value = t.leader||"";
  document.getElementById("fLabor").value = t.labor;
  document.getElementById("fTech").value = t.tech;
  document.getElementById("fCar").value = t.car==='未派车'?'':t.car;
  document.getElementById("fMachine").value = t.machine==='无'?'':t.machine;
  document.querySelectorAll("#fRisk .risk-opt").forEach(o => o.classList.toggle("on", o.dataset.v===t.risk));
  renderPending();
  // 单条编辑不显示「再加一条」
  document.getElementById("addMoreBtn").style.display = "none";
  document.getElementById("saveTaskBtn").style.flex = "1";
  document.getElementById("saveTaskBtn").textContent = "保存修改";
  renderTaskHistory();
  openSheet("taskMask");
}
function delTask(dayIdx, taskIdx){
  if (!confirm("确定删除？")) return;
  WEEK.days[dayIdx].tasks.splice(taskIdx,1);
  render();
  toast("已删除");
}
function saveTask(){
  const t = readTaskForm();
  if (!t.proj) { toast("请先选择项目"); return; }
  // 编辑单条
  if (editingCtx.taskIdx !== null && editingCtx.taskIdx !== undefined) {
    if (!t.task) { toast("请填写作业内容"); return; }
    WEEK.days[editingCtx.dayIdx].tasks[editingCtx.taskIdx] = t;
    closeTaskSheet(); render(); toast("已保存修改");
    return;
  }
  // 新增：本页累积的多条 + 当前表单里未提交的一条
  const batch = pendingTasks.slice();
  if (t.task) batch.push(t);
  if (!batch.length) { toast("请至少填写 1 条作业内容"); return; }
  batch.forEach(x=>{
    if (!TASK_HISTORY.includes(x.task)) TASK_HISTORY.unshift(x.task);
  });
  TASK_HISTORY.length = Math.min(TASK_HISTORY.length, 10);
  WEEK.days[editingCtx.dayIdx].tasks.push(...batch);
  pendingTasks = [];
  closeTaskSheet();
  render();
  toast(`已保存 ${batch.length} 条任务`);
}
function closeTaskSheet(){ closeSheet("taskMask"); }
function submitReview(){
  WEEK.status = "review";
  render();
  toast("已提交分公司经理审核");
}

function openSheet(id){ document.getElementById(id).classList.add("open"); }
function closeSheet(id){ document.getElementById(id).classList.remove("open"); }

// 风险选择
document.querySelectorAll("#fRisk .risk-opt").forEach(o => {
  o.addEventListener("click", () => {
    document.querySelectorAll("#fRisk .risk-opt").forEach(x=>x.classList.remove("on"));
    o.classList.add("on");
  });
});

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

// 项目选择
function openProjPicker(){
  document.getElementById("projSearch").value = "";
  renderProjList();
  document.getElementById("projMask").classList.add("open");
}
function closeProjPicker(){ document.getElementById("projMask").classList.remove("open"); }
function renderProjList(){
  const kw = document.getElementById("projSearch").value.trim();
  const up = kw.toUpperCase();
  const list = PROJ_LIB.filter(p => !kw || p.name.includes(kw) || p.code.includes(up));
  let html = "";
  list.forEach(p => {
    html += `<div onclick="pickProj('${p.name}')" style="padding:11px 0;border-bottom:1px solid #f0f0f0;cursor:pointer;">
      <div style="font-size:15px;color:#222;line-height:1.4;">${p.name}</div>
      <div style="font-size:11px;color:#a7b0bd;margin-top:3px;">${p.code}</div>
    </div>`;
  });
  if (!list.length) html = `<div style="padding:30px;text-align:center;color:#999;font-size:13px;">无匹配项目<br><span style="font-size:11px;">可搜项目名称或编号</span></div>`;
  document.getElementById("projList").innerHTML = html;
}
function pickProj(p){
  document.getElementById("fProj").value = p;
  closeProjPicker();
}

// 分享到群（仅已发布的周计划）

  { name:"郴江电力·现场管理群", num:86 },

// 选人
let workerFilter = "all";
function openWorkerPicker(){
  document.getElementById("workerSearch").value = "";
  workerFilter = "all";
  document.querySelectorAll("#workerTabs .pw-tab").forEach((o, k) => {
    if (k === 0) o.classList.add("on"); else o.classList.remove("on");
  });
  renderWorkerList();
  document.getElementById("workerMask").classList.add("open");
}
function setWorkerFilter(el){
  document.querySelectorAll("#workerTabs .pw-tab").forEach(o => o.classList.remove("on"));
  el.classList.add("on");
  workerFilter = el.dataset.f;
  renderWorkerList();
}
function renderWorkerList(){
  const kw = (document.getElementById("workerSearch").value || "").trim();
  const cur = document.getElementById("fLeader").value;
  const list = WORKERS.filter(w => {
    if (workerFilter === "self" && w.type !== "自有") return false;
    if (workerFilter === "out" && w.type !== "外包") return false;
    if (workerFilter === "tech" && w.role !== "技工") return false;
    if (workerFilter === "help" && w.role !== "副工") return false;
    if (workerFilter === "grid" && !w.grid) return false;
    if (kw && !w.name.includes(kw) && !w.role.includes(kw) && !w.type.includes(kw) && !(w.grid && "国网准入".includes(kw))) return false;
    return true;
  });
  let html = "";
  list.forEach(w => {
    const bad = w.ins === "bad";
    const srcTag = w.type === "自有" ? `<span class="pw-tag-self">自有</span>` : `<span class="pw-tag-out">外包</span>`;
    const gridTag = w.grid
      ? `<span class="pw-tag-grid">国网准入</span>`
      : `<span class="pw-tag-nogrid">未准入</span>`;
    const on = cur === w.name;
    html += `<div class="pw-row ${bad ? "disabled" : ""}" data-name="${w.name}">
      <div class="pw-avatar">${w.name[0]}</div>
      <div class="pw-info">
        <div class="pw-name">${w.name}${srcTag}${gridTag}</div>
        <div class="pw-sub">${w.role} · <span class="pw-ins ${w.ins}">${w.insText}</span></div>
      </div>
      <div class="pw-check ${on ? "on" : ""}">${on ? "✓" : ""}</div>
    </div>`;
  });
  if (!list.length) html = `<div style="padding:30px;text-align:center;color:#999;font-size:13px;">没有匹配的人员</div>`;
  const box = document.getElementById("workerList");
  box.innerHTML = html;
  box.querySelectorAll(".pw-row").forEach(row => {
    row.addEventListener("click", () => {
      if (row.classList.contains("disabled")) return toast("该人员保险已过期，不能安排");
      pickWorker(row.dataset.name);
    });
  });
}
function closeWorkerPicker(){ document.getElementById("workerMask").classList.remove("open"); }
function pickWorker(name){
  document.getElementById("fLeader").value = name;
  closeWorkerPicker();
}
// 选车（多选）
let carTemp = [];
function openCarPicker(){
  const cur = document.getElementById("fCar").value;
  carTemp = cur ? cur.split("、") : [];
  document.getElementById("carSearch").value = "";
  renderCarList();
  document.getElementById("carMask").classList.add("open");
}
function renderCarList(){
  const kw = document.getElementById("carSearch").value.trim();
  const list = CARS.filter(c=>!kw || c.plate.includes(kw) || c.type.includes(kw));
  let html = "";
  list.forEach(c => {
    const on = carTemp.includes(c.plate);
    html += `<div onclick="toggleCar('${c.plate}')" style="padding:12px 0;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:10px;cursor:pointer;">
      <div style="flex:1;">
        <div style="font-size:15px;font-weight:600;color:#222;">${c.plate}</div>
        <div style="font-size:11px;color:#888;">${c.type}</div>
      </div>
      <span style="width:22px;height:22px;border-radius:50%;border:2px solid ${on?'#2b7cff':'#ccc'};background:${on?'#2b7cff':'#fff'};display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;">${on?'✓':''}</span>
    </div>`;
  });
  if (!list.length) html = `<div style="padding:30px;text-align:center;color:#999;font-size:13px;">无匹配车辆</div>`;
  document.getElementById("carList").innerHTML = html;
}
function closeCarPicker(){
  document.getElementById("carMask").classList.remove("open");
  // 关闭不保存
  carTemp = document.getElementById("fCar").value ? document.getElementById("fCar").value.split("、") : [];
}
function confirmCarPicker(){
  document.getElementById("fCar").value = carTemp.join("、");
  document.getElementById("carMask").classList.remove("open");
}
function toggleCar(plate){
  const i = carTemp.indexOf(plate);
  if (i>=0) carTemp.splice(i,1); else carTemp.push(plate);
  renderCarList();
}
// 选择机械（六类，可多选 + 数量）
const MACHINE_TYPES = ["挖机", "炮机", "吊车", "随车吊", "渣土车", "铲车"];
const MACHINE_HINTS = {
  "挖机": "土方开挖、基坑",
  "炮机": "破除混凝土 / 岩石",
  "吊车": "立杆、吊装",
  "随车吊": "运输 + 吊装",
  "渣土车": "土方外运",
  "铲车": "场地平整、装料"
};
let machQty = {};
let machOther = [];
function parseMachineText(str){
  machQty = {};
  MACHINE_TYPES.forEach(n => machQty[n] = 0);
  machOther = [];
  if (!str || str === "无") return;
  String(str).split(/[、,，]/).forEach(seg => {
    seg = seg.trim();
    if (!seg) return;
    const type = MACHINE_TYPES.find(n => seg.indexOf(n) >= 0);
    const num = seg.match(/([0-9]+)/);
    const q = num ? parseInt(num[1], 10) : 1;
    if (type) machQty[type] += (q > 0 ? q : 1);
    else machOther.push(seg);
  });
}
function openMachinePicker(){
  parseMachineText(document.getElementById("fMachine").value);
  renderMachineList();
  document.getElementById("machineMask").classList.add("open");
}
function closeMachinePicker(){
  document.getElementById("machineMask").classList.remove("open");
}
function stepMachineQty(i, d){
  const n = MACHINE_TYPES[i];
  machQty[n] = Math.max(0, Math.min(20, (machQty[n] || 0) + d));
  renderMachineList();
}
function removeMachOther(i){
  machOther.splice(i, 1);
  renderMachineList();
}
function renderMachineList(){
  const el = document.getElementById("machineList");
  let html = MACHINE_TYPES.map((n, i) => {
    const q = machQty[n] || 0;
    const on = q > 0;
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;margin-bottom:6px;border-radius:10px;background:${on ? "#eef4ff" : "#f8f9fb"};border:1px solid ${on ? "#c8ddff" : "#eceff3"};">
      <div style="min-width:0;">
        <div style="font-size:15px;font-weight:600;color:#222;">${n}</div>
        <div style="font-size:11px;color:#999;margin-top:2px;">${MACHINE_HINTS[n] || ""}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex:none;">
        <div onclick="stepMachineQty(${i},-1)" style="width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid ${on ? "#c8ddff" : "#e5e7eb"};display:flex;align-items:center;justify-content:center;font-size:18px;color:${on ? "#2b7cff" : "#bbb"};cursor:pointer;">－</div>
        <div style="min-width:26px;text-align:center;font-size:17px;font-weight:600;color:${on ? "#2b7cff" : "#999"};">${q}</div>
        <div onclick="stepMachineQty(${i},1)" style="width:40px;height:40px;border-radius:50%;background:#2b7cff;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;cursor:pointer;">＋</div>
      </div>
    </div>`;
  }).join("");
  if (machOther.length) {
    html += `<div style="margin-top:6px;font-size:11px;color:#999;">其他设备（保留）</div>`;
    html += machOther.map((s, i) => `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;margin-top:4px;border-radius:8px;background:#f8f9fb;font-size:13px;color:#666;">
      <span>${s}</span>
      <span onclick="removeMachOther(${i})" style="color:#ef4444;font-size:12px;cursor:pointer;padding:0 4px;">删除</span>
    </div>`).join("");
  }
  el.innerHTML = html;
  const total = MACHINE_TYPES.reduce((a, n) => a + (machQty[n] || 0), 0);
  const txt = MACHINE_TYPES.filter(n => machQty[n] > 0).map(n => n + machQty[n] + "台").join("、");
  document.getElementById("machineSum").textContent = total ? `已选 ${total} 台：${txt}` : "还没有选择机械";
}
function confirmMachinePicker(){
  const picked = MACHINE_TYPES.filter(n => machQty[n] > 0).map(n => n + machQty[n] + "台");
  document.getElementById("fMachine").value = picked.concat(machOther).join("、");
  document.getElementById("machineMask").classList.remove("open");
}

// 原型直达： #new 打开新建 / #pw #yx 直达对应组当前周 / #list 列表
(function(){
  const h = (location.hash||"").replace("#","");
  if (h === "new") { newWeek(); return; }
  if (h === "workers") {    currentWeekIdx = 0; WEEK = WEEKS[0]; historyMode = false; render();
    addTask(0); document.getElementById("fLeader").value = ""; openWorkerPicker();
    return;
  }
  if (h === "multi") {
    currentWeekIdx = 0; WEEK = WEEKS[0]; historyMode = false; render();
    addTask(0);
    document.getElementById("fProj").value = "园垄线10kV改造工程";
    pendingTasks = [
      {proj:"园垄线10kV改造工程",task:"放线",risk:"III",note:"验电接地",leader:"黄志远",labor:3,tech:2,car:"湘L·D1234",machine:"无"},
      {proj:"园垄线10kV改造工程",task:"顶管",risk:"II",note:"",leader:"陈立军",labor:2,tech:1,car:"湘L·D1234",machine:"无"}
    ];
    renderPending();
    return;
  }
  const g = h;
  if (g === "pw" || g === "yx") {
    const i = WEEKS.findIndex(w=>w.group===g && w.status!=="published");
    if (i >= 0) { currentWeekIdx = i; WEEK = WEEKS[i]; historyMode = false; }
  }
  render();
})();
</script>
