<style>

  .f-area::placeholder { color:#b6bfcc; }

  .add-photo { border:1px dashed #ccd3dc; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#2b7cff; cursor:pointer; font-size:22px; font-weight:300; background:#fbfcfd; height:74px; }

  /* 完成产值 */

  .out-qin { width:58px; flex:0 0 58px; height:30px; border:1px solid #e5e7eb; border-radius:8px; text-align:center; font-size:13px; color:#222; outline:none; background:#fbfcfe; font-family:inherit; }
  .out-amt { margin-left:auto; flex:0 0 auto; white-space:nowrap; font-size:13px; color:#e5342b; font-weight:700; }
  .out-del { color:#b6bfcc; font-size:11px; margin-left:4px; flex:0 0 auto; white-space:nowrap; cursor:pointer; }
  .out-sum { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; font-size:13px; color:#66707c; background:#fbfcfe; }
  .out-sum b { color:#e5342b; font-size:16px; }
  .add-row { margin:10px 12px; padding:12px; text-align:center; font-size:13px; color:#2b7cff; border:1px dashed #c8ddff; border-radius:10px; cursor:pointer; background:#fff; }
  .submit-bar { padding:16px 12px 6px; }
  .btn-main { width:100%; height:46px; border:0; border-radius:23px; background:#2b7cff; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  .btn-ghost-wide { width:100%; height:46px; border:1px solid #2b7cff; border-radius:23px; background:#fff; color:#2b7cff; font-size:15px; font-weight:600; cursor:pointer; }

  /* 列表 */

  .chips { display:flex; gap:8px; margin-top:10px; overflow-x:auto; padding-bottom:2px; }

  .r-top { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }

  .r-proj { font-size:13px; color:#66707c; margin-top:9px; }

  .r-issue { font-size:12px; color:#c2410c; background:#fff7ef; border-radius:8px; padding:6px 8px; margin-top:8px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .r-foot { display:flex; justify-content:space-between; align-items:center; margin-top:9px; font-size:11px; color:#a7b0bd; }
  .r-foot b { color:#e5342b; font-weight:700; font-size:12px; }
  .empty { margin:44px 12px; text-align:center; font-size:13px; color:#a7b0bd; line-height:1.9; }

  /* 弹层 */
  .mask { position:absolute; inset:0; background:rgba(0,0,0,.45); z-index:50; display:none; align-items:flex-end; }
  .mask.open { display:flex; }
  .sheet { background:#fff; width:100%; max-height:86%; border-radius:16px 16px 0 0; display:flex; flex-direction:column; }
  .sheet-head { padding:14px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #f0f0f0; flex-shrink:0; }
  .sheet-title { font-size:16px; font-weight:600; color:#222; }
  .sheet-close { color:#888; font-size:14px; cursor:pointer; }
  .sheet-body { flex:1; min-height:0; overflow-y:auto; padding:12px 16px 16px; }
  .sheet-foot { flex-shrink:0; padding:12px 16px; border-top:1px solid #f0f0f0; display:flex; gap:10px; }
  .btn-primary { flex:1; height:46px; border:none; border-radius:10px; background:#2b7cff; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  .btn-secondary { flex:1; height:46px; border:1px solid #2b7cff; border-radius:10px; background:#fff; color:#2b7cff; font-size:15px; font-weight:600; cursor:pointer; }
  .btn-danger { flex:1; height:46px; border:1px solid #fca5a5; border-radius:10px; background:#fff; color:#dc2626; font-size:15px; font-weight:600; cursor:pointer; }

  .pk-item { display:flex; align-items:flex-start; padding:12px 4px; border-bottom:1px solid #f4f5f7; font-size:14px; color:#222; cursor:pointer; }
  .pk-item.on { color:#2b7cff; font-weight:600; }
  .pk-main { flex:1; min-width:0; }
  .pk-sub { font-size:11px; color:#98a2b3; margin-top:4px; line-height:1.5; }
  .pk-ck { flex:none; margin-left:8px; color:#2b7cff; font-size:13px; align-self:center; }
  .pk-search { padding:10px 0 8px; }
  .pk-search input { width:100%; height:34px; border:1px solid #e5e7eb; border-radius:17px; padding:0 12px; font-size:13px; outline:none; background:#f7f9fc; font-family:inherit; }
  /* 选择工程量（与日完工一致） */
  .qty-search-wrap { padding:10px 14px 8px; }
  .qty-search { width:100%; height:34px; border:1px solid #dbe1ea; border-radius:8px; padding:0 12px; font-size:13px; outline:none; box-sizing:border-box; background:#f8fafc; font-family:inherit; }
  .qty-item { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid #f1f3f7; }
  .qty-l { flex:1; min-width:0; }
  .qty-nm { font-size:13px; color:#3a3f47; line-height:1.45; word-break:break-word; }
  .qty-sub { font-size:11px; color:#98a2b3; margin-top:3px; }
  .qty-r { flex:none; width:104px; text-align:right; }
  .qty-in { width:100%; height:32px; border:1px solid #dbe1ea; border-radius:8px; text-align:center; font-size:13px; color:#3a3f47; outline:none; box-sizing:border-box; font-family:inherit; }
  .qty-amt { font-size:12px; color:#e5342b; font-weight:600; margin-top:4px; }
  .qty-hl { color:#e5342b; font-weight:700; }
  .qty-done { color:#16a34a; font-weight:700; }
  .ov-empty { font-size:13px; color:#98a2b3; text-align:center; line-height:1.8; }

  /* 详情 */
  .d-row { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid #f4f5f7; font-size:13px; }
  .d-row:last-child { border-bottom:0; }
  .d-row .k { flex:none; width:74px; color:#98a2b3; }
  .d-row .v { flex:1; min-width:0; color:#333; line-height:1.6; word-break:break-word; }
  .d-sec { font-size:12px; font-weight:600; color:#98a2b3; margin:16px 0 4px; }
  .d-sec:first-child { margin-top:0; }
  .reply-box { background:#f8fbf9; border:1px solid #d9ecdf; border-radius:10px; padding:10px 12px; font-size:13px; color:#3a4a3f; line-height:1.6; }
  .issue-box2 { background:#fff7ef; border:1px solid #ffe0bf; border-radius:10px; padding:10px 12px; font-size:13px; color:#8a4b12; line-height:1.6; }
  .wait-box { background:#f8fafc; border:1px solid #eef1f5; border-radius:10px; padding:10px 12px; font-size:12px; color:#98a2b3; line-height:1.6; }
  .d-out-row { display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid #f4f5f7; font-size:12px; color:#66707c; }
  .d-out-row .nm { flex:1; min-width:0; color:#3a3f47; line-height:1.5; }
  .d-out-row .amt { flex:none; color:#e5342b; font-weight:700; }
  .d-photo { padding:10px 0 12px; border-bottom:1px solid #f4f5f7; }
  .d-photo-t { font-size:13px; color:#98a2b3; margin-bottom:8px; display:flex; justify-content:space-between; align-items:baseline; }
  .d-photo-t .c { font-size:11px; color:#a7b0bd; font-weight:400; }

  #toast { position:absolute; left:50%; bottom:96px; transform:translateX(-50%) translateY(8px); background:rgba(30,34,40,.92); color:#fff; font-size:12px; padding:8px 14px; border-radius:16px; opacity:0; transition:.22s; pointer-events:none; z-index:90; max-width:300px; text-align:center; line-height:1.5; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="right">信号 Wi-Fi 100%</span></div>

  <div class="navbar">
    <div class="back" onclick="goBack()">‹ 现场管理</div>
    <div class="title">分包日报</div>
    <div class="right" id="navRight"></div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="pane hide" id="paneForm"></div>
  <div class="pane" id="paneList"></div>
  <div class="pane hide" id="paneMine"></div>

  <!-- 详情 -->
  <div class="mask" id="detailMask">
    <div class="sheet">
      <div class="sheet-head"><div class="sheet-title">日报详情</div><div class="sheet-close" onclick="closeMask('detailMask')">关闭</div></div>
      <div class="sheet-body" id="detailBody"></div>
      <div class="sheet-foot" id="detailFoot"></div>
    </div>
  </div>

  <!-- 项目选择 -->
  <div class="mask" id="projMask">
    <div class="sheet">
      <div class="sheet-head"><div class="sheet-title">选择项目</div><div class="sheet-close" onclick="closeMask('projMask')">关闭</div></div>
      <div class="sheet-body">
        <div class="pk-search"><input id="projKw" placeholder="搜索项目名称 / 项目经理" oninput="renderProjList()"></div>
        <div id="projList"></div>
      </div>
    </div>
  </div>

  <!-- 工程量选择 -->
  <div class="mask" id="qtyMask">
    <div class="sheet" style="max-height:80%;">
      <div class="sheet-head"><div class="sheet-title" id="qtyTitle">选择工程量</div><div class="sheet-close" onclick="closeQtyPick()">关闭</div></div>
      <div class="sheet-body" id="qtyList"></div>
      <div class="sheet-foot">
        <button class="btn-secondary" onclick="closeQtyPick()">取消</button>
        <button class="btn-primary" onclick="confirmQtyPick()">确定</button>
      </div>
    </div>
  </div>

  <!-- 确认 / 删除 -->
  <div class="mask" id="cfmMask">
    <div class="sheet" style="max-height:60%;">
      <div class="sheet-head"><div class="sheet-title" id="cfmTitle">提示</div><div class="sheet-close" onclick="closeMask('cfmMask')">关闭</div></div>
      <div class="sheet-body"><div style="font-size:13px; color:#4a5159; line-height:1.75;" id="cfmDesc"></div></div>
      <div class="sheet-foot">
        <button class="btn-secondary" onclick="closeMask('cfmMask')">取消</button>
        <button class="btn-primary" id="cfmOk">确定</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</div>
<script>
// ========== 基础 ==========
const ME = "黄志远";
const MY_DEPT = "工程部";
const WEATHERS = ["晴", "多云", "阴", "小雨", "中雨", "大雨", "暴雨", "高温", "大风"];

const PROJECTS = [
  { code: "xm1", name: "园垄线10kV线路改造工程", manager: "李志强" },
  { code: "xm2", name: "珠东线配电自动化改造", manager: "周国华" },
  { code: "xm3", name: "高速杆迁瓦窑坪支线工程", manager: "陈立军" },
  { code: "xm4", name: "嘉禾县农网巩固提升工程", manager: "刘建国" },
  { code: "xm5", name: "苏仙区小区供配电改造工程", manager: "张强" }
];

// 项目立项工程量清单（名称 / 单位 / 合同量 / 单价）
const BOQ = [
  { qid: "Q1-01", projectCode: "xm1", name: "(调)新建HA-2 6间隔环网箱基础(5.7×1.6×1.5) 侧壁厚(m):0.25", unit: "座", totalQty: 10, price: 30000 },
  { qid: "Q1-02", projectCode: "xm1", name: "(调)直线井砖砌 1.8×1.8×1.98 全开启", unit: "座", totalQty: 10, price: 23000 },
  { qid: "Q1-03", projectCode: "xm1", name: "10kV 线路架设（含金具安装）", unit: "km", totalQty: 3, price: 86000 },
  { qid: "Q2-01", projectCode: "xm2", name: "配电自动化终端安装调试", unit: "台", totalQty: 12, price: 9800 },
  { qid: "Q2-02", projectCode: "xm2", name: "顶管施工（DN200）", unit: "米", totalQty: 200, price: 120 },
  { qid: "Q3-01", projectCode: "xm3", name: "基础开挖及回填", unit: "方", totalQty: 300, price: 60 },
  { qid: "Q3-02", projectCode: "xm3", name: "杆塔组立", unit: "基", totalQty: 8, price: 42000 },
  { qid: "Q4-01", projectCode: "xm4", name: "10kV 线路改造（含立杆）", unit: "km", totalQty: 5, price: 78000 },
  { qid: "Q4-02", projectCode: "xm4", name: "配变安装（400kVA）", unit: "台", totalQty: 6, price: 32000 },
  { qid: "Q5-01", projectCode: "xm5", name: "小区配电房改造", unit: "座", totalQty: 4, price: 56000 },
  { qid: "Q5-02", projectCode: "xm5", name: "电缆敷设（YJV22-4×95）", unit: "米", totalQty: 1200, price: 85 }
];

function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 1900);
}
function goBack() { location.href = "../site.html"; }
function closeMask(id) { document.getElementById(id).classList.remove("open"); }

// ========== Tab & 主渲染 ==========
function switchTab(t) {
  if (curTab === "form" && t !== "form") {
    syncFormInputs();
    if (editingId !== null) {
      editingId = null;
      form = { date: todayStr(), weather: "", proj: "", work: "", issue: "", photos: 0, outputs: [] };
    }
  }
  curTab = t;
  document.getElementById("paneForm").className = "pane" + (t === "form" ? "" : " hide");
  document.getElementById("paneList").className = "pane hide";
  document.getElementById("paneMine").className = "pane" + (t === "mine" ? "" : " hide");
  render();
}
function render() {
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = `
    <div class="tab ${curTab === "form" ? "on" : ""}" onclick="switchTab('form')">创建日报</div>
    <div class="tab ${curTab === "mine" ? "on" : ""}" onclick="switchTab('mine')">我的日报</div>`;
  tabsEl.style.display = "flex";
  const nr = document.getElementById("navRight");
  nr.textContent = "";
  nr.onclick = null;
  if (curTab === "form") renderForm();
  else renderMine();
}
function openForm() {
  editingId = null;
  form = { date: todayStr(), weather: "", proj: "", work: "", issue: "", photos: 0, outputs: [] };
  switchTab("form");
}

// ========== 列表 ==========
function matchKw(r) {
  const el = document.getElementById("kw");
  const kw = (el ? el.value : "").trim().toLowerCase();
  if (!kw) return true;
  return (r.work + " " + projName(r.proj) + " " + (r.issue || "") + " " + (r.reporter || "") + " " + r.no).toLowerCase().indexOf(kw) >= 0;
}
function filterRows() {

function todayStr() { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function shiftDate(n) { const d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function shortDate(s) { if (!s) return "—"; const p = s.split("-"); return (+p[1]) + "/" + (+p[2]); }
function weekTxt(s) { const d = new Date(s.replace(/-/g, "/")); return "周" + "日一二三四五六"[d.getDay()]; }
function dateBadge(s) { return shortDate(s) + " " + weekTxt(s); }
function nowText() { const d = new Date(); return todayStr() + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
function money(n) { return "¥" + Math.round(n || 0).toLocaleString("en-US"); }
function moneyNoSign(n) { return Math.round(n || 0).toLocaleString("en-US"); }
function projOf(code) { return PROJECTS.find(p => p.code === code); }
function projName(code) { const p = projOf(code); return p ? p.name : "—"; }
function boqOf(code) { return BOQ.filter(b => b.projectCode === code); }
function outTotal(list) { return (list || []).reduce((s, o) => s + (o.price || 0) * (o.qty || 0), 0); }
function thisWeekRange() {
  const d = new Date(); const w = (d.getDay() + 6) % 7;  // 周一=0
  const start = new Date(d); start.setDate(d.getDate() - w);
  const end = new Date(start); end.setDate(start.getDate() + 6);
  const f = x => x.getFullYear() + "-" + pad2(x.getMonth() + 1) + "-" + pad2(x.getDate());
  return [f(start), f(end)];
}

function qtyCalc(qid, val) {
  const b = BOQ.find(x => x.qid === qid);
  if (!b) return;
  const v = parseFloat(String(val).replace(/[^\d.]/g, ""));
  const el = document.getElementById("qamt_" + qid);
  if (isNaN(v) || v <= 0) {
    delete qtyDraft[qid];
    if (el) el.textContent = "0";
    return;
  }
  qtyDraft[qid] = v;
  if (el) el.textContent = moneyNoSign(v * b.price);
}

  const ids = Object.keys(qtyDraft);

  for (let i = 0; i < ids.length; i++) {
    const b = BOQ.find(x => x.qid === ids[i]);
    if (!b) continue;
    const ex = (form.outputs || []).find(o => o.qid === ids[i]);
    const cur = ex ? (ex.qty || 0) : 0;
    if (cur + qtyDraft[ids[i]] > b.totalQty) {
      toast(b.name.substring(0, 10) + "…累计超过合同量 " + b.totalQty + " " + b.unit);
      return;
    }
  }
  ids.forEach(qid => {
    const b = BOQ.find(x => x.qid === qid);
    if (!b) return;
    const ex = (form.outputs || []).find(o => o.qid === qid);
    if (ex) ex.qty = Math.round((ex.qty + qtyDraft[qid]) * 1000) / 1000;
    else form.outputs.push({ qid: b.qid, name: b.name, unit: b.unit, price: b.price, qty: qtyDraft[qid] });
  });
  closeQtyPick();
  renderForm();
  toast("已录入本次工程量");
}

// ========== 项目选择 ==========
function openProjPick() {
  syncFormInputs();
  document.getElementById("projKw").value = "";
  renderProjList();
  document.getElementById("projMask").classList.add("open");
}
function renderProjList() {
  const kw = (document.getElementById("projKw").value || "").trim().toLowerCase();
  const rows = PROJECTS.filter(p => !kw || (p.name + " " + p.manager).toLowerCase().indexOf(kw) >= 0);
  document.getElementById("projList").innerHTML = rows.length ? rows.map(p => `
    <div class="pk-item ${form.proj === p.code ? "on" : ""}" data-code="${p.code}" onclick="pickProj(this.dataset.code)">
      <div class="pk-main">
        ${p.name}
        <div class="pk-sub">项目经理 ${p.manager}</div>
      </div>
      ${form.proj === p.code ? `<span class="pk-ck">已选</span>` : ""}
    </div>`).join("") : `<div class="empty" style="margin:24px 0;">没有匹配的项目</div>`;
}
function pickProj(code) {
  syncFormInputs();
  if (form.proj !== code) { form.outputs = []; form.photos = form.photos; }
  form.proj = code;
  closeMask("projMask");
  renderForm();
  if (form.outputs.length === 0) toast("项目已切换，工程量需重新选择");
}

// ========== 提交 / 编辑 / 删除 ==========
function makeNo(date, extra) {
  const ymd = date.replace(/-/g, "");
  const n = RECORDS.filter(r => r.no.indexOf("RB-" + ymd) === 0).length + 1 + (extra || 0);
  return "RB-" + ymd + "-" + String(n).padStart(3, "0");
}
function submitForm() {
  syncFormInputs();
  if (!form.date) { toast("请选择填报日期"); return; }
  if (!form.proj) { toast("请选择所属项目"); return; }
  if (!(form.work || "").trim()) { toast("请填写施工内容"); return; }
  const dup = RECORDS.find(r => r.date === form.date && r.proj === form.proj && r.id !== editingId);
  if (dup) { toast("该项目当天已有日报 " + dup.no + "，请直接编辑该条"); return; }
  const status = form.weather ? "submitted" : "draft";
  const outputs = form.outputs.map(o => ({ qid: o.qid, name: o.name, unit: o.unit, price: o.price, qty: o.qty }));

  if (editingId === null) {
    const id = RECORDS.reduce((m, r) => Math.max(m, r.id), 0) + 1;
    RECORDS.unshift({
      id: id, no: makeNo(form.date), date: form.date, weather: form.weather, reporter: ME, dept: MY_DEPT,
      proj: form.proj, photos: form.photos, status: status, source: "manual", createdAt: nowText(),
      work: form.work.trim(), issue: (form.issue || "").trim(), outputs: outputs
    });
    toast(status === "draft" ? "已保存为「待完善」草稿" : "日报已提交");
  } else {
    const r = RECORDS.find(x => x.id === editingId);
    r.date = form.date; r.weather = form.weather; r.proj = form.proj; r.photos = form.photos;
    r.status = status; r.work = form.work.trim(); r.issue = (form.issue || "").trim(); r.outputs = outputs;
    toast("日报已更新");
  }
  editingId = null;
  form = { date: todayStr(), weather: "", proj: "", work: "", issue: "", photos: 0, outputs: [] };
  switchTab("mine");
}
function editRecord(id) {
  const r = RECORDS.find(x => x.id === id);
  if (!r) return;
  editingId = id;
  form = { date: r.date, weather: r.weather, proj: r.proj, work: r.work, issue: r.issue,
    photos: r.photos, outputs: (r.outputs || []).map(o => ({ qid: o.qid, name: o.name, unit: o.unit, price: o.price, qty: o.qty })) };
  closeMask("detailMask");
  switchTab("form");
}
function askDelete(id) {
  const r = RECORDS.find(x => x.id === id);
  if (!r) return;
  detailId = id;
  document.getElementById("cfmTitle").textContent = "删除日报";
  document.getElementById("cfmDesc").innerHTML =
    `确定删除 <b>${r.no}</b>？<br>${projName(r.proj)} · ${dateBadge(r.date)}<br>删除后不可恢复。`;
  const ok = document.getElementById("cfmOk");
  ok.textContent = "删除";
  ok.className = "btn-danger";
  ok.onclick = function () { doDelete(); };
  document.getElementById("cfmMask").classList.add("open");
}
function doDelete() {
  RECORDS = RECORDS.filter(r => r.id !== detailId);
  closeMask("cfmMask");
  closeMask("detailMask");
  render();
  toast("日报已删除");
}

// ========== 转整改单 ==========
function toZg(id) {
  const r = id ? RECORDS.find(x => x.id === id) : null;
  const proj = r ? r.proj : form.proj;
  const issueEl = document.getElementById("fIssue");
  const issue = r ? r.issue : ((issueEl ? issueEl.value : form.issue) || "");
  if (!proj) { toast("请先选择所属项目"); return; }
  if (!issue.trim()) { toast("请先填写安全质量问题"); return; }
  location.href = "整改单.html?proj=" + encodeURIComponent(proj) + "&issue=" + encodeURIComponent(issue.trim());
}

// ========== 日完工自动生成的日报 ==========
function loadAutoReports() {
  let added = 0;
  const newItems = [];
  try {
    const raw = localStorage.getItem("cj_daily_reports_v1");
    if (!raw) return 0;
    const list = JSON.parse(raw) || [];
    list.forEach(item => {
      const exist = RECORDS.find(r => r.date === item.date && r.proj === item.proj);
      if (exist) {
        exist.work = item.work || exist.work;
        exist.outputs = item.outputs || exist.outputs;
        exist.photos = item.photos || exist.photos;
        exist.source = "completion";
        if (exist.status === "submitted" && !exist.weather) exist.status = "draft";
      } else {
        newItems.push({
          id: 1000 + added, no: makeNo(item.date, added), date: item.date, weather: "", reporter: ME, dept: MY_DEPT,
          proj: item.proj, photos: item.photos || 0, status: "draft", source: "completion",
          createdAt: nowText(), work: item.work || "（日完工自动生成，待补充施工内容）", issue: "",
          outputs: item.outputs || []
        });
        added++;
      }
    });
    if (newItems.length) RECORDS = newItems.concat(RECORDS);
    localStorage.removeItem("cj_daily_reports_v1");
  } catch (e) { }
  return added;
}

// ========== 启动 ==========
switchTab("form");
const autoAdded = loadAutoReports();
if (autoAdded > 0) { render(); toast("已根据日完工自动生成 " + autoAdded + " 条日报"); }
</script>
