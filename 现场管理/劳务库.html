// ============ 工具 ============
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function maskPhone(p){ return p ? p.replace(/(\d{3})\d{4}(\d{3})/, "$1****$2") : "未填手机"; }

let toastTimer = null;
function toast(msg){
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
}

// 保险状态：由到期日推算
function insInfo(p){
  if (!p.insExpire) return { k:"none", txt:"待同步" };
  const end = new Date(p.insExpire + "T23:59:59");
  const days = Math.floor((end - new Date()) / 86400000);
  if (days < 0) return { k:"expired", txt:"保险过期" };
  if (days <= 7) return { k:"warn", txt:"7天到期" };
  return { k:"ok", txt:"保险有效" };
}

// 身份证校验（GB 11643 模 11）
const ID_W = [7,9,10,5,8,4,2,1,6,3,7,9,10,5,8,4,2];
const ID_C = "10X98765432";
function checkId(s){
  if (!/^\d{17}[\dXx]$/.test(s)) return false;
  let sum = 0;
  for (let i = 0; i < 17; i++) sum += parseInt(s[i], 10) * ID_W[i];
  return ID_C[sum % 11] === s[17].toUpperCase();
}
function idMeta(s){
  if (!checkId(s)) return null;
  const y = +s.substr(6,4), m = +s.substr(10,2), d = +s.substr(12,2);
  const sex = (+s[16]) % 2 === 1 ? "男" : "女";
  const now = new Date();
  let age = now.getFullYear() - y;
  if (now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d)) age--;
  return { sex, age, birth: y + "-" + ("0"+m).slice(-2) + "-" + ("0"+d).slice(-2) };
}

function renderTabs(){
  $("libTabs").innerHTML = tabsOf().map(t =>
    `<div class="lt ${libTab===t.k?"on":""}" data-lib="${t.k}" onclick="setLib('${t.k}')">${t.t}<span class="lt-n">${t.n}</span></div>`
  ).join("");
}
function setLib(k){
  if (libTab === k) return;
  libTab = k;
  filter = "all";
  const kw = $("kw");
  if (kw) kw.value = "";
  render();
}

function renderChips(){
  const fs = libTab === "temp" ? FILTER_TEMP : FILTER_LONG;
  $("filterChips").innerHTML = fs.map(f =>
    `<div class="fchip ${filter===f.k?"on":""}" onclick="setFilter('${f.k}')">${f.t}</div>`
  ).join("");
}
function setFilter(k){ filter = k; render(); }

function render(){
  renderTabs();
  renderChips();
  const isTemp = libTab === "temp";
  const kw = ($("kw").value || "").trim();
  let list = PEOPLE.filter(p => (p.type === "临时工") === isTemp);

  if (filter === "self") list = list.filter(p => p.type === "自有");
  else if (filter === "sub") list = list.filter(p => p.type === "外包");
  else if (filter === "grid") list = list.filter(p => p.grid);
  else if (filter === "ins") list = list.filter(p => { const i = insInfo(p); return i.k === "warn" || i.k === "expired" || i.k === "none"; });
  else if (filter === "sealed") list = list.filter(p => p.sealed);

  if (kw) {
    list = list.filter(p =>
      (p.name||"").includes(kw) || (p.phone||"").includes(kw) ||
      (p.trade||"").includes(kw) || (p.dept||"").includes(kw) ||
      (p.team||"").includes(kw) || (p.company||"").includes(kw)
    );
  }

  // 未封存在前
  list.sort((a,b) => (a.sealed?1:0) - (b.sealed?1:0));

  const scope = PEOPLE.filter(p => (p.type === "临时工") === isTemp);
  const total = scope.length;
  const sealedN = scope.filter(p => p.sealed).length;
  const selfN = scope.filter(p => p.type === "自有" && !p.sealed).length;
  const subN = scope.filter(p => p.type === "外包" && !p.sealed).length;
  const gridN = scope.filter(p => p.grid).length;
  if (isTemp) {
    $("listHead").textContent = `共 ${total} 人 · 在册 ${total - sealedN} · 国网准入 ${gridN} · 已封存 ${sealedN}`;
  } else {
    $("listHead").textContent = `共 ${total} 人 · 在册 ${total - sealedN}（自有 ${selfN} / 外包 ${subN}）· 国网准入 ${gridN} · 已封存 ${sealedN}`;
  }
  $("addRow").textContent = isTemp ? "+ 新增临时工" : "+ 新增劳务人员";

  if (!list.length) {
    $("list").innerHTML = `<div class="empty">${isTemp ? "临时工库暂无记录" : "没有匹配的劳务人员"}<br>换个关键词或筛选条件试试</div>`;
    return;
  }

  $("list").innerHTML = list.map(p => {
    const ins = insInfo(p);
    const insCls = "b-" + (ins.k === "expired" ? "exp" : ins.k);
    const bCls = p.type === "自有" ? "b-self" : (p.type === "临时工" ? "b-temp" : "b-sub");
    return `<div class="p-card ${p.sealed?"sealed":""}" data-id="${p.id}">
      <div class="p-top">
        <span class="p-nm">${esc(p.name)}</span>
        <span class="badge ${bCls}">${p.type}</span>
        ${p.grid ? `<span class="badge b-grid">国网准入</span>` : ""}
        <span class="badge ${insCls}">${ins.txt}</span>
        ${p.sealed ? `<span class="badge b-sealed">已封存</span>` : ""}
        <span class="p-trade">${esc(p.trade || "未填工种")}</span>
      </div>
      <div class="p-sub">${maskPhone(p.phone)} · <b>${esc(p.dept || "未填部门")}</b></div>
      ${(p.type === "外包" || p.type === "临时工") && (p.team || p.company) ? `<div class="p-sub">施工队：<b>${esc(p.team || p.company)}</b></div>` : ""}
      ${p.insExpire ? `<div class="p-sub">保险到期 <b>${p.insExpire}</b></div>` : `<div class="p-sub">保险信息待补充</div>`}
      ${CAN_EDIT ? `<div class="p-ops"><span class="p-edit" data-edit="${p.id}">编辑</span></div>` : ""}
    </div>`;
  }).join("");

  // 点卡片 = 只读查看；点编辑 = 需授权后进入编辑
  $("list").querySelectorAll(".p-card").forEach(card => {
    card.addEventListener("click", () => openView(card.dataset.id));
  });
  $("list").querySelectorAll(".p-edit").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      openForm(btn.dataset.edit);
    });
  });
}

// ============ 只读查看 ============
let viewId = null;
function openView(id){
  const p = PEOPLE.find(x => x.id === id);
  if (!p) return;
  viewId = id;
  const ins = insInfo(p);
  $("viewTitle").textContent = p.name + " · 劳务档案";
  $("viewBody").innerHTML = `
    <div class="v-row"><div class="k">姓名</div><div class="v">${esc(p.name)}</div></div>
    <div class="v-row"><div class="k">类型</div><div class="v">${esc(p.type)}</div></div>
    <div class="v-row"><div class="k">施工队</div><div class="v">${esc(p.team || p.company || "—")}</div></div>
    <div class="v-row"><div class="k">国网准入</div><div class="v">${p.grid ? "已通过国网准入" : "未通过"}</div></div>
    <div class="v-row"><div class="k">工种</div><div class="v">${esc(p.trade || "—")}</div></div>
    <div class="v-row"><div class="k">所属部门</div><div class="v">${esc(p.dept || "—")}</div></div>
    <div class="v-row"><div class="k">手机号</div><div class="v">${esc(p.phone || "—")}</div></div>
    <div class="v-row"><div class="k">身份证号</div><div class="v">${p.idCard ? esc(p.idCard.slice(0,6)) + "********" + esc(p.idCard.slice(-4)) : "—"}</div></div>
    <div class="v-row"><div class="k">保险状态</div><div class="v">${ins.txt}${p.insExpire ? "（到期 " + esc(p.insExpire) + "）" : ""}</div></div>
    <div class="v-row"><div class="k">档案状态</div><div class="v">${p.sealed ? "已封存" : "在册"}</div></div>
    <div class="v-tip">此页仅供查看。如需修改档案信息，可由有编辑权限的账号在列表中点「编辑」进入。</div>
  `;
  $("viewMask").classList.add("open");
}
function closeView(){ $("viewMask").classList.remove("open"); viewId = null; }

// ============ 新增 / 编辑 ============
let editId = null, editType = "自有", editGrid = false;
let formVals = { dept:"", trade:"", team:"" };

function openForm(id){
  editId = id || null;
  const p = id ? PEOPLE.find(x => x.id === id) : null;
  editType = p ? p.type : (libTab === "temp" ? "临时工" : "自有");
  editGrid = p ? !!p.grid : false;
  formVals = {
    dept: p ? (p.dept || "") : "",
    trade: p ? (p.trade || "") : "",
    team: p ? (p.team || p.company || "") : ""
  };
  $("formTitle").textContent = p ? "编辑劳务人员" : "新增劳务人员";
  renderForm(p);
  $("formMask").classList.add("open");
}
function closeForm(){
  $("formMask").classList.remove("open");
  editId = null;
}
function renderForm(p){
  const isOut = editType === "外包" || editType === "临时工";
  $("formBody").innerHTML = `
    <div class="f-sec">基本信息</div>
    <div class="f-row">
      <label>姓名<span class="req">*</span></label>
      <input class="f-in" id="fName" placeholder="必填" value="${esc(p ? p.name : "")}">
    </div>
    <div class="f-row">
      <label>所属部门</label>
      <div class="f-pick ${formVals.dept ? "" : "ph"}" id="fDeptShow" onclick="openPicker('dept')">${esc(formVals.dept || "请选择所属部门")}</div>
    </div>
    <div class="f-row">
      <label>手机号</label>
      <input class="f-in" id="fPhone" type="tel" maxlength="11" placeholder="11 位手机号" value="${esc(p ? p.phone : "")}">
    </div>
    <div class="f-row">
      <label>身份证</label>
      <div style="flex:1;min-width:0">
        <input class="f-in" id="fId" maxlength="18" placeholder="18 位身份证号" value="${esc(p ? p.idCard : "")}" oninput="onIdInput()" style="width:100%">
        <div class="id-tip" id="idTip"></div>
      </div>
    </div>
    <div class="f-row">
      <label>工种</label>
      <div class="f-pick ${formVals.trade ? "" : "ph"}" id="fTradeShow" onclick="openPicker('trade')">${esc(formVals.trade || "请选择工种")}</div>
    </div>

    <div class="f-sec">劳务关系</div>
    <div class="f-row">
      <label>国网准入</label>
      <div class="type-chips">
        <div class="tchip ${editGrid?"on":""}" data-g="1" onclick="setGrid(true)">已准入</div>
        <div class="tchip ${editGrid?"":"on"}" data-g="0" onclick="setGrid(false)">未准入</div>
      </div>
    </div>
    <div class="f-row">
      <label>劳务类型</label>
      <div class="type-chips">
        <div class="tchip ${editType==="自有"?"on":""}" data-t="自有" onclick="setType('自有')">自有</div>
        <div class="tchip ${editType==="外包"?"on":""}" data-t="外包" onclick="setType('外包')">外包</div>
        <div class="tchip ${editType==="临时工"?"on":""}" data-t="临时工" onclick="setType('临时工')">临时工</div>
      </div>
    </div>
    <div class="f-row" id="companyRow" ${isOut?"":"style=\"display:none\""}>
      <label>施工队<span class="req">*</span></label>
      <div class="f-pick ${formVals.team ? "" : "ph"}" id="fTeamShow" onclick="openPicker('team')">${esc(formVals.team || "请选择施工队")}</div>
    </div>

    <div class="f-sec">银行信息</div>
    <div class="f-row">
      <label>户名</label>
      <input class="f-in" id="fBankName2" placeholder="工资收款户名" value="${esc(p ? p.bank : "")}">
    </div>
    <div class="f-row">
      <label>银行卡号</label>
      <input class="f-in" id="fCard" inputmode="numeric" placeholder="银行卡号" value="${esc(p ? p.card : "")}">
    </div>
    <div class="f-row">
      <label>开户行</label>
      <input class="f-in" id="fBank" placeholder="如 中国农业银行郴州苏仙支行" value="${esc(p ? p.bankName : "")}">
    </div>

    ${p ? `<div class="sealed-tip" style="margin-top:14px">保险信息由系统带出，本页不录入。当前：${p.insExpire ? insInfo(p).txt + " · 到期 " + p.insExpire : "暂无保单信息"}</div>` : ""}

    ${p ? `<div class="danger-row">
      <button class="btn-danger ${p.sealed?"unseal":""}" onclick="askSeal('${p.id}')">${p.sealed ? "解除封存（可重新派工）" : "封存该人员"}</button>
    </div>` : ""}
    ${p && p.sealed ? `<div class="sealed-tip">该人员已封存，不可再参与日计划派工与日完工点工；解除封存后可继续使用。</div>` : ""}
  `;
  onIdInput();
}
function setGrid(v){
  editGrid = v;
  document.querySelectorAll("#formBody .tchip[data-g]").forEach(el => {
    el.classList.toggle("on", el.getAttribute("data-g") === (v ? "1" : "0"));
  });
}
function setType(t){
  editType = t;
  document.querySelectorAll("#formBody .tchip").forEach(el => {
    el.classList.toggle("on", el.getAttribute("data-t") === t);
  });
  const row = $("companyRow");
  if (row) row.style.display = (t === "外包" || t === "临时工") ? "" : "none";
}
function onIdInput(){
  const v = ($("fId").value || "").trim().toUpperCase();
  const tip = $("idTip");
  if (!v) { tip.textContent = ""; tip.className = "id-tip"; return; }
  const m = idMeta(v);
  if (m) {
    tip.className = "id-tip";
    tip.textContent = `${m.sex} · ${m.age} 岁 · 出生 ${m.birth}`;
  } else {
    tip.className = "id-tip err";
    tip.textContent = v.length === 18 ? "身份证校验不通过，请核对" : "身份证应为 18 位";
  }
}
function saveForm(){
  const name = ($("fName").value || "").trim();
  if (!name) { toast("请填写姓名"); $("fName").focus(); return; }
  const phone = ($("fPhone").value || "").trim();
  if (phone && !/^1\d{10}$/.test(phone)) { toast("手机号应为 11 位数字"); return; }
  const idCard = ($("fId").value || "").trim().toUpperCase();
  if (idCard && !checkId(idCard)) { toast("身份证校验不通过"); return; }
  const needTeam = editType === "外包" || editType === "临时工";
  if (needTeam && !formVals.team) { toast("请选择施工队"); return; }
  const teamMeta = TEAMS.find(t => t.name === formVals.team);

  const row = {
    name,
    dept: formVals.dept,
    phone,
    idCard,
    trade: formVals.trade,
    type: editType,
    grid: editGrid,
    team: needTeam ? formVals.team : "",
    company: needTeam ? (teamMeta ? teamMeta.company : "") : "",
    bank: ($("fBankName2").value || "").trim(),
    card: ($("fCard").value || "").trim(),
    bankName: ($("fBank").value || "").trim(),
    insExpire: editId ? (PEOPLE.find(x => x.id === editId) || {}).insExpire || "" : ""
  };

  if (editId) {
    const p = PEOPLE.find(x => x.id === editId);
    Object.assign(p, row);
    toast("已保存");
  } else {
    row.id = "n" + Date.now().toString().slice(-6);
    row.sealed = false;
    PEOPLE.unshift(row);
    toast("已新增");
  }
  closeForm();
  render();
}

// ============ 选择弹层（部门 / 工种 / 施工队） ============
let pickTarget = null;
const PICK_SRC = {
  dept:  { title:"选择所属部门", data: () => DEPTS },
  trade: { title:"选择工种",     data: () => TRADES },
  team:  { title:"选择施工队",   data: () => TEAMS.map(t => t.name) }
};
function openPicker(kind){
  pickTarget = kind;
  $("pickTitle").textContent = PICK_SRC[kind].title;
  $("pickKw").value = "";
  $("pickKw").placeholder = kind === "dept" ? "搜索部门" : (kind === "trade" ? "搜索工种" : "搜索施工队");
  renderPickList();
  $("pickMask").classList.add("open");
}
function renderPickList(){
  if (!pickTarget) return;
  const kw = ($("pickKw").value || "").trim();
  const all = PICK_SRC[pickTarget].data();
  const cur = formVals[pickTarget] || "";
  const list = kw ? all.filter(v => v.includes(kw)) : all;
  if (!list.length) {
    $("pickList").innerHTML = `<div class="empty" style="margin:28px 0">没有匹配项<br>换个关键词试试</div>`;
    return;
  }
  $("pickList").innerHTML = list.map(v =>
    `<div class="pk-item ${v===cur?"on":""}" onclick="pickItem('${v}')">${esc(v)}${v===cur?`<span class="pk-ck">✓</span>`:""}</div>`
  ).join("");
}
function pickItem(v){
  formVals[pickTarget] = v;
  const map = { dept:"fDeptShow", trade:"fTradeShow", team:"fTeamShow" };
  const el = $(map[pickTarget]);
  if (el) { el.textContent = v; el.classList.remove("ph"); }
  closePicker();
}
function closePicker(){
  $("pickMask").classList.remove("open");
  pickTarget = null;
}

// ============ 封存 / 解封 ============
let cfmCb = null;
function openConfirm(title, desc, cb){
  $("cfmTitle").textContent = title;
  $("cfmDesc").textContent = desc;
  cfmCb = cb;
  $("cfmMask").classList.add("open");
}
function closeConfirm(){
  $("cfmMask").classList.remove("open");
  cfmCb = null;
}
function doConfirm(){
  if (cfmCb) cfmCb();
  closeConfirm();
}
function askSeal(id){
  const p = PEOPLE.find(x => x.id === id);
  if (!p) return;
  if (p.sealed) {
    openConfirm("解除封存", `解除后「${p.name}」可重新参与日计划派工与日完工点工。`, () => {
      p.sealed = false;
      closeForm();
      render();
      toast("已解除封存");
    });
  } else {
    openConfirm("封存人员", `封存后「${p.name}」不能再被日计划、日完工派工，记录仍保留在列表，可随时解除封存。`, () => {
      p.sealed = true;
      closeForm();
      render();
      toast("已封存");
    });
  }
}

// ============ 初始化 ============
function goBack(){
  location.href = "../site.html";
}
render();
$("formMask").addEventListener("click", function(e){ if (e.target === this) closeForm(); });
$("cfmMask").addEventListener("click", function(e){ if (e.target === this) closeConfirm(); });
</script>
</body>
</html>
