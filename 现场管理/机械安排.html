  .pane { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 8px; }
  .hide { display: none; }

  .card { background: #fff; margin: 10px 12px 0; border-radius: 12px; padding: 12px 14px; cursor: pointer; }

  .meta { font-size: 11px; color: #3a3f47; letter-spacing: .2px; }

  .b-plan { background: #dbeafe; color: #1d4ed8; }
  .b-on { background: #dcfce7; color: #15803d; }
  .b-done { background: #f1f2f4; color: #6b7280; }

  .filter-wrap { padding: 10px 12px 2px; }
  .search { width: 100%; height: 36px; border: 1px solid #e5e9ef; border-radius: 18px; padding: 0 14px; font-size: 13px; outline: none; background: #fff; font-family: inherit; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 9px; }
  .chip { padding: 6px 12px; border-radius: 14px; border: 1px solid #eceff3; background: #fff; font-size: 12px; color: #555; cursor: pointer; }
  .chip.on { background: #eef4ff; border-color: #2b7cff; color: #2b7cff; font-weight: 600; }

  .bottom-bar {
    flex: none; padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    background: #fff; border-top: 1px solid #eee;
  }
  .btn-primary { width: 100%; height: 50px; border: none; border-radius: 25px; background: #2b7cff; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }

  .fld-ta:focus { border-color: #2b7cff; background: #fff; }

  .fld-pick .arr { color: #c9cdd4; font-size: 13px; }

  .slot { border: 1px solid #e9edf3; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: #fbfcfe; }
  .slot-h { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: #2b7cff; margin-bottom: 8px; }

</style>

// ====== 工具 ======
function pad2(n) { return String(n).padStart(2, "0"); }
function todayStr(off) {
  const d = new Date();
  d.setDate(d.getDate() + (off || 0));
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function fmtDate(s) {
  if (!s) return "—";
  const d = new Date(s + "T00:00:00");
  if (isNaN(d.getTime())) return s;
  const wk = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][d.getDay()];
  return pad2(d.getMonth() + 1) + "/" + pad2(d.getDate()) + " " + wk;
}
function money(n) { return Math.round(n || 0).toLocaleString("en-US"); }
function projOf(code) { return PROJECT_LIB.find(p => p.code === code); }
function reqOf(no) { return REQS.find(r => r.no === no); }
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 1800);
}
function openMask(id) { document.getElementById(id).classList.add("open"); }
function closeMask(id) { document.getElementById(id).classList.remove("open"); }

// ====== 持久化 ======
function loadStore() {
  try {
    const req = JSON.parse(localStorage.getItem(LS_REQ) || "null");
    if (req && Array.isArray(req) && req.length) REQS = req;
  } catch (e) {}
  try {
    const asg = JSON.parse(localStorage.getItem(LS_ASG) || "null");
    if (asg && Array.isArray(asg) && asg.length) ASSIGNS = asg;
  } catch (e) {}
}
function saveAssigns() {
  try { localStorage.setItem(LS_ASG, JSON.stringify(ASSIGNS)); } catch (e) {}
}

function switchTab(k) {
  const wait = k === "wait";
  document.getElementById("paneWait").classList.toggle("hide", !wait);
  document.getElementById("paneRec").classList.toggle("hide", wait);
  document.getElementById("tabWait").classList.toggle("on", wait);

// ====== 待安排 ======
function totalOf(r) { return Object.keys(r.machines || {}).reduce((s, k) => s + (r.machines[k] || 0), 0); }
function arrangedCount(no) { return ASSIGNS.filter(a => a.reqNo === no).length; }
function pendingSlots(r) {
  const out = [];
  Object.keys(r.machines || {}).forEach(t => {
    const n = r.machines[t];
    for (let i = 0; i < n; i++) {
      const nm = n > 1 ? t + MACH_ORD[i] : t;
      const done = ASSIGNS.filter(a => a.reqNo === r.no && a.type === nm).length;
      if (!done) out.push({ type: nm, plate: "" });
    }
  });
  return out;
}
function renderWait() {
  const list = REQS.filter(r => !r.reject);
  const box = document.getElementById("waitList");
  const rows = list.filter(r => pendingSlots(r).length).sort((a, b) => {
    const da = arrangedCount(a.no), db = arrangedCount(b.no);
    return (da ? 1 : 0) - (db ? 1 : 0);
  });
  if (!rows.length) {
    box.innerHTML = `<div class="empty">没有待安排的机械申请<br>可直接点底部「＋ 新增安排」安排机械</div>`;
    return;
  }
  box.innerHTML = rows.map(r => {
    const total = totalOf(r), done = arrangedCount(r.no);
    const st = done === 0 ? `<span class="badge b-wait">待安排</span>`
             : done < total ? `<span class="badge b-wait">部分安排 ${done}/${total}</span>`
             : `<span class="badge b-plan">已安排</span>`;
    const mach = Object.keys(r.machines).map(t => `${t} ${r.machines[t]} 台`).join(" · ");
    return `<div class="card" onclick="openArrFromReq('${r.no}')">
      <div class="card-head"><div class="meta">${r.no} · ${String(r.created || "").slice(5)}</div>${st}</div>
      <div class="p-name">${r.project}</div>
      <div class="mach-hl"><span class="k">申请：</span>${mach}</div>
      <div class="line"><span>用机：</span>${r.from ? r.from.slice(5, 16) : "—"} ${r.from ? "至 " + String(r.to || "").slice(5, 16) : ""}</div>
      <div class="line"><span>申请人：</span>${r.applicant || "—"} · ${r.dept || "—"}</div>
      <div class="line"><span>地点：</span>${r.addr || "待定"}</div>
      <div class="ops">
        <button class="btn-sm main" onclick="openArrFromReq('${r.no}');event.stopPropagation();">去安排</button>
      </div>
    </div>`;
  }).join("");
}

// ====== 安排记录 ======
let recFilter = "all";
const REC_FILTERS = [
  { k: "all", t: "全部" },
  { k: "today", t: "今天" },
  { k: "week", t: "本周" },
  { k: "plan", t: "待进场" },
  { k: "on", t: "已进场" },
  { k: "done", t: "已完成" }
];
function weekRange() {
  const d = new Date(), w = (d.getDay() + 6) % 7;
  const s = new Date(d); s.setDate(d.getDate() - w);
  const e = new Date(s); e.setDate(s.getDate() + 6);
  const f = x => x.getFullYear() + "-" + pad2(x.getMonth() + 1) + "-" + pad2(x.getDate());
  return [f(s), f(e)];
}
function renderRecords() {
  document.getElementById("recChips").innerHTML = REC_FILTERS.map(f =>
    `<div class="chip ${recFilter === f.k ? "on" : ""}" onclick="setFilter('${f.k}')">${f.t}</div>`).join("");
  const kw = (document.getElementById("recKw").value || "").trim();
  const [ws, we] = weekRange();
  const today = todayStr(0);
  let rows = ASSIGNS.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  if (recFilter === "today") rows = rows.filter(a => a.date === today);
  if (recFilter === "week") rows = rows.filter(a => a.date >= ws && a.date <= we);
  if (recFilter === "plan" || recFilter === "on" || recFilter === "done") rows = rows.filter(a => a.status === recFilter);
  if (kw) rows = rows.filter(a => a.project.indexOf(kw) >= 0 || a.plate.indexOf(kw) >= 0 || a.rental.indexOf(kw) >= 0 || (a.type || "").indexOf(kw) >= 0);
  const box = document.getElementById("recList");
  if (!rows.length) {
    box.innerHTML = `<div class="empty">暂无符合条件的安排记录</div>`;
    return;
  }
  box.innerHTML = rows.map(a => {
    const st = STATUS[a.status] || STATUS.plan;
    const src = a.reqNo ? a.reqNo : "直接安排";
    return `<div class="card" onclick="openEdit('${a.id}')">
      <div class="card-head"><div class="meta">${src} · ${String(a.createdAt || "").slice(5)}</div>
        <span class="badge ${st.cls}">${st.name}</span></div>
      <div class="p-name">${a.project}</div>
      <div class="mach-hl"><span class="k">机械：</span>${a.type} · ${a.plate}</div>
      <div class="line"><span>租赁：</span>${a.rental} · 单价 ${money(a.price)} 元/台班</div>
      <div class="line"><span>安排日期：</span>${fmtDate(a.date)}</div>
      ${a.note ? `<div class="line"><span>备注：</span>${a.note}</div>` : ""}
    </div>`;
  }).join("");
}
function setFilter(k) { recFilter = k; renderRecords(); }

let editId = null;

let selectedRent = "";

function blankForm() {
  return { reqNo: null, code: "", project: "", date: todayStr(0), type: MACHINE_TYPES[0], rental: "", price: MACHINE_PRICE[MACHINE_TYPES[0]],
    note: "", status: "plan", slots: [{ type: MACHINE_TYPES[0], plate: "", rental: "", price: MACHINE_PRICE[MACHINE_TYPES[0]] }] };
}
function openForm() {
  formMode = "new";
  editId = null;
  form = blankForm();
  selectedProj = null;
  selectedRent = "";
  rentSlotIdx = -1;
  buildForm();
  openMask("formMask");
}
function openArrFromReq(no) {
  const r = reqOf(no);
  if (!r) { openForm(); return; }
  const slots = pendingSlots(r);
  if (!slots.length) { toast("该申请的机械已全部安排"); return; }
  formMode = "req";
  editId = null;
  form = blankForm();
  form.reqNo = r.no;
  form.code = r.code || "";
  form.project = r.project || "";
  form.note = "";
  form.slots = slots.map(s => ({ type: s.type, plate: s.plate || "", rental: "", price: MACHINE_PRICE[s.type] || MACHINE_PRICE[slots[0].type] || 0 }));
  form.date = r.from ? r.from.slice(0, 10) : todayStr(0);
  form.type = slots[0].type;
  selectedProj = projOf(r.code) || { code: r.code, name: r.project, manager: "" };
  selectedRent = "";
  rentSlotIdx = -1;
  buildForm();
  openMask("formMask");
}
function openEdit(id) {
  const a = ASSIGNS.find(x => x.id === id);
  if (!a) return;
  formMode = "edit";
  editId = id;
  form = { reqNo: a.reqNo || null, code: a.code, project: a.project, date: a.date, type: a.type, rental: a.rental,
    price: a.price, note: a.note || "", status: a.status,
    slots: [{ type: a.type, plate: a.plate, rental: a.rental, price: a.price }] };
  selectedProj = projOf(a.code) || { code: a.code, name: a.project, manager: "" };
  selectedRent = a.rental;
  rentSlotIdx = -1;
  buildForm();
  openMask("formMask");
}
function buildForm() {
  document.getElementById("formTitle").textContent =
    formMode === "edit" ? "编辑安排" : formMode === "req" ? "安排机械" : "新增安排";

    const req = form.reqNo ? reqOf(form.reqNo) : null;

      按申请台数逐台填写车牌号与单价，安排信息将回写到申请人的「我的申请」</div>`;
  } else if (formMode === "edit") {
    html += `<div class="src-tip">记录 <b>${form.reqNo || "直接安排"}</b> · 可修改日期、租赁公司、车牌、单价与状态</div>`;
  }

  // 项目

      <div class="chips" id="typeChips">${MACHINE_TYPES.map(t =>
        `<div class="chip ${form.type === t ? "on" : ""}" onclick="setType('${t}')">${t}</div>`).join("")}</div>
    </div>`;
  }

  // 台位车牌
  html += `<div class="fld">
    <div class="fld-l"><i>*</i>车牌号</div>
    ${form.slots.map((s, i) => `<div class="slot">
      <div class="slot-h">${form.slots.length > 1 ? s.type : (s.type || form.type)}
        ${(formMode === "new" && form.slots.length > 1) ? `<span class="del" onclick="delSlot(${i})">删除</span>` : ""}</div>
      <input class="fld-in" placeholder="如 湘L·E6666" value="${s.plate}" oninput="setPlate(${i}, this.value)">
      ${form.slots.length > 1 ? `<div class="slot-rent ${s.rental ? "on" : "ph"}" onclick="openRentPick(${i});event.stopPropagation();">${s.rental || (form.rental ? "默认 " + form.rental : "该台租赁公司（默认同下方）")}<span class="arr">›</span></div>` : ""}
      <div class="slot-price">
        <span class="lbl">单价</span>
        <input type="text" inputmode="decimal" value="${s.price || ''}" placeholder="该台单价" onclick="event.stopPropagation();" oninput="setSlotPrice(${i}, this.value)">
        <span class="unit">元/台班</span>
      </div>
    </div>`).join("")}
    ${formMode === "new" ? `<button class="add-slot" onclick="addSlot()">＋ 增加一台</button>` : ""}
  </div>`;

  // 安排日期
  const ds = [
    { o: 0, t: "今天" }, { o: 1, t: "明天" }, { o: 2, t: "后天" }, { o: 3, t: "大后天" }
  ];
  html += `<div class="fld">
    <div class="fld-l"><i>*</i>安排日期</div>
    <div class="chips">${ds.map(d => {
      const v = todayStr(d.o);
      return `<div class="chip ${form.date === v ? "on" : ""}" onclick="setDate('${v}')">${d.t} ${fmtDate(v)}</div>`;
    }).join("")}<div class="chip ${ds.every(d => todayStr(d.o) !== form.date) ? "on" : ""}" onclick="pickOtherDate()">其他日期${ds.every(d => todayStr(d.o) !== form.date) ? " " + fmtDate(form.date) : ""}</div></div>
    <input type="date" id="datePick" onchange="setDate(this.value)" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;">
  </div>`;

  // 租赁公司（默认值，逐台可单独指定）
  html += `<div class="fld">
    <div class="fld-l"><i>*</i>默认租赁公司</div>
    <div class="fld-pick ${form.rental ? "" : "ph"}" onclick="openRentPick(-1)">${form.rental || "未单独指定的台位按此公司"}<span class="arr">›</span></div>
  </div>`;

  // 备注
  html += `<div class="fld">
    <div class="fld-l">备注</div>
    <textarea class="fld-ta" rows="3" placeholder="如：司机联系方式、进场时间要求、带何种属具" oninput="setNote(this.value)">${form.note}</textarea>
  </div>`;

  // 状态（编辑时）
  if (formMode === "edit") {
    html += `<div class="fld">

    : `<button class="btn-secondary" onclick="closeForm()">取消</button>
       <button class="btn-main" onclick="saveForm()">保存安排</button>`;
  const dp = document.getElementById("datePick");
  if (dp) { dp.min = todayStr(0); dp.value = form.date; }

function closeForm() {
  closeMask("formMask");
  form = null;
  editId = null;
}
function setType(t) {
  const oldDefault = MACHINE_PRICE[form.type];
  form.type = t;
  form.slots.forEach(s => {
    if (!s.price || s.price === oldDefault) s.price = MACHINE_PRICE[t] || s.price;
  });
  if (formMode === "new" && form.slots.length === 1) form.slots[0].type = t;
  buildForm();
}
function setPlate(i, v) { if (form.slots[i]) form.slots[i].plate = v.trim(); }
function setSlotPrice(i, v) {
  if (!form.slots[i]) return;
  const n = parseFloat(String(v).replace(/[^\d.]/g, ""));
  form.slots[i].price = isNaN(n) ? 0 : n;
  if (form.slots.length === 1) form.price = form.slots[i].price;
}
function addSlot() {
  if (form.slots.length >= 8) { toast("单次最多增加 8 台"); return; }
  form.slots.push({ type: form.type, plate: "", rental: "", price: MACHINE_PRICE[form.type] || 0 });
  buildForm();
}
function delSlot(i) { form.slots.splice(i, 1); buildForm(); }
function setDate(v) { if (!v) return; form.date = v; buildForm(); }
function pickOtherDate() {
  const dp = document.getElementById("datePick");
  if (dp) { try { dp.showPicker ? dp.showPicker() : dp.click(); } catch (e) { dp.click(); } }
}
function setPrice(v) {
  const n = parseFloat(String(v).replace(/[^\d.]/g, ""));
  form.price = isNaN(n) ? 0 : n;
  if (form.slots.length === 1) form.slots[0].price = form.price;
}
function setNote(v) { form.note = v; }
function setStatus(k) { form.status = k; buildForm(); }

function rentCur() {
  if (!form) return "";
  if (rentSlotIdx >= 0 && form.slots[rentSlotIdx]) return form.slots[rentSlotIdx].rental || "";
  return form.rental || "";
}
function openRentPick(i) {
  if (!form) return;
  rentSlotIdx = (i === undefined || i === null) ? -1 : Number(i);
  const s = rentSlotIdx >= 0 ? form.slots[rentSlotIdx] : null;
  const tip = document.getElementById("rentTip");
  if (tip) {
    tip.innerHTML = s
      ? `为第 ${rentSlotIdx + 1} 台「${s.type}」单独指定租赁公司，不同台位可分属不同公司`
      : "未单独指定租赁公司的台位，统一使用此公司";
  }
  document.getElementById("rentKw").value = rentCur();
  renderRentPick();
  openMask("rentMask");
}
function renderRentPick() {
  const kw = (document.getElementById("rentKw").value || "").trim();
  const cur = rentCur();
  const list = RENTALS.filter(x => !kw || x.indexOf(kw) >= 0);
  let html = list.map(x => `<div class="pick-item ${cur === x ? "on" : ""}" onclick="pickRent('${x}')">
      <div class="txt"><div class="n">${x}</div></div><div class="tick">✓</div></div>`).join("");
  if (kw && RENTALS.indexOf(kw) < 0) {
    html += `<div class="pick-item" onclick="pickRent('${kw.replace(/'/g, "")}')">
      <div class="txt"><div class="n">使用「${kw}」</div><div class="d">该名称将记入本次安排</div></div><div class="tick">✓</div></div>`;
  }
  if (!html) html = `<div class="empty" style="margin:24px 0;">输入公司名称后可选用</div>`;
  document.getElementById("rentPick").innerHTML = html;
}
function pickRent(x) {
  if (!form) return;
  if (rentSlotIdx >= 0 && form.slots[rentSlotIdx]) {
    form.slots[rentSlotIdx].rental = x;
  } else {
    form.rental = x;
  }
  rentSlotIdx = -1;
  closeMask("rentMask");
  buildForm();
}

// ====== 保存 ======
function plateDup(plate, date, ignoreId) {
  if (!plate) return false;
  return ASSIGNS.some(a => a.id !== ignoreId && a.date === date && a.plate.replace(/\s/g, "") === plate.replace(/\s/g, ""));
}
function saveForm() {
  if (!form) return;
  if (!form.project) { toast("请先选择项目"); return; }
  if (!form.date) { toast("请选择安排日期"); return; }
  if (!form.rental && !form.slots.every(s => s.rental)) { toast("请选择租赁公司"); return; }
  const filled = form.slots.filter(s => s.plate);
  if (!filled.length) { toast("请填写车牌号"); return; }
  for (let i = 0; i < form.slots.length; i++) {
    const s = form.slots[i];
    if (!s.plate) { toast("第 " + (i + 1) + " 台车牌号未填写"); return; }
    if (!s.price || s.price <= 0) { toast("第 " + (i + 1) + " 台「" + (s.type || form.type) + "」单价未填写"); return; }
    if (plateDup(s.plate, form.date, editId)) { toast("车牌 " + s.plate + " 在 " + fmtDate(form.date) + " 已有安排"); return; }
  }
  if (formMode === "edit") {
    const a = ASSIGNS.find(x => x.id === editId);
    if (!a) return;
    a.code = form.code; a.project = form.project; a.date = form.date;
    a.rental = form.slots[0].rental || form.rental;
    a.price = form.slots[0].price || form.price; a.note = form.note; a.status = form.status;
    a.type = form.slots[0].type || form.type;
    a.plate = form.slots[0].plate;
    saveAssigns();
    closeForm();
    toast("已保存修改");
    refreshAll();
    return;
  }
  const req = formMode === "req" && form.reqNo ? reqOf(form.reqNo) : null;
  const items = [];
  form.slots.forEach(s => {
    items.push({
      id: "A" + SEQ++, reqNo: req ? req.no : null, project: form.project, code: form.code,
      type: req ? s.type : (form.slots.length > 1 ? form.type + MACH_ORD[items.length] : form.type),
      date: form.date, rental: s.rental || form.rental, plate: s.plate, price: s.price || form.price,
      note: form.note, status: req ? "plan" : "plan", creator: ME, createdAt: nowText()
    });
  });
  ASSIGNS = items.concat(ASSIGNS);
  saveAssigns();
  closeForm();
  toast(req ? "已安排 " + items.length + " 台机械，已通知申请人" : "已新增安排");
  refreshAll();
}
function nowText() {
  const d = new Date();
  return todayStr(0) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function refreshAll() {
  renderWait();
  renderRecords();
}

// ===== 从「日计划-机械进度」跳进来：带 ?req=单号 直接打开安排 =====
(function openFromDayPlan() {
  const reqNo = new URLSearchParams(location.search || "").get("req");
  if (!reqNo) return;
  switchTab("wait");
  const r = reqOf(reqNo);
  if (!r) { toast("没找到这张机械申请单 " + reqNo); return; }
  setTimeout(() => openArrFromReq(reqNo), 60);
})();

// ====== 删除 ======
let delId = null;
function askDelete(id) {
  delId = id;
  const a = ASSIGNS.find(x => x.id === id);
  document.getElementById("delText").innerHTML =
    `确定删除「${a.project} · ${a.type} ${a.plate}」这条安排？<br>
     <span style="color:#98a2b3;font-size:12px;">删除后该机械回到待安排，可重新安排。</span>`;
  openMask("delMask");
}
function confirmDelete() {
  if (!delId) return;
  ASSIGNS = ASSIGNS.filter(a => a.id !== delId);
  delId = null;
  saveAssigns();
  closeMask("delMask");
  if (document.getElementById("formMask").classList.contains("open")) closeForm();
  toast("已删除该安排");
  refreshAll();
}

// ====== 启动 ======
(function init() {
  loadStore();
  // 已有安排记录回写申请单状态
  REQS.forEach(r => {
    const total = totalOf(r), done = arrangedCount(r.no);
    if (!r.reject && done > 0) r.status = done >= total ? "plan" : "part";
  });
  renderWait();
  renderRecords();
  if ((location.hash || "").indexOf("new") >= 0) setTimeout(() => openForm(), 60);
})();
</script>
