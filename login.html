<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - 郴江电力管理系统</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#e9ecf1; }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }

  /* 手机外壳 */
  .phone {
    width:375px; height:812px; background:#fff; border-radius:36px; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.18); position:relative; display:flex; flex-direction:column;
  }

  /* 状态栏 */
  .statusbar {
    height:44px; background:#fff; display:flex; align-items:center; justify-content:space-between;
    padding:0 22px; font-size:14px; font-weight:600; color:#000; flex-shrink:0;
  }
  .statusbar .right { display:flex; align-items:center; gap:6px; font-size:12px; }
  .statusbar svg { display:block; }

  /* 登录主体：蓝紫→粉灰渐变 */
  .login-body {
    flex:1; background:linear-gradient(180deg,#5B7BB8 0%,#8E8FB3 45%,#C9A9A6 100%);
    padding:60px 32px 40px; display:flex; flex-direction:column;
  }
  .logo-area { text-align:center; margin-bottom:60px; }
  .system-title {
    color:#fff; font-size:22px; font-weight:600; letter-spacing:4px;
    text-shadow:0 2px 6px rgba(0,0,0,.15);
  }

  .field { margin-bottom:26px; display:flex; align-items:center; }
  .field label { color:#fff; font-size:15px; width:60px; letter-spacing:2px; }
  .field input {
    flex:1; height:42px; border:none; border-radius:2px; padding:0 12px;
    font-size:14px; outline:none; background:#fff; color:#333;
  }

  .login-btn {
    margin-top:50px; height:46px; background:#2B9CDB; color:#fff; border:none;
    border-radius:4px; font-size:16px; letter-spacing:8px; text-indent:8px; cursor:pointer;
    box-shadow:0 4px 12px rgba(43,156,219,.35); transition:transform .1s;
  }
  .login-btn:active { transform:scale(.98); }

  .toast {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    background:rgba(0,0,0,.75); color:#fff; padding:10px 18px; border-radius:6px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>
  <div class="phone">
    <!-- 状态栏 -->
    <div class="statusbar">
      <span>9:41 AM</span>
      <div class="right">
        <!-- 信号 -->
        <svg width="16" height="11" viewBox="0 0 16 11" fill="#000"><rect x="0" y="7" width="3" height="4"/><rect x="4" y="5" width="3" height="6"/><rect x="8" y="2.5" width="3" height="8.5"/><rect x="12" y="0" width="3" height="11"/></svg>
        <!-- wifi -->
        <svg width="15" height="11" viewBox="0 0 15 11" fill="#000"><path d="M7.5 11L4 7c1.8-1.8 4.2-1.8 6 0l-3.5 4zM2 5.5c3-3 8-3 11 0l-1.8 1.8c-2-2-5.4-2-7.4 0L2 5.5zM0 3c4.5-4.5 10.5-4.5 15 0l-1.8 1.8c-4-4-7.4-4-11.4 0L0 3z"/></svg>
        <span>100%</span>
        <!-- 电池 -->
        <svg width="22" height="11" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" fill="none" stroke="#000"/><rect x="2" y="2" width="17" height="8" rx="1" fill="#000"/><rect x="22" y="3.5" width="2" height="5" rx="0.8" fill="#000"/></svg>
      </div>
    </div>

    <!-- 登录主体 -->
    <div class="login-body">
      <div class="logo-area">
        <div class="system-title">郴江电力管理系统</div>
      </div>

      <div class="field">
        <label>账&nbsp;&nbsp;号:</label>
        <input type="text" id="account" value="admin" placeholder="请输入账号">
      </div>
      <div class="field">
        <label>密&nbsp;&nbsp;码:</label>
        <input type="password" id="password" placeholder="请输入密码">
      </div>

      <button class="login-btn" onclick="doLogin()">登&nbsp;&nbsp;录</button>
    </div>

    <div class="toast" id="toast"></div>
  </div>

<script>
  function doLogin(){
    var acc = document.getElementById('account').value.trim();
    var pwd = document.getElementById('password').value.trim();
    if(!acc || !pwd){ showToast('请输入账号和密码'); return; }
    showToast('登录成功，正在进入工作台...');
    setTimeout(function(){ location.href='workbench.html'; }, 800);
  }
  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1200);
  }
</script>
</body>
</html>
