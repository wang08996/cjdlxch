<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>现场管理 - 郴江电力管理系统</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#e9ecf1; }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }

  .phone {
    width:375px; height:812px; background:#f4f6f9; border-radius:36px; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.18); position:relative; display:flex; flex-direction:column;
  }
  .statusbar {
    height:44px; background:#fff; display:flex; align-items:center; justify-content:space-between;
    padding:0 22px; font-size:14px; font-weight:600; color:#000; flex-shrink:0;
  }
  .statusbar .right { display:flex; align-items:center; gap:6px; font-size:12px; }

  .navbar {
    height:44px; background:#fff; display:flex; align-items:center; justify-content:center;
    border-bottom:1px solid #f0f0f0; flex-shrink:0;
  }
  .navbar .title { font-size:17px; font-weight:600; color:#222; }

  .content { flex:1; overflow-y:auto; padding-bottom:70px; }

  /* 应用入口 */
  .section-title { font-size:15px; font-weight:600; color:#222; margin:14px 16px 10px; }
  .app-row {
    background:#fff; margin:0 12px; border-radius:8px; padding:16px 4px 14px;
    display:grid; grid-template-columns:repeat(4,1fr); row-gap:16px;
  }
  .app-item { display:flex; flex-direction:column; align-items:center; cursor:pointer; text-decoration:none; color:inherit; }
  .app-icon {
    width:46px; height:46px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    margin-bottom:6px; color:#fff;
  }
  .app-icon svg { width:24px; height:24px; }
  .app-icon img { width:26px; height:26px; object-fit:contain; display:block; }
  .app-label { font-size:12px; color:#333; }
  .app-dot { position:absolute; top:-5px; right:-5px; min-width:17px; height:17px; line-height:17px; padding:0 4px;
    text-align:center; font-size:10px; font-weight:600; color:#fff; background:#ef4444; border-radius:9px; }
  .ic-blue { background:linear-gradient(135deg,#4A90E2,#2B7CDB); }
  .ic-orange { background:linear-gradient(135deg,#F5A962,#E8743C); }
  .ic-green { background:linear-gradient(135deg,#5DC98A,#3BAF6F); }
  .ic-purple { background:linear-gradient(135deg,#A78BFA,#7C3AED); }
  .ic-teal { background:linear-gradient(135deg,#41C7CE,#128D96); }
  .ic-lan { background:#f1f6ff; border:1px solid #dbe8fb; position:relative; }
  .ic-slate { background:linear-gradient(135deg,#8595B8,#5C6E96); }
  .ic-safe { background:#fff7e6; border:1px solid #f5e3bd; }

  /* 我的项目 */
  .proj-head {
    display:flex; justify-content:space-between; align-items:center;
    margin:18px 16px 10px;
  }
  .proj-head .title { font-size:15px; font-weight:600; color:#222; }
  .proj-head .more { font-size:12px; color:#999; cursor:pointer; }

  .proj-list { background:#fff; margin:0 12px; border-radius:8px; }
  .proj-item {
    display:flex; align-items:center; padding:14px; border-bottom:1px solid #f2f2f2; cursor:pointer;
  }
  .proj-item:last-child { border-bottom:none; }
  .proj-avatar {
    width:42px; height:42px; border-radius:8px; flex-shrink:0; margin-right:12px;
    display:flex; align-items:center; justify-content:center;
    background:#E8F1FB; color:#2B7CDB; font-size:16px; font-weight:600;
  }
  .proj-info { flex:1; min-width:0; }
  .proj-name { font-size:14px; color:#222; font-weight:500; line-height:1.4; }
  .proj-tags { margin-top:5px; font-size:11px; color:#999; }
  .proj-tags span { margin-right:8px; }

  /* 底部Tab栏 */
  .tabbar {
    position:absolute; left:0; right:0; bottom:0; height:62px; background:#fff;
    border-top:1px solid #eee; display:flex; padding-bottom:6px;
  }
  .tab-item {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:11px; color:#888; cursor:pointer; position:relative; text-decoration:none;
  }
  .tab-item.active { color:#2B7CDB; }
  .tab-item svg { width:22px; height:22px; margin-bottom:3px; }
  .tab-badge {
    position:absolute; top:4px; right:calc(50% - 18px); background:#E74C3C; color:#fff;
    font-size:10px; min-width:16px; height:16px; line-height:16px; border-radius:8px;
    text-align:center; padding:0 4px;
  }

  .toast {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    background:rgba(0,0,0,.75); color:#fff; padding:10px 18px; border-radius:6px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:99;
  }
  .toast.show { opacity:1; }
</style>
</head>
